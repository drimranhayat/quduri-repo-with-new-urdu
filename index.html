ْ بَيْعِهِ وَقَسَمَهُ بَيْنَ غُرَمَائِهِ بِالْحِصَصِ",null,"اور اگر وہ خود بیچنے سے انکار کرے تو اس کا مال بیچ کر قرض خواہوں میں حصوں کے مطابق تقسیم کر دے گا"],["m","فَإِنْ أَقَرَّ فِي حَالِ الْحَجْرِ بِإِقْرَارٍ لَزِمَهُ ذَلِكَ بَعْدَ قَضَاءِ الدُّيُونِ",null,"اگر اس نے حجر کی حالت میں کوئی اقرار کیا تو وہ قرضوں کی ادائیگی کے بعد اس پر لازم ہو گا"],["m","وَيُنْفَقُ عَلَى الْمُفْلِسِ مِنْ مَالِهِ وَعَلَى زَوْجَتِهِ وَأَوْلَادِهِ الصِّغَارِ وَذَوِي أَرْحَامِهِ",null,"مفلس پر اس کے مال سے خرچ کیا جائے گا، نیز اس کی بیوی، چھوٹے بچوں اور ذو رحم رشتہ داروں پر بھی"],["f","حَبْسُ الْمَدِينِ",null,"مقروض کو قید کرنا"],["m","وَإِنْ لَمْ يُعْرَفْ لِلْمُفْلِسِ مَالٌ وَطَلَبَ غُرَمَاؤُهُ حَبْسَهُ وَهُوَ يَقُولُ: لَا مَالَ لِي",null,"اگر مفلس کا کوئی مال معلوم نہ ہو اور قرض خواہ اسے قید کرنے کا مطالبہ کریں جبکہ وہ کہے کہ میرے پاس مال نہیں"],["m","حَبَسَهُ الْحَاكِمُ فِي كُلِّ دَيْنٍ الْتَزَمَهُ بَدَلًا عَنْ مَالٍ حَصَلَ فِي يَدِهِ كَثَمَنِ مَبِيعٍ وَبَدَلِ الْقَرْضِ",null,"تو حاکم اسے ہر اس قرض میں قید کرے گا جو اس نے ایسے مال کے بدلے اپنے ذمے لیا جو اس کے ہاتھ میں آیا، جیسے مبیع کا ثمن اور قرض کا بدل"],["m","وَفِي كُلِّ دَيْنٍ الْتَزَمَهُ بِعَقْدٍ كَالْمَهْرِ وَالْكَفَالَةِ",null,"اور ہر اس قرض میں بھی جو اس نے کسی عقد کے ذریعے اپنے ذمے لیا، جیسے مہر اور کفالت"],["m","وَلَمْ يَحْبِسْهُ فِيمَا سِوَى ذَلِكَ كَعِوَضِ الْمَغْصُوبِ وَأَرْشِ الْجِنَايَاتِ إِلَّا أَنْ تَقُومَ الْبَيِّنَةُ أَنَّ لَهُ مَالًا",null,"ان کے علاوہ دیگر قرضوں میں قید نہیں کرے گا، جیسے مغصوب کا عوض اور جنایات کا تاوان، الا یہ کہ گواہی قائم ہو جائے کہ اس کے پاس مال ہے"],["m","وَإِذَا حَبَسَهُ الْقَاضِي شَهْرَيْنِ أَوْ ثَلَاثَةً سَأَلَ عَنْ حَالِهِ",null,"جب قاضی اسے دو یا تین ماہ قید رکھ لے تو اس کا حال دریافت کرے"],["m","فَإِنْ لَمْ يَنْكَشِفْ لَهُ مَالٌ خَلَّى سَبِيلَهُ",null,"اگر اس کا کوئی مال ظاہر نہ ہو تو اسے چھوڑ دے گا"],["m","وَكَذَلِكَ إِذَا أَقَامَ الْبَيِّنَةَ أَنَّهُ لَا مَالَ لَهُ",null,"اسی طرح جب وہ گواہی قائم کر دے کہ اس کے پاس مال نہیں"],["m","وَلَا يَحُولُ بَيْنَهُ وَبَيْنَ غُرَمَائِهِ بَعْدَ خُرُوجِهِ مِنَ الْحَبْسِ وَيُلَازِمُونَهُ وَلَا يَمْنَعُونَهُ مِنَ التَّصَرُّفِ وَالسَّفَرِ",null,"قید سے نکلنے کے بعد اس کے اور قرض خواہوں کے درمیان حائل نہیں ہو گا، وہ اس کے ساتھ لگے رہیں گے اور اسے تصرف اور سفر سے نہیں روکیں گے"],["m","وَيَأْخُذُونَ فَضْلَ كَسْبِهِ فَيُقْسَمُ بَيْنَهُمْ بِالْحِصَصِ",null,"اور اس کی کمائی کا زائد حصہ لے کر حصوں کے مطابق آپس میں تقسیم کر لیں گے"],["m","وَقَالَ أَبُو يُوسُفَ وَمُحَمَّدٌ: إِذَا فَلَّسَهُ الْحَاكِمُ حَالَ بَيْنَهُ وَبَيْنَ غُرَمَائِهِ إِلَّا أَنْ يُقِيمُوا الْبَيِّنَةَ أَنَّهُ قَدْ حَصَلَ لَهُ مَالٌ",null,"امام ابو یوسفؒ و امام محمدؒ نے فرمایا: جب حاکم اسے مفلس قرار دے دے تو اس کے اور قرض خواہوں کے درمیان رکاوٹ بن جائے گا، الا یہ کہ وہ گواہی دیں کہ اسے مال حاصل ہو گیا ہے"],["m","وَلَا يُحْجَرُ عَلَى الْفَاسِقِ إِذَا كَانَ مُصْلِحًا لِمَالِهِ",null,"فاسق پر حجر نہیں کیا جائے گا جب وہ اپنے مال کی اصلاح کرتا ہو"],["m","وَالْفِسْقُ الْأَصْلِيُّ وَالطَّارِئُ سَوَاءٌ",null,"اصلی اور طاری فسق دونوں برابر ہیں"],["m","وَمَنْ أَفْلَسَ وَعِنْدَهُ مَتَاعٌ لِرَجُلٍ بِعَيْنِهِ ابْتَاعَهُ مِنْهُ فَصَاحِبُ الْمَتَاعِ أُسْوَةُ الْغُرَمَاءِ فِيهِ",null,"جو مفلس ہو گیا اور اس کے پاس کسی شخص کا معین سامان ہو جو اس نے اس سے خریدا تھا تو سامان کا مالک اس میں دوسرے قرض خواہوں کے برابر ہے"]]}]},{"n":9,"title":"كِتَابُ الْإِقْرَارِ","tu":"کتاب الاقرار","babs":[{"t":"أَحْكَامُ الْإِقْرَارِ بِالْمَالِ","tu":"مال کے اقرار کے احکام","ed":true,"items":[["f","الْإِقْرَارُ بِالْمَجْهُولِ",null,"نامعلوم چیز کا اقرار"],["m","إِذَا أَقَرَّ الْحُرُّ الْبَالِغُ الْعَاقِلُ بِحَقٍّ لَزِمَهُ إِقْرَارُهُ مَجْهُولًا كَانَ مَا أَقَرَّ بِهِ أَوْ مَعْلُومًا",null,"جب آزاد، بالغ، عاقل شخص کسی حق کا اقرار کرے تو اس کا اقرار لازم ہو جاتا ہے، چاہے جس چیز کا اقرار کیا وہ نامعلوم ہو یا معلوم"],["m","وَيُقَالُ لَهُ: بَيِّنِ الْمَجْهُولَ",null,"اور اس سے کہا جائے گا: نامعلوم چیز کی وضاحت کرو"],["m","فَإِنْ قَالَ: لِفُلَانٍ عَلَيَّ شَيْءٌ لَزِمَهُ أَنْ يُبَيِّنَ مَا لَهُ قِيمَةٌ",null,"اگر کہا: فلاں کا مجھ پر کچھ ہے تو اس پر لازم ہے کہ ایسی چیز بتائے جس کی کوئی قیمت ہو"],["m","وَالْقَوْلُ فِيهِ قَوْلُهُ مَعَ يَمِينِهِ إِنِ ادَّعَى الْمُقَرُّ لَهُ أَكْثَرَ مِنْ ذَلِكَ",null,"اور اس میں قسم کے ساتھ اسی کی بات معتبر ہے اگر مقرَّ لہ اس سے زیادہ کا دعویٰ کرے"],["m","وَإِذَا قَالَ: لَهُ عَلَيَّ مَالٌ فَالْمَرْجِعُ فِي بَيَانِهِ إِلَيْهِ وَيُقْبَلُ قَوْلُهُ فِي الْقَلِيلِ وَالْكَثِيرِ",null,"اگر کہا: اس کا مجھ پر مال ہے تو اس کی وضاحت اسی کے سپرد ہے اور کم و زیادہ میں اس کی بات مانی جائے گی"],["m","فَإِنْ قَالَ: لَهُ عَلَيَّ مَالٌ عَظِيمٌ لَمْ يُصَدَّقْ فِي أَقَلَّ مِنْ مِائَتَيْ دِرْهَمٍ",null,"اگر کہا: اس کا مجھ پر بڑا مال ہے تو دو سو درہم سے کم میں اس کی تصدیق نہیں کی جائے گی"],["m","وَإِنْ قَالَ: دَرَاهِمُ كَثِيرَةٌ لَمْ يُصَدَّقْ فِي أَقَلَّ مِنْ عَشَرَةِ دَرَاهِمَ",null,"اگر کہا: بہت سے درہم تو دس درہم سے کم میں اس کی تصدیق نہیں کی جائے گی"],["m","وَإِنْ قَالَ: دَرَاهِمُ فَهِيَ ثَلَاثَةٌ إِلَّا أَنْ يُبَيِّنَ أَكْثَرَ مِنْهَا",null,"اگر کہا: درہم، تو وہ تین ہیں، الا یہ کہ اس سے زیادہ بیان کرے"],["m","وَإِنْ قَالَ: لَهُ عَلَيَّ كَذَا دِرْهَمًا لَمْ يُصَدَّقْ فِي أَقَلَّ مِنْ أَحَدَ عَشَرَ دِرْهَمًا",null,"اگر کہا: اس کا مجھ پر \"کذا درہم\" ہے تو گیارہ درہم سے کم میں تصدیق نہیں کی جائے گی"],["m","وَإِنْ قَالَ: كَذَا كَذَا دِرْهَمًا لَمْ يُصَدَّقْ فِي أَقَلَّ مِنْ أَحَدٍ وَعِشْرِينَ دِرْهَمًا",null,"اور اگر کہا: \"کذا کذا درہم\" تو اکیس درہم سے کم میں تصدیق نہیں کی جائے گی"],["f","أَلْفَاظُ الْإِقْرَارِ",null,"اقرار کے الفاظ"],["m","وَإِنْ قَالَ: لَهُ عَلَيَّ أَوْ قِبَلِي فَقَدْ أَقَرَّ بِدَيْنٍ",null,"اگر کہا: \"اس کا مجھ پر\" یا \"میرے ذمے\" ہے تو اس نے دین کا اقرار کیا"],["m","وَإِنْ قَالَ: عِنْدِي أَوْ مَعِي فَهُوَ إِقْرَارٌ بِأَمَانَةٍ فِي يَدِهِ",null,"اور اگر کہا: \"میرے پاس\" یا \"میرے ساتھ\" ہے تو یہ اس کے ہاتھ میں امانت کا اقرار ہے"],["m","وَإِنْ قَالَ لَهُ رَجُلٌ: لِي عَلَيْكَ أَلْفٌ فَقَالَ: اتَّزِنْهَا أَوِ انْتَقِدْهَا أَوْ أَجِّلْنِي بِهَا أَوْ قَدْ قَضَيْتُكَهَا فَهُوَ إِقْرَارٌ",null,"اگر کسی نے اس سے کہا: تم پر میرے ہزار ہیں، اس نے جواب دیا: انہیں تول لو، یا پرکھ لو، یا مجھے مہلت دو، یا میں نے تمہیں ادا کر دیے، تو یہ اقرار ہے"],["m","وَمَنْ أَقَرَّ بِدَيْنٍ مُؤَجَّلٍ فَصَدَّقَهُ الْمُقَرُّ لَهُ فِي الدَّيْنِ وَكَذَّبَهُ فِي التَّأْجِيلِ لَزِمَهُ الدَّيْنُ حَالًّا وَيُسْتَحْلَفُ الْمُقَرُّ لَهُ فِي الْأَجَلِ",null,"جس نے ادھار دین کا اقرار کیا اور مقرَّ لہ نے دین کی تصدیق کی مگر مدت کی تکذیب کی تو دین فوراً لازم ہو گا، اور مقرَّ لہ سے مدت کے بارے میں قسم لی جائے گی"],["f","الِاسْتِثْنَاءُ",null,"استثناء"],["m","وَمَنْ أَقَرَّ وَاسْتَثْنَى مُتَّصِلًا بِإِقْرَارِهِ صَحَّ الِاسْتِثْنَاءُ وَلَزِمَهُ الْبَاقِي سَوَاءٌ اسْتَثْنَى الْأَقَلَّ أَوِ الْأَكْثَرَ",null,"جس نے اقرار کیا اور اپنے اقرار سے ملا کر استثناء کیا تو استثناء صحیح ہے اور باقی لازم ہے، چاہے کم کا استثناء کرے یا زیادہ کا"],["m","فَإِنِ اسْتَثْنَى الْجَمِيعَ لَزِمَهُ الْإِقْرَارُ وَبَطَلَ الِاسْتِثْنَاءُ",null,"اگر سب کا استثناء کر دیا تو اقرار لازم ہو گا اور استثناء باطل"],["m","وَإِنْ قَالَ: لَهُ عَلَيَّ مِائَةُ دِرْهَمٍ إِلَّا دِينَارًا أَوْ: إِلَّا قَفِيزَ حِنْطَةٍ لَزِمَهُ مِائَةُ دِرْهَمٍ إِلَّا قِيمَةَ الدِّينَارِ أَوِ الْقَفِيزِ",null,"اگر کہا: اس کے سو درہم مجھ پر ہیں سوائے ایک دینار کے، یا سوائے ایک قفیز گندم کے، تو سو درہم میں سے دینار یا قفیز کی قیمت منہا ہو کر لازم ہو گا"],["m","وَإِنْ قَالَ: لَهُ عَلَيَّ مِائَةٌ وَدِرْهَمٌ فَالْمِائَةُ كُلُّهَا دَرَاهِمُ",null,"اگر کہا: سو اور ایک درہم تو سب کے سب درہم ہی ہیں"],["m","وَإِنْ قَالَ: مِائَةٌ وَثَوْبٌ لَزِمَهُ ثَوْبٌ وَاحِدٌ وَالْمَرْجِعُ فِي تَفْسِيرِ الْمِائَةِ إِلَيْهِ",null,"اور اگر کہا: سو اور ایک کپڑا تو ایک ہی کپڑا لازم ہو گا، اور سو کی تفسیر اسی کے سپرد ہے"],["m","وَمَنْ أَقَرَّ بِحَقٍّ وَقَالَ: إِنْ شَاءَ اللَّهُ مُتَّصِلًا بِإِقْرَارِهِ لَمْ يَلْزَمْهُ الْإِقْرَارُ",null,"جس نے کسی حق کا اقرار کیا اور اپنے اقرار سے ملا کر \"ان شاء اللہ\" کہا تو اقرار لازم نہیں ہو گا"],["m","وَمَنْ أَقَرَّ وَشَرَطَ الْخِيَارَ لَزِمَهُ الْإِقْرَارُ وَبَطَلَ الْخِيَارُ",null,"جس نے اقرار کیا اور اختیار کی شرط لگائی تو اقرار لازم ہے اور اختیار باطل"],["f","تَبَعِيَّةُ الْأَشْيَاءِ فِي الْإِقْرَارِ",null,"اقرار میں تابع چیزیں"],["m","وَمَنْ أَقَرَّ بِدَارٍ وَاسْتَثْنَى بِنَاءَهَا لِنَفْسِهِ فَلِلْمُقَرِّ لَهُ الدَّارُ وَالْبِنَاءُ",null,"جس نے مکان کا اقرار کیا اور اس کی عمارت اپنے لیے مستثنیٰ کر لی تو مقرَّ لہ کے لیے مکان اور عمارت دونوں ہیں"],["m","وَإِنْ قَالَ: بِنَاءُ هَذِهِ الدَّارِ لِي وَالْعَرْصَةُ لِفُلَانٍ فَهُوَ كَمَا قَالَ",null,"اور اگر کہا: اس مکان کی عمارت میری ہے اور خالی زمین فلاں کی تو معاملہ ویسا ہی ہے جیسا اس نے کہا"],["m","وَمَنْ أَقَرَّ بِتَمْرٍ فِي قَوْصَرَّةٍ لَزِمَهُ التَّمْرُ وَالْقَوْصَرَّةُ",null,"جس نے ٹوکری میں کھجور کا اقرار کیا تو اس پر کھجور اور ٹوکری دونوں لازم ہیں"],["m","وَمَنْ أَقَرَّ بِدَابَّةٍ فِي إِصْطَبْلٍ لَزِمَتْهُ الدَّابَّةُ خَاصَّةً",null,"جس نے اصطبل میں جانور کا اقرار کیا تو صرف جانور لازم ہے"],["m","وَإِنْ قَالَ: غَصَبْتُ ثَوْبًا فِي مِنْدِيلٍ لَزِمَاهُ جَمِيعًا",null,"اگر کہا: میں نے رومال میں کپڑا غصب کیا تو دونوں لازم ہیں"],["m","وَإِنْ قَالَ: لَهُ عَلَيَّ ثَوْبٌ فِي ثَوْبٍ لَزِمَاهُ",null,"اور اگر کہا: اس کا مجھ پر کپڑا کپڑے میں ہے تو دونوں لازم ہیں"],["m","وَإِنْ قَالَ: لَهُ عَلَيَّ ثَوْبٌ فِي عَشَرَةِ أَثْوَابٍ لَمْ يَلْزَمْهُ عِنْدَ أَبِي حَنِيفَةَ وَأَبِي يُوسُفَ إِلَّا ثَوْبٌ وَاحِدٌ",null,"اور اگر کہا: اس کا مجھ پر ایک کپڑا دس کپڑوں میں ہے تو امام ابوحنیفہؒ اور امام ابو یوسفؒ کے نزدیک صرف ایک کپڑا لازم ہو گا"],["m","وَقَالَ مُحَمَّدٌ: يَلْزَمُهُ أَحَدَ عَشَرَ ثَوْبًا",null,"اور امام محمدؒ نے فرمایا: گیارہ کپڑے لازم ہوں گے"],["m","وَمَنْ أَقَرَّ بِغَصْبِ ثَوْبٍ وَجَاءَ بِثَوْبٍ مَعِيبٍ فَالْقَوْلُ قَوْلُهُ مَعَ يَمِينِهِ",null,"جس نے کپڑا غصب کرنے کا اقرار کیا اور عیب دار کپڑا لایا تو قسم کے ساتھ اسی کی بات معتبر ہے"],["m","وَكَذَلِكَ لَوْ أَقَرَّ بِدَرَاهِمَ وَقَالَ: هِيَ زُيُوفٌ",null,"اسی طرح اگر درہموں کا اقرار کیا اور کہا کہ وہ کھوٹے ہیں"],["f","الضَّرْبُ وَالْحِسَابُ وَالْغَايَةُ",null,"ضرب، حساب اور حد"],["m","وَإِنْ قَالَ: لَهُ عَلَيَّ خَمْسَةٌ فِي خَمْسَةٍ يُرِيدُ الضَّرْبَ وَالْحِسَابَ لَزِمَهُ خَمْسَةٌ وَاحِدَةٌ",null,"اگر کہا: اس کے مجھ پر پانچ ضرب پانچ ہیں اور ضرب و حساب کا ارادہ ہو تو صرف پانچ لازم ہوں گے"],["m","وَإِنْ قَالَ: أَرَدْتُ خَمْسَةً مَعَ خَمْسَةٍ لَزِمَهُ عَشَرَةٌ",null,"اور اگر کہا: میرا ارادہ پانچ کے ساتھ پانچ کا تھا تو دس لازم ہوں گے"],["m","وَإِنْ قَالَ: لَهُ عَلَيَّ مِنْ دِرْهَمٍ إِلَى عَشَرَةٍ لَزِمَهُ تِسْعَةٌ عِنْدَ أَبِي حَنِيفَةَ",null,"اگر کہا: اس کے مجھ پر ایک درہم سے دس تک ہیں تو امام ابوحنیفہؒ کے نزدیک نو لازم ہوں گے"],["m","فَيَلْزَمُهُ الِابْتِدَاءُ وَمَا بَعْدَهُ وَتَسْقُطُ الْغَايَةُ",null,"یعنی ابتدا اور اس کے بعد والی مقدار لازم ہو گی اور انتہا ساقط ہو جائے گی"],["m","وَقَالَ أَبُو يُوسُفَ وَمُحَمَّدٌ: يَلْزَمُهُ الْعَشَرَةُ كُلُّهَا",null,"امام ابو یوسفؒ و امام محمدؒ نے فرمایا: پورے دس لازم ہوں گے"],["f","الْإِقْرَارُ بِثَمَنِ مَبِيعٍ",null,"مبیع کے ثمن کا اقرار"],["m","وَإِذَا قَالَ: لَهُ عَلَيَّ أَلْفُ دِرْهَمٍ مِنْ ثَمَنِ عَبْدٍ اشْتَرَيْتُهُ مِنْهُ وَلَمْ أَقْبِضْهُ",null,"اگر کہا: اس کے مجھ پر ہزار درہم اس غلام کے ثمن کے ہیں جو میں نے اس سے خریدا اور قبضہ نہیں کیا"],["m","فَإِنْ ذَكَرَ عَبْدًا بِعَيْنِهِ قِيلَ لِلْمُقَرِّ لَهُ: إِنْ شِئْتَ فَسَلِّمِ الْعَبْدَ وَخُذِ الْأَلْفَ وَإِلَّا فَلَا شَيْءَ لَكَ",null,"اگر کسی معین غلام کا ذکر کیا تو مقرَّ لہ سے کہا جائے گا: چاہو تو غلام حوالے کرو اور ہزار لے لو، ورنہ تمہارے لیے کچھ نہیں"],["m","وَإِنْ قَالَ: لَهُ عَلَيَّ أَلْفٌ مِنْ ثَمَنِ عَبْدٍ وَلَمْ يُعَيِّنْهُ لَزِمَهُ الْأَلْفُ فِي قَوْلِ أَبِي حَنِيفَةَ",null,"اور اگر کہا: ہزار غلام کے ثمن کے ہیں مگر غلام معین نہ کیا تو امام ابوحنیفہؒ کے قول میں ہزار لازم ہو گا"],["m","وَلَوْ قَالَ: لَهُ عَلَيَّ أَلْفٌ مِنْ ثَمَنِ هَذَا الْعَبْدِ لَمْ يَلْزَمْهُ حَتَّى يُسَلِّمَ الْعَبْدَ",null,"اور اگر کہا: ہزار اس غلام کے ثمن کے ہیں تو اس پر لازم نہیں جب تک (مقرَّ لہ) غلام حوالے نہ کرے"],["m","فَإِنْ سَلَّمَ الْعَبْدَ لَزِمَهُ الْأَلْفُ وَإِنْ لَمْ يُسَلِّمْهُ لَمْ تَلْزَمْهُ",null,"اگر غلام حوالے کر دیا تو ہزار لازم ہو گا اور نہ کیا تو لازم نہیں"],["m","وَلَوْ قَالَ: لَهُ عَلَيَّ أَلْفٌ مِنْ ثَمَنِ خَمْرٍ أَوْ خِنْزِيرٍ لَزِمَهُ الْأَلْفُ وَلَمْ يُقْبَلْ تَفْسِيرُهُ",null,"اگر کہا: ہزار شراب یا خنزیر کے ثمن کے ہیں تو ہزار لازم ہو گا اور اس کی تفسیر قبول نہیں کی جائے گی"],["m","وَلَوْ قَالَ: لَهُ عَلَيَ يْنُ الْمَعْرُوفُ بِالْأَسْبَابِ مُقَدَّمٌ عَلَى غَيْرِهِ",null,"تو صحت کا قرض اور اسباب سے معروف قرض دوسرے قرضوں پر مقدم ہے"],["m","فَإِنْ فَضَلَ شَيْءٌ كَانَ لِمَنْ أَقَرَّ لَهُ فِي حَالِ الْمَرَضِ",null,"پھر اگر کچھ بچ جائے تو وہ اس کے لیے ہے جس کے لیے بیماری میں اقرار کیا"],["m","وَإِنْ لَمْ يَكُنْ عَلَيْهِ دُيُونٌ فِي صِحَّتِهِ جَازَ إِقْرَارُهُ وَكَانَ الْمُقَرُّ لَهُ أَوْلَى مِنَ الْوَرَثَةِ",null,"اور اگر اس پر صحت کے قرض نہ ہوں تو اس کا اقرار جائز ہے اور مقرَّ لہ ورثاء سے مقدم ہے"],["m","وَإِقْرَارُ الْمَرِيضِ لِوَارِثِهِ بَاطِلٌ إِلَّا أَنْ يُصَدِّقَهُ فِيهِ بَقِيَّةُ الْوَرَثَةِ",null,"مریض کا اپنے وارث کے لیے اقرار باطل ہے، الا یہ کہ باقی ورثاء اس کی تصدیق کریں"],["m","وَمَنْ أَقَرَّ لِأَجْنَبِيَّةٍ فِي مَرَضِهِ ثُمَّ تَزَوَّجَهَا لَمْ يَبْطُلْ إِقْرَارُهُ لَهَا",null,"جس نے بیماری میں اجنبی عورت کے لیے اقرار کیا، پھر اس سے نکاح کر لیا تو اس کا اقرار باطل نہیں ہوتا"],["m","وَمَنْ أَقَرَّ لِأَجْنَبِيٍّ فِي مَرَضِهِ ثُمَّ قَالَ: هُوَ ابْنِي ثَبَتَ نَسَبُهُ وَبَطَلَ إِقْرَارُهُ لَهُ",null,"جس نے بیماری میں اجنبی کے لیے اقرار کیا، پھر کہا: یہ میرا بیٹا ہے تو اس کا نسب ثابت ہو جائے گا اور اس کے لیے اقرار باطل ہو جائے گا"],["m","وَمَنْ طَلَّقَ زَوْجَتَهُ فِي مَرَضِهِ ثَلَاثًا ثُمَّ أَقَرَّ لَهَا بِدَيْنٍ وَمَاتَ فَلَهَا الْأَقَلُّ مِنَ الدَّيْنِ وَمِنْ مِيرَاثِهَا مِنْهُ",null,"جس نے بیماری میں بیوی کو تین طلاقیں دیں، پھر اس کے لیے قرض کا اقرار کیا اور مر گیا تو اسے دین اور اپنی میراث میں سے کم ملے گا"],["f","الْإِقْرَارُ بِالنَّسَبِ",null,"نسب کا اقرار"],["m","وَمَنْ أَقَرَّ بِغُلَامٍ يُولَدُ مِثْلُهُ لِمِثْلِهِ وَلَيْسَ لَهُ نَسَبٌ مَعْرُوفٌ أَنَّهُ ابْنُهُ وَصَدَّقَهُ الْغُلَامُ ثَبَتَ نَسَبُهُ مِنْهُ وَإِنْ كَانَ مَرِيضًا",null,"جس نے ایسے لڑکے کے بارے میں اقرار کیا جس جیسا اس جیسے کے ہاں پیدا ہو سکتا ہو اور اس کا کوئی معروف نسب نہ ہو کہ یہ میرا بیٹا ہے اور لڑکے نے تصدیق کی تو اس کا نسب اس سے ثابت ہو جائے گا چاہے اقرار کرنے والا مریض ہو"],["m","وَيُشَارِكُ الْوَرَثَةَ فِي الْمِيرَاثِ",null,"اور وہ میراث میں ورثاء کا شریک ہو گا"],["m","وَيَجُوزُ إِقْرَارُ الرَّجُلِ بِالْوَالِدَيْنِ وَالْوَلَدِ وَالزَّوْجَةِ وَالْمَوْلَى",null,"مرد کا والدین، اولاد، بیوی اور مولیٰ کے بارے میں اقرار جائز ہے"],["m","وَيُقْبَلُ إِقْرَارُ الْمَرْأَةِ بِالْوَالِدَيْنِ وَالزَّوْجِ وَالْمَوْلَى",null,"اور عورت کا والدین، شوہر اور مولیٰ کے بارے میں اقرار قبول کیا جاتا ہے"],["m","وَلَا يُقْبَلُ بِالْوَلَدِ إِلَّا أَنْ يُصَدِّقَهَا الزَّوْجُ أَوْ تَشْهَدَ بِوِلَادَتِهَا قَابِلَةٌ",null,"مگر اولاد کے بارے میں اس کا اقرار قبول نہیں جب تک شوہر تصدیق نہ کرے یا دایہ اس کی ولادت کی گواہی نہ دے"],["m","وَمَنْ أَقَرَّ بِنَسَبٍ مِنْ غَيْرِ الْوَالِدَيْنِ وَالْوَلَدِ وَالزَّوْجِ وَالزَّوْجَةِ وَالْمَوْلَى - مِثْلَ الْأَخِ وَالْعَمِّ - لَمْ يُقْبَلْ إِقْرَارُهُ فِي النَّسَبِ",null,"جس نے والدین، اولاد، شوہر، بیوی اور مولیٰ کے علاوہ کسی نسب کا اقرار کیا، جیسے بھائی اور چچا، تو نسب میں اس کا اقرار قبول نہیں"],["m","فَإِنْ كَانَ لَهُ وَارِثٌ مَعْرُوفٌ قَرِيبٌ أَوْ بَعِيدٌ فَهُوَ أَوْلَى بِالْمِيرَاثِ مِنَ الْمُقَرِّ لَهُ",null,"اگر اس کا کوئی معروف وارث ہو، قریبی ہو یا دور کا، تو وہ میراث میں مقرَّ لہ سے مقدم ہے"],["m","وَإِنْ لَمْ يَكُنْ لَهُ وَارِثٌ اسْتَحَقَّ الْمُقَرُّ لَهُ مِيرَاثَهُ",null,"اور اگر کوئی وارث نہ ہو تو مقرَّ لہ اس کی میراث کا مستحق ہو گا"],["m","وَمَنْ مَاتَ أَبُوهُ فَأَقَرَّ بِأَخٍ لَهُ لَمْ يَثْبُتْ نَسَبُ أَخِيهِ وَيُشَارِكُهُ فِي الْمِيرَاثِ",null,"جس کا باپ مر گیا، پھر اس نے اپنے بھائی کا اقرار کیا تو اس کے بھائی کا نسب ثابت نہیں ہو گا مگر وہ اس کے ساتھ میراث میں شریک ہو گا"]]}]},{"n":10,"title":"كِتَابُ الْإِجَارَةِ","tu":"کتاب الاجارہ","babs":[{"t":"أَحْكَامُ عَقْدِ الْإِجَارَةِ","tu":"عقدِ اجارہ کے احکام","ed":true,"items":[["f","مَاهِيَّةُ الْإِجَارَةِ وَشُرُوطُهَا",null,"اجارہ کی حقیقت اور شرائط"],["m","الْإِجَارَةُ: عَقْدٌ عَلَى الْمَنَافِعِ بِعِوَضٍ",null,"اجارہ منافع پر عوض کے بدلے عقد ہے"],["m","وَلَا تَصِحُّ حَتَّى تَكُونَ الْمَنَافِعُ مَعْلُومَةً وَالْأُجْرَةُ مَعْلُومَةً",null,"اور اجارہ اس وقت تک صحیح نہیں جب تک منافع بھی معلوم ہوں اور اجرت بھی معلوم ہو"],["m","وَمَا جَازَ أَنْ يَكُونَ ثَمَنًا فِي الْبَيْعِ جَازَ أَنْ يَكُونَ أُجْرَةً فِي الْإِجَارَةِ",null,"جو چیز بیع میں ثمن بن سکتی ہے وہ اجارہ میں اجرت بھی بن سکتی ہے"],["m","وَالْمَنَافِعُ تَارَةً تَصِيرُ مَعْلُومَةً بِالْمُدَّةِ كَاسْتِئْجَارِ الدُّورِ لِلسُّكْنَى وَالْأَرَضِينَ لِلزِّرَاعَةِ فَيَصِحُّ الْعَقْدُ عَلَى مُدَّةٍ مَعْلُومَةٍ أَيَّ مُدَّةٍ كَانَتْ",null,"منافع کبھی مدت سے معلوم ہوتے ہیں، جیسے رہائش کے لیے مکان اور کھیتی کے لیے زمین کرایہ پر لینا، تو معلوم مدت پر عقد صحیح ہے خواہ وہ کوئی بھی مدت ہو"],["m","وَتَارَةً تَصِيرُ مَعْلُومَةً بِالْعَمَلِ وَالتَّسْمِيَةِ كَمَنِ اسْتَأْجَرَ رَجُلًا عَلَى صَبْغِ ثَوْبٍ أَوْ خِيَاطَتِهِ أَوِ اسْتَأْجَرَ دَابَّةً لِيَحْمِلَ عَلَيْهَا مِقْدَارًا مَعْلُومًا أَوْ يَرْكَبَهَا مَسَافَةً سَمَّاهَا",null,"اور کبھی کام اور نام لینے سے معلوم ہوتے ہیں، جیسے کسی نے آدمی کو کپڑا رنگنے یا سینے پر رکھا، یا جانور اس پر معلوم مقدار لادنے یا مقررہ مسافت سوار ہونے کے لیے کرایہ پر لیا"],["m","وَتَارَةً تَصِيرُ مَعْلُومَةً بِالتَّعْيِينِ وَالْإِشَارَةِ كَمَنِ اسْتَأْجَرَ رَجُلًا لِيَنْقُلَ لَهُ هَذَا الطَّعَامَ إِلَى مَوْضِعٍ مَعْلُومٍ",null,"اور کبھی تعیین و اشارے سے معلوم ہوتے ہیں، جیسے کسی نے آدمی کو اس لیے رکھا کہ یہ غلہ معلوم جگہ تک پہنچائے"],["f","كِرَاءُ الدُّورِ وَالْأَرَاضِي",null,"مکانوں اور زمینوں کا کرایہ"],["m","وَيَجُوزُ اسْتِئْجَارُ الدُّورِ وَالْحَوَانِيتِ لِلسُّكْنَى وَإِنْ لَمْ يُبَيِّنْ مَا يَعْمَلُ فِيهَا",null,"رہائش کے لیے مکان اور دکانیں کرایہ پر لینا جائز ہے اگرچہ یہ نہ بتائے کہ ان میں کیا کرے گا"],["m","وَلَهُ أَنْ يَعْمَلَ كُلَّ شَيْءٍ إِلَّا الْحَدَّادَ وَالْقَصَّارَ وَالطَّحَّانَ",null,"اور اسے ہر کام کا اختیار ہے سوائے لوہار، دھوبی اور چکی کے کام کے"],["m","وَيَجُوزُ اسْتِئْجَارُ الْأَرَاضِي لِلزِّرَاعَةِ",null,"کھیتی کے لیے زمینیں کرایہ پر لینا جائز ہے"],["m","وَلَا يَصِحُّ الْعَقْدُ حَتَّى يُسَمِّيَ مَا يُزْرَعُ فِيهَا أَوْ يَقُولَ: عَلَى أَنْ يَزْرَعَ فِيهَا مَا شَاءَ",null,"لیکن عقد اس وقت تک صحیح نہیں جب تک یہ نہ بتائے کہ اس میں کیا بویا جائے گا، یا کہے: جو چاہے بوئے"],["m","وَيَجُوزُ أَنْ يَسْتَأْجِرَ السَّاحَةَ لِيَبْنِيَ فِيهَا أَوْ يَغْرِسَ فِيهَا نَخْلًا أَوْ شَجَرًا",null,"کھلی جگہ اس لیے کرایہ پر لینا جائز ہے کہ اس میں عمارت بنائے یا کھجور اور درخت لگائے"],["m","فَإِذَا انْقَضَتْ مُدَّةُ الْإِجَارَةِ لَزِمَهُ أَنْ يَقْلَعَ الْبِنَاءَ وَالْغَرْسَ وَيُسَلِّمَهَا فَارِغَةً",null,"جب اجارے کی مدت ختم ہو جائے تو اس پر لازم ہے کہ عمارت اور درخت اکھاڑ دے اور زمین خالی حوالے کرے"],["m","إِلَّا أَنْ يَخْتَارَ صَاحِبُ الْأَرْضِ أَنْ يَغْرَمَ لَهُ قِيمَةَ ذَلِكَ مَقْلُوعًا فَيَمْلِكَهُ أَوْ يَرْضَى بِتَرْكِهِ عَلَى حَالِهِ فَيَكُونَ الْبِنَاءُ لِهَذَا وَالْأَرْضُ لِهَذَا",null,"الا یہ کہ زمین کا مالک اکھڑی ہوئی حالت کی قیمت ادا کر کے اسے اپنی ملک میں لے لے، یا اسے اپنی حالت پر چھوڑنے پر راضی ہو جائے تو عمارت ایک کی اور زمین دوسرے کی رہے گی"]]},{"t":"جَانِبٌ مِنْ مَسَائِلِ إِجَارَةِ الدَّوَابِّ","tu":"جانوروں کی اجارہ کے مسائل","ed":true,"items":[["f","اسْتِئْجَارُ الدَّوَابِّ",null,"جانور کرایہ پر لینا"],["m","وَيَجُوزُ اسْتِئْجَارُ الدَّوَابِّ لِلرُّكُوبِ وَالْحَمْلِ",null,"سواری اور بار برداری کے لیے جانور کرایہ پر لینا جائز ہے"],["m","فَإِنْ قَالَ: عَلَى أَنْ يَرْكَبَهَا فُلَانٌ أَوْ يَلْبَسَ الثَّوْبَ فُلَانٌ فَأَرْكَبَهَا غَيْرَهُ أَوْ أَلْبَسَهُ غَيْرَهُ كَانَ ضَامِنًا إِنْ عَطِبَتِ الدَّابَّةُ أَوْ تَلِفَ الثَّوْبُ",null,"اگر کہا: اس شرط پر کہ اس پر فلاں سوار ہو گا یا کپڑا فلاں پہنے گا، پھر اس نے کسی اور کو سوار کر دیا یا پہنا دیا تو اگر جانور ہلاک ہو جائے یا کپڑا تلف ہو جائے تو وہ ضامن ہے"],["m","وَكَذَلِكَ كُلُّ مَا يَخْتَلِفُ بِاخْتِلَافِ الْمُسْتَعْمِلِ",null,"اسی طرح ہر وہ چیز جو استعمال کرنے والے کے بدلنے سے مختلف ہو جاتی ہے"],["m","وَأَمَّا الْعَقَارُ وَمَا لَا يَخْتَلِفُ بِاخْتِلَافِ الْمُسْتَعْمِلِ فَلَا ضَمَانَ عَلَيْهِ",null,"رہی جائیداد اور وہ چیز جو استعمال کرنے والے کے بدلنے سے مختلف نہیں ہوتی تو اس پر کوئی ضمان نہیں"],["m","فَإِذَا شَرَطَ سُكْنَى وَاحِدٍ فَلَهُ أَنْ يُسْكِنَ غَيْرَهُ",null,"لہٰذا اگر ایک کے رہنے کی شرط لگائی تو اسے اختیار ہے کہ کسی اور کو بسا دے"],["m","وَإِنْ سَمَّى نَوْعًا أَوْ قَدْرًا يَحْمِلُهُ عَلَى الدَّابَّةِ مِثْلَ أَنْ يَقُولَ: خَمْسَةَ أَقْفِزَةٍ حِنْطَةً فَلَهُ أَنْ يَحْمِلَ مَا هُوَ مِثْلُ الْحِنْطَةِ فِي الضَّرَرِ أَوْ أَقَلَّ كَالشَّعِيرِ وَالسِّمْسِمِ",null,"اگر جانور پر لادنے کی کوئی قسم یا مقدار بتائی، مثلاً پانچ قفیز گندم، تو وہ ایسی چیز لاد سکتا ہے جو نقصان میں گندم کے برابر یا کم ہو، جیسے جو اور تل"],["m","وَلَيْسَ لَهُ أَنْ يَحْمِلَ مَا هُوَ أَضَرُّ مِنَ الْحِنْطَةِ كَالْمِلْحِ وَالْحَدِيدِ",null,"اور اس کے لیے نہیں کہ گندم سے زیادہ نقصان دہ چیز لادے، جیسے نمک اور لوہا"],["m","وَإِنِ اسْتَأْجَرَهَا لِيَحْمِلَ عَلَيْهَا قُطْنًا سَمَّاهُ فَلَيْسَ لَهُ أَنْ يَحْمِلَ مِثْلَ وَزْنِهِ حَدِيدًا",null,"اگر کسی معین مقدار کی روئی لادنے کے لیے جانور کرایہ پر لیا تو اس کے برابر وزن لوہا نہیں لاد سکتا"],["m","وَإِنِ اسْتَأْجَرَهَا لِيَرْكَبَهَا فَأَرْدَفَ مَعَهُ رَجُلًا فَعَطِبَتْ ضَمِنَ نِصْفَ قِيمَتِهَا وَلَا يُعْتَبَرُ بِالثِّقَلِ",null,"اگر اس پر خود سوار ہونے کے لیے لیا اور ساتھ ایک اور آدمی بٹھا لیا، پھر جانور ہلاک ہو گیا تو آدھی قیمت کا ضامن ہو گا اور وزن کا اعتبار نہیں کیا جائے گا"],["m","وَإِنِ اسْتَأْجَرَهَا لِيَحْمِلَ عَلَيْهَا مِقْدَارًا مِنَ الْحِنْطَةِ فَحَمَلَ أَكْثَرَ مِنْهُ فَعَطِبَتْ ضَمِنَ بِحِصَّةِ الزِّيَادَةِ",null,"اگر گندم کی معین مقدار لادنے کے لیے لیا اور اس سے زیادہ لاد دیا، پھر جانور ہلاک ہو گیا تو زائد بوجھ کے حصے کا ضامن ہو گا"],["m","وَإِذَا كَبَحَ الدَّابَّةَ بِلِجَامِهَا أَوْ ضَرَبَهَا فَعَطِبَتْ ضَمِنَ عِنْدَ أَبِي حَنِيفَةَ",null,"اگر اس نے جانور کو لگام سے کھینچا یا مارا اور وہ ہلاک ہو گیا تو امام ابوحنیفہؒ کے نزدیک ضامن ہو گا"],["f","الْأَجِيرُ الْمُشْتَرَكُ وَالْخَاصُّ",null,"اجیرِ مشترک اور اجیرِ خاص"],["m","وَالْأُجَرَاءُ عَلَى ضَرْبَيْنِ: أَجِيرٌ مُشْتَرَكٌ وَأَجِيرٌ خَاصٌّ",null,"اجیر دو قسم کے ہیں: اجیرِ مشترک اور اجیرِ خاص"],["m","فَالْمُشْتَرَكُ: مَنْ لَا يَسْتَحِقُّ الْأُجْرَةَ حَتَّى يَعْمَلَ كَالصَّبَّاغِ وَالْقَصَّارِ",null,"اجیرِ مشترک وہ ہے جو کام کیے بغیر اجرت کا مستحق نہیں ہوتا، جیسے رنگ ساز اور دھوبی"],["m","وَالْمَتَاعُ أَمَانَةٌ فِي يَدِهِ: إِنْ هَلَكَ لَمْ يَضْمَنْ شَيْئًا عِنْدَ أَبِي حَنِيفَةَ وَقَالَ أَبُو يُوسُفَ وَمُحَمَّدٌ: يَضْمَنُهُ",null,"سامان اس کے ہاتھ میں امانت ہے: اگر ہلاک ہ رُ",null,"دودھ پلانے والی"],["m","وَيَجُوزُ اسْتِئْجَارُ الظِّئْرِ بِأُجْرَةٍ مَعْلُومَةٍ وَيَجُوزُ بِطَعَامِهَا وَكِسْوَتِهَا",null,"دودھ پلانے والی کو معلوم اجرت پر رکھنا جائز ہے اور اس کے کھانے اور لباس کے بدلے بھی جائز ہے"],["m","وَلَيْسَ لِلْمُسْتَأْجِرِ أَنْ يَمْنَعَ زَوْجَهَا مِنْ وَطْئِهَا",null,"کرایہ پر لینے والے کو حق نہیں کہ اس کے شوہر کو اس سے ہمبستری سے روکے"],["m","فَإِنْ حَبِلَتْ كَانَ لَهُمْ أَنْ يَفْسَخُوا الْإِجَارَةَ إِذَا خَافُوا عَلَى الصَّبِيِّ مِنْ لَبَنِهَا",null,"اگر وہ حاملہ ہو جائے تو (بچے کے گھر والوں کو) اجارہ فسخ کرنے کا حق ہے جب انہیں بچے کے لیے اس کے دودھ سے خطرہ ہو"],["m","وَعَلَيْهَا أَنْ تُصْلِحَ طَعَامَ الصَّبِيِّ",null,"اور اس پر لازم ہے کہ بچے کا کھانا تیار کرے"],["m","وَإِنْ أَرْضَعَتْهُ فِي الْمُدَّةِ بِلَبَنِ شَاةٍ فَلَا أَجْرَ لَهَا",null,"اور اگر مدت میں اسے بکری کا دودھ پلایا تو اس کی کوئی اجرت نہیں"],["f","حَبْسُ الْعَيْنِ بِالْأُجْرَةِ",null,"اجرت کے بدلے چیز روکنا"],["m","وَكُلُّ صَانِعٍ لِعَمَلِهِ أَثَرٌ فِي الْعَيْنِ كَالْقَصَّارِ وَالصَّبَّاغِ فَلَهُ أَنْ يَحْبِسَ الْعَيْنَ بَعْدَ الْفَرَاغِ مِنْ عَمَلِهِ حَتَّى يَسْتَوْفِيَ الْأُجْرَةَ",null,"ہر وہ کاریگر جس کے عمل کا چیز میں اثر باقی رہتا ہو، جیسے دھوبی اور رنگ ساز، کام سے فارغ ہو کر اجرت وصول کرنے تک چیز روک سکتا ہے"],["m","وَمَنْ لَيْسَ لِعَمَلِهِ أَثَرٌ فَلَيْسَ لَهُ أَنْ يَحْبِسَ الْعَيْنَ بِالْأُجْرَةِ كَالْحَمَّالِ وَالْمَلَّاحِ",null,"اور جس کے عمل کا کوئی اثر نہ ہو اسے اجرت کے بدلے چیز روکنے کا حق نہیں، جیسے مزدور اور ملاح"],["m","وَإِذَا شُرِطَ عَلَى الصَّانِعِ أَنْ يَعْمَلَ بِنَفْسِهِ فَلَيْسَ لَهُ أَنْ يَسْتَعْمِلَ غَيْرَهُ",null,"اگر کاریگر پر شرط ہو کہ خود کام کرے گا تو اسے کسی اور سے کام لینے کا حق نہیں"],["m","فَإِنْ أَطْلَقَ لَهُ الْعَمَلَ فَلَهُ أَنْ يَسْتَأْجِرَ مَنْ يَعْمَلُهُ",null,"اور اگر کام مطلق رکھا تو اسے حق ہے کہ کسی کو اجرت پر رکھ کر کروا لے"],["f","اخْتِلَافُ الْمُتَعَاقِدَيْنِ",null,"فریقین کا اختلاف"],["m","وَإِذَا اخْتَلَفَ الْخَيَّاطُ وَصَاحِبُ الثَّوْبِ فَقَالَ صَاحِبُ الثَّوْبِ: أَمَرْتُكَ أَنْ تَعْمَلَهُ قَبَاءً وَقَالَ الْخَيَّاطُ: قَمِيصًا",null,"اگر درزی اور کپڑے کے مالک میں اختلاف ہو اور مالک کہے: میں نے تمہیں قبا بنانے کو کہا تھا اور درزی کہے: قمیص"],["m","أَوْ قَالَ صَاحِبُ الثَّوْبِ لِلصَّبَّاغِ: أَمَرْتُكَ أَنْ تَصْبُغَهُ أَحْمَرَ فَصَبَغْتَهُ أَصْفَرَ فَالْقَوْلُ قَوْلُ صَاحِبِ الثَّوْبِ مَعَ يَمِينِهِ",null,"یا کپڑے کا مالک رنگ ساز سے کہے: میں نے تمہیں سرخ رنگنے کو کہا تھا اور تم نے پیلا رنگ دیا، تو قسم کے ساتھ کپڑے کے مالک کی بات معتبر ہے"],["m","فَإِنْ حَلَفَ فَالْخَيَّاطُ ضَامِنٌ",null,"پھر اگر اس نے قسم کھا لی تو درزی ضامن ہے"],["m","وَإِذَا قَالَ صَاحِبُ الثَّوْبِ: عَمِلْتَهُ لِي بِغَيْرِ أُجْرَةٍ وَقَالَ الصَّانِعُ: بِأُجْرَةٍ فَالْقَوْلُ قَوْلُ صَاحِبِ الثَّوْبِ مَعَ يَمِينِهِ عِنْدَ أَبِي حَنِيفَةَ",null,"اگر کپڑے کا مالک کہے: تم نے بغیر اجرت کے بنایا اور کاریگر کہے: اجرت پر، تو امام ابوحنیفہؒ کے نزدیک قسم کے ساتھ کپڑے کے مالک کی بات معتبر ہے"],["m","وَقَالَ أَبُو يُوسُفَ: إِنْ كَانَ حَرِيفًا لَهُ فَلَهُ الْأُجْرَةُ وَإِنْ لَمْ يَكُنْ حَرِيفًا لَهُ فَلَا أُجْرَةَ لَهُ",null,"امام ابو یوسفؒ نے فرمایا: اگر وہ اس کا معمول کا گاہک ہو تو اسے اجرت ملے گی، اور اگر نہ ہو تو اجرت نہیں"],["m","وَقَالَ مُحَمَّدٌ: إِنْ كَانَ الصَّانِعُ مَعْرُوفًا بِهَذِهِ الصَّنْعَةِ أَنْ يَعْمَلَ بِالْأُجْرَةِ فَالْقَوْلُ قَوْلُهُ أَنَّهُ عَمِلَهُ بِأُجْرَةٍ",null,"امام محمدؒ نے فرمایا: اگر کاریگر اس پیشے میں اجرت پر کام کرنے کے لیے معروف ہو تو اسی کی بات معتبر ہے کہ اس نے اجرت پر کام کیا"],["m","وَالْوَاجِبُ فِي الْإِجَارَةِ الْفَاسِدَةِ أَجْرُ الْمِثْلِ لَا يُتَجَاوَزُ بِهِ الْمُسَمَّى",null,"فاسد اجارہ میں اجرتِ مثل واجب ہے جو مقررہ اجرت سے بڑھ نہیں سکتی"]]},{"t":"فَسْخُ الْإِجَارَةِ وَانْتِهَاؤُهَا","tu":"اجارہ کا فسخ اور اس کا ختم ہونا","ed":true,"items":[["m","وَإِذَا قَبَضَ الْمُسْتَأْجِرُ الدَّارَ فَعَلَيْهِ الْأُجْرَةُ وَإِنْ لَمْ يَسْكُنْهَا",null,"جب کرایہ دار نے مکان پر قبضہ کر لیا تو اس پر کرایہ لازم ہے اگرچہ اس میں رہا نہ ہو"],["m","فَإِنْ غَصَبَهَا غَاصِبٌ مِنْ يَدِهِ سَقَطَتِ الْأُجْرَةُ",null,"اگر کسی غاصب نے اس سے مکان چھین لیا تو کرایہ ساقط ہو گیا"],["m","وَإِنْ وَجَدَ بِهَا عَيْب "الشُّفْعَةُ: وَاجِبَةٌ لِلْخَلِيطِ فِي نَفْسِ الْمَبِيعِ ثُمَّ لِلْخَلِيطِ فِي حَقِّ الْمَبِيعِ كَالشِّرْبِ وَالطَّرِيقِ ثُمَّ لِلْجَارِ",null,"شفعہ پہلے مبیع کی ذات میں شریک کے لیے واجب ہے، پھر مبیع کے حقوق (پانی کے حصے اور راستے) میں شریک کے لیے، پھر پڑوسی کے لیے"],["m","وَلَيْسَ لِلشَّرِيكِ فِي الطَّرِيقِ وَالشِّرْبِ وَالْجَارِ شُفْعَةٌ مَعَ الْخَلِيطِ",null,"راستے اور پانی کے حق میں شریک اور پڑوسی کے لیے ذات میں شریک کی موجودگی میں شفعہ نہیں"],["m","فَإِنْ سَلَّمَ فَالشُّفْعَةُ لِلشَّرِيكِ فِي الطَّرِيقِ فَإِنْ سَلَّمَ أَخَذَهَا الْجَارُ",null,"اگر وہ شفعہ چھوڑ دے تو راستے کے شریک کو شفعہ ملے گا، اور اگر وہ بھی چھوڑ دے تو پڑوسی لے لے گا"],["f","طَلَبُ الشُّفْعَةِ وَالْإِشْهَادُ",null,"شفعہ کا مطالبہ اور گواہ بنانا"],["m","وَالشُّفْعَةُ تَجِبُ بِعَقْدِ الْبَيْعِ وَتَسْتَقِرُّ بِالْإِشْهَادِ وَتُمْلَكُ بِالْأَخْذِ إِذَا سَلَّمَهَا الْمُشْتَرِي أَوْ حَكَمَ بِهَا حَاكِمٌ",null,"شفعہ بیع کے عقد سے واجب ہوتا ہے، گواہ بنانے سے مستحکم ہوتا ہے، اور لینے سے ملکیت میں آتا ہے جب خریدار حوالے کر دے یا حاکم فیصلہ کر دے"],["m","وَإِذَا عَلِمَ الشَّفِيعُ بِالْبَيْعِ أَشْهَدَ فِي مَجْلِسِهِ ذَلِكَ عَلَى الْمُطَالَبَةِ",null,"جب شفیع کو بیع کا علم ہو تو اسی مجلس میں مطالبہ پر گواہ بنائے"],["m","ثُمَّ يَنْهَضُ مِنْهُ فَيُشْهِدُ عَلَى الْبَائِعِ إِنْ كَانَ الْمَبِيعُ فِي يَدِهِ أَوْ عَلَى الْمُبْتَاعِ أَوْ عِنْدَ الْعَقَارِ",null,"پھر وہاں سے اٹھ کر بیچنے والے پر گواہ بنائے اگر مبیع اس کے قبضے میں ہو، یا خریدار پر، یا جائیداد کے پاس"],["m","فَإِذَا فَعَلَ ذَلِكَ اسْتَقَرَّتْ شُفْعَتُهُ وَلَمْ تَسْقُطْ بِالتَّأْخِيرِ عِنْدَ أَبِي حَنِيفَةَ",null,"جب اس نے ایسا کر لیا تو اس کا شفعہ مستحکم ہو گیا اور امام ابوحنیفہؒ کے نزدیک تاخیر سے ساقط نہیں ہوتا"],["m","وَقَالَ مُحَمَّدٌ: إِنْ تَرَكَهَا شَهْرًا بَعْدَ الْإِشْهَادِ بَطَلَتْ شُفْعَتُهُ",null,"اور امام محمدؒ نے فرمایا: اگر گواہ بنانے کے بعد ایک ماہ چھوڑے رکھا تو شفعہ باطل ہو گیا"],["f","مَحَلُّ الشُّفْعَةِ",null,"شفعہ کا محل"],["m","وَالشُّفْعَةُ وَاجِبَةٌ فِي الْعَقَارِ وَإِنْ كَانَ مِمَّا لَا يُقْسَمُ",null,"شفعہ جائیداد میں واجب ہے ],["m","وَإِذَا زَادَ الْمُشْتَرِي الْبَائِعَ فِي الثَّمَنِ لَمْ تَلْزَمِ الزِّيَادَةُ الشَّفِيعَ",null,"اگر خریدار بیچنے والے کو ثمن میں اضافہ دے تو یہ اضافہ شفیع پر لازم نہیں"],["m","وَإِذَا اجْتَمَعَ الشُّفَعَاءُ فَالشُّفْعَةُ بَيْنَهُمْ عَلَى عَدَدِ رُؤُوسِهِمْ وَلَا يُعْتَبَرُ اخْتِلَافُ الْأَمْلَاكِ",null,"جب کئی شفعہ دار جمع ہوں تو شفعہ ان میں سروں کی تعداد کے مطابق تقسیم ہو گا اور ملکیتوں کے مختلف ہونے کا اعتبار نہیں"],["m","وَمَنِ اشْتَرَى دَارًا بِعَرْضٍ أَخَذَهَا الشَّفِيعُ بِقِيمَتِهِ وَإِنِ اشْتَرَاهَا بِمَكِيلٍ أَوْ مَوْزُونٍ أَخَذَهَا بِمِثْلِهِ",null,"جس نے مکان کسی سامان کے بدلے خریدا، شفیع اس کی قیمت پر لے گا، اور اگر ناپی یا تولی جانے والی چیز کے بدلے خریدا تو اس کی مثل پر لے گا"],["m","وَإِذَا بَاعَ عَقَارًا بِعَقَارٍ أَخَذَ الشَّفِيعُ كُلَّ وَاحِدٍ مِنْهُمَا بِقِيمَةِ الْآخَرِ",null,"اگر جائیداد کے بدلے جائیداد بیچی تو شفیع ہر ایک کو دوسرے کی قیمت پر لے گا"],["f","مَسَائِلُ التَّسْلِيمِ وَالْعِلْمِ",null,"شفعہ چھوڑنے اور علم کے مسائل"],["m","وَإِذَا بَلَغَ الشَّفِيعَ أَنَّهَا بِيعَتْ بِأَلْفٍ فَسَلَّمَ ثُمَّ عَلِمَ أَنَّهَا بِيعَتْ بِأَقَلَّ أَوْ بِحِنْطَةٍ أَوْ شَعِيرٍ قِيمَتُهَا أَلْفٌ أَوْ أَكْثَرُ فَتَسْلِيمُهُ بَاطِلٌ وَلَهُ الشُّفْعَةُ",null,"اگر شفیع کو خبر ملی کہ مکان ہزار میں بکا ہے، اس نے شفعہ چھوڑ دیا، پھر معلوم ہوا کہ کم میں بکا ہے، یا گندم یا جو کے بدلے جن کی قیمت ہزار یا زیادہ ہے، تو اس کا چھوڑنا باطل ہے اور اسے شفعہ حاصل ہے"],["m","وَإِنْ بَانَ أَنَّهَا بِيعَتْ بِدَنَانِيرَ قِيمَتُهَا أَلْفٌ فَلَا شُفْعَةَ لَهُ",null,"اور اگر ظاہر ہو کہ وہ دیناروں کے بدلے بکا ہے جن کی قیمت ہزار ہے تو اسے شفعہ نہیں"],["m","وَإِذَا قِيلَ لَهُ: إِنَّ الْمُشْتَرِيَ فُلَانٌ فَسَلَّمَ الشُّفْعَةَ ثُمَّ عَلِمَ أَنَّهُ غَيْرُهُ فَلَهُ الشُّفْعَةُ",null,"اگر اس سے کہا گیا کہ خریدار فلاں ہے، اس نے شفعہ چھوڑ دیا، پھر معلوم ہوا کہ خریدار کوئی اور ہے تو اسے شفعہ حاصل ہے"],["m","وَمَنِ اشْتَرَى دَارًا لِغَيْرِهِ فَهُوَ الْخَصْمُ فِي الشُّفْعَةِ إِلَّا أَنْ يُسَلِّمَهَا إِلَى الْمُوَكِّلِ",null,"جس نے دوسرے کے لیے مکان خریدا تو شفعہ میں وہی فریق ہے، الا یہ کہ مکان موکل کے حوالے کر دے"],["m","وَإِذَا بَاعَ دَارًا إِلَّا مِقْدَارَ ذِرَاعٍ فِي طُولِ الْحَدِّ يَلِي الشَّفِيعَ فَلَا شُفْعَةَ لَهُ",null,"اگر مکان بیچا مگر اس حد کی لمبائی میں ایک گز مقدار جو شفیع سے ملتی ہے مستثنیٰ کر لی تو شفیع کو شفعہ نہیں"],["m","وَإِنِ ابْتَاعَ مِنْهَا سَهْمًا بِثَمَنٍ ثُمَّ ابْتَاعَ بَقِيَّتَهَا فَالشُّفْعَةُ لِلْجَارِ فِي السَّهْمِ الْأَوَّلِ دُونَ الثَّانِي",null,"اور اگر اس میں سے ایک حصہ کسی ثمن پر خریدا، پھر باقی بھی خرید لیا تو پڑوسی کو پہلے حصے میں شفعہ ہے، دوسرے میں نہیں"],["m","وَإِذَا ابْتَاعَهَا بِثَمَنٍ ثُمَّ دَفَعَ إِلَيْهِ ثَوْبًا عَنْهُ فَالشُّفْعَةُ بِالثَّمَنِ دُونَ الثَّوْبِ",null,"اگر کسی ثمن پر خریدا، پھر اس کے بدلے کپڑا دے دیا تو شفعہ ثمن پر ہے، کپڑے پر نہیں"],["m","وَلَا تُكْرَهُ الْحِيلَةُ فِي إِسْقَاطِ الشُّفْعَةِ عِنْدَ أَبِي يُوسُفَ وَقَالَ مُحَمَّدٌ رَحِمَهُ اللَّهُ: تُكْرَهُ",null,"امام ابو یوسفؒ کے نزدیک شفعہ ساقط کرنے کی حیلہ سازی مکروہ نہیں، اور امام محمدؒ نے فرمایا: مکروہ ہے"],["f","الْبِنَاءُ وَالْغَرْسُ وَهَلَاكُ الْمَبِيعِ",null,"عمارت، درخت اور مبیع کی ہلاکت"],["m","وَإِذَا بَنَى الْمُشْتَرِي أَوْ غَرَسَ ثُمَّ قُضِيَ لِلشَّفِيعِ بِالشُّفْعَةِ فَهُوَ بِالْخِيَارِ",null,"اگر خریدار نے عمارت بنا لی یا درخت لگا دیے، پھر شفیع کے لیے شفعہ کا فیصلہ ہوا تو شفیع کو اختیار ہے"],["m","إِنْ شَاءَ أَخَذَهَا بِالثَّمَنِ وَقِيمَةِ الْبِنَاءِ وَالْغَرْسِ مَقْلُوعًا وَإِنْ شَاءَ كَلَّفَ الْمُشْتَرِيَ قَلْعَهُ",null,"چاہے تو ثمن اور اکھاڑی ہوئی عمارت و درختوں کی قیمت پر لے لے اور چاہے تو خریدار کو اکھاڑنے کا پابند کرے"],["m","وَإِذَا أَخَذَهَا الشَّفِيعُ فَبَنَى أَوْ غَرَسَ ثُمَّ اسْتُحِقَّتْ رَجَعَ بِالثَّمَنِ وَلَا يَرْجِعُ بِقِيمَةِ الْبِنَاءِ وَالْغَرْسِ",null,"اگر شفیع نے لے لیا، پھر عمارت بنائی یا درخت لگائے، پھر مکان کسی اور کا نکل آیا تو ثمن کا رجوع کرے گا مگر عمارت و درختوں کی قیمت کا نہیں"],["m","وَإِذَا انْهَدَمَتِ الدَّارُ أَوِ احْتَرَقَ بِنَاؤُهَا أَوْ جَفَّ شَجَرُ الْبُسْتَانِ بِغَيْرِ فِعْلِ أَحَدٍ فَالشَّفِيعُ بِالْخِيَارِ",null,"اگر مکان گر جائے، اس کی عمارت جل جائے یا باغ کے درخت کسی کے عمل کے بغیر خشک ہو [["f","حَقِيقَةُ الْمُضَارَبَةِ وَشُرُوطُهَا",null,"مضاربت کی حقیقت اور شرائط"],["m","الْمُضَارَبَةُ: عَقْدٌ عَلَى الشَّرِكَةِ بِمَالٍ مِنْ أَحَدِ الشَّرِيكَيْنِ وَعَمَلٍ مِنَ الْآخَرِ",null,"مضاربت ایک شرکت کا عقد ہے جس میں ایک شریک کی طرف سے مال ہوتا ہے اور دوسرے کی طرف سے کام"],["m","وَلَا تَصِحُّ الْمُضَارَبَةُ إِلَّا بِالْمَالِ الَّذِي بَيَّنَّا أَنَّ الشَّرِكَةَ تَصِحُّ بِهِ",null,"مضاربت صرف اسی مال سے صحیح ہے جس سے شرکت کا صحیح ہونا ہم بیان کر چکے ہیں"],["m","وَمِنْ شَرْطِهَا: أَنْ يَكُونَ الرِّبْحُ بَيْنَهُمَا مُشَاعًا لَا يَسْتَحِقُّ أَحَدُهُمَا مِنْهُ دَرَاهِمَ مُسَمَّاةً",null,"اس کی شرط یہ ہے کہ نفع دونوں کے درمیان مشترک (فیصدی) ہو، ان میں سے کوئی معین درہم نفع میں سے مخصوص نہ کرے"],["m","وَلَا بُدَّ أَنْ يَكُونَ الْمَالُ مُسَلَّمًا إِلَى الْمُضَارِبِ وَلَا يَدَ لِرَبِّ الْمَالِ فِيهِ",null,"اور ضروری ہے کہ مال مضارب کے حوالے ہو اور رب المال کا اس پر ہاتھ نہ رہے"],["f","تَصَرُّفُ الْمُضَارِبِ",null,"مضارب کا تصرف"],["m","فَإِذَا صَحَّتِ الْمُضَارَبَةُ مُطْلَقَةً جَازَ لِلْمُضَارِبِ أَنْ يَشْتَرِيَ وَيَبِيعَ وَيُسَافِرَ وَيُبْضِعَ وَيُوَكِّلَ",null,"جب مضاربت مطلق طور پر صحیح ہو تو مضارب خرید و فروخت کر سکتا ہے، سفر کر سکتا ہے، بضاعت پر دے سکتا ہے اور وکیل بنا سکتا ہے"],["m","وَلَيْسَ لَهُ أَنْ يَدْفَعَ الْمَالَ مُضَارَبَةً إِلَّا أَنْ يَأْذَنَ لَهُ رَبُّ الْمَالِ فِي ذَلِكَ",null,"اور اسے حق نہیں کہ مال آگے مضاربت پر دے الا یہ کہ رب المال اجازت دے"],["m","وَإِنْ خَصَّ لَهُ رَبُّ الْمَالِ التَّصَرُّفَ فِي بَلَدٍ بِعَيْنِهِ أَوْ فِي سِلْعَةٍ بِعَيْنِهَا لَمْ يَجُزْ لَهُ أَنْ يَتَجَاوَزَ ذَلِكَ",null,"اور اگر رب المال نے اس کے تصرف کو کسی معین شہر یا معین سامان میں خاص کر دیا تو اس سے تجاوز جائز نہیں"],["m","وَكَذَلِكَ إِنْ وَقَّتَ لِلْمُضَارَبَةِ مُدَّةً بِعَيْنِهَا جَازَ وَبَطَلَ الْعَقْدُ بِمُضِيِّهَا",null,"اسی طرح اگر مضاربت کے لیے معین مدت مقرر کی تو جائز ہے اور مدت گزرنے پر عقد باطل ہو جائے گا"],["f","شِرَاءُ الْمُضَارِبِ لِمَنْ يُعْتَقُ عَلَى رَبِّ الْمَالِ",null,"رب المال کے محارم کی خریداری"],["m","وَلَيْسَ لِلْمُضَارِبِ أَنْ يَشْتَرِيَ أَبَا رَبِّ الْمَالِ وَلَا ابْنَهُ وَلَا مَنْ يُعْتَقُ عَلَيْهِ فَإِنِ اشْتَرَاهُمْ كَانَ مُشْتَرِيًا لِنَفْسِهِ دُونَ الْمُضَارَبَةِ",null,"مضارب کو حق نہیں کہ رب المال کے باپ، بیٹے یا ان لوگوں کو خریدے جو اس پر آزاد ہو جاتے ہیں؛ اگر خریدا تو وہ اپنے لیے خریدنے والا ہو گا، مضاربت کے لیے نہیں"],["m","وَإِنْ كَانَ فِي الْمَالِ رِبْحٌ فَلَيْسَ لَهُ أَنْ يَشْتَرِيَ مَنْ يُعْتَقُ عَلَيْهِ فَإِنِ اشْتَرَاهُمْ ضَمِنَ مَالَ الْمُضَارَبَةِ",null,"اگر مال میں نفع ہو تو اسے حق نہیں کہ اپنے ایسے رشتہ دار خریدے جو اس پر آزاد ہو جاتے ہوں؛ اگر خریدے تو مضاربت کے مال کا ضامن ہو گا"],["m","وَإِنْ لَمْ يَكُنْ فِي الْمَالِ رِبْحٌ جَازَ أَنْ يَشْتَرِيَهُمْ فَإِنْ زَادَتْ قِيمَتُهُمْ عَتَقَ نَصِيبُهُ مِنْهُمْ وَلَمْ يَضْمَنْ لِرَبِّ الْمَالِ شَيْئًا",null,"اور اگر نفع نہ ہو تو انہیں خریدنا جائز ہے، پھر اگر ان کی قیمت بڑھ گئی تو ان میں اس کا حصہ آزاد ہو جائے گا اور وہ رب المال کا کچھ ضامن نہیں ہو گا"],["m","وَيَسْعَى الْمُعْتَقُ لِرَبِّ الْمَالِ فِي قِيمَةِ نَصِيبِهِ مِنْهُ",null,"اور آزاد ہونے والا رب المال کے حصے کی قیمت کی کمائی کرے گا"],["m","وَإِذَا دَفَعَ الْمُضَارِبُ الْمَالَ مُضَارَبَةً وَلَمْ يَأْذَنْ لَهُ رَبُّ الْمَالِ فِي ذَلِكَ لَمْ يَضْمَنْ بِالدَّفْعِ وَلَا بِتَصَرُّفِ الْمُضَارِبِ الثَّانِي حَتَّى يَرْبَحَ",null,"اگر مضارب نے رب المال کی اجازت کے بغیر مال آگے مضاربت پر دے دیا تو دینے سے اور دوسرے مضارب کے تصرف سے ضامن نہیں ہوتا جب تک نفع نہ ہو"],["m","فَإِذَا رَبِحَ ضَمِنَ الْمُضَارِبُ الْأَوَّلُ الْمَالَ",null,"جب نفع ہو جائے تو پہلا مضارب مال کا ضامن ہو جاتا ہے"]]},{"t":"الْمُضَارَبَةُ الثَّانِيَةُ وَالْعَزْلُ وَالْهَلَاكُ","tu":"دوسری مضاربت، معزولی اور ہلاکت","ed":true,"items":[["f","تَفْصِيلُ الرِّبْحِ بَيْنَ الْمُضَارِبَيْنِ",null,"دو مضاربوں کے درمیان نفع کی تفصیل"],["m","وَإِذَا دَفَعَ إِلَيْهِ الْمَالَ مُضَارَبَةً بِالنِّصْفِ فَأَذِنَ لَهُ أَنْ يَدْفَعَهَا مُضَارَبَةً فَدَفَعَهَا بِالثُّلُثِ",null,"اگر رب المال نے اسے آدھے نفع پر مضاربت کا مال دیا اور اجازت دی کہ آگے مضاربت پر دے، پھر اس نے ایک تہائی نفع پر دے دیا"],["m","فَإِنْ كَانَ رَبُّ الْمَالِ قَالَ لَهُ: عَلَى أَنَّ مَا رَزَقَ اللَّهُ بَيْنَنَا نِصْفَانِ فَلِرَبِّ الْمَالِ نِصْفُ الرِّبْحِ وَلِلْمُضَارِبِ الثَّانِي ثُلُثُ الرِّبْحِ وَلِلْأَوَّلِ السُّدُسُ",null,"اگر رب المال نے کہا تھا کہ جو اللہ رزق دے وہ ہمارے درمیان آدھا آدھا ہو گا تو رب المال کے لیے آدھا نفع، دوسرے مضارب کے لیے تہائی نفع اور پہلے کے لیے چھٹا حصہ ہو گا"],["m","وَإِنْ قَالَ: عَلَى أَنَّ مَا رَزَقَكَ اللَّهُ بَيْنَنَا نِصْفَانِ فَلِلْمُضَارِبِ الثَّانِي الثُّلُثُ وَمَا بَقِيَ بَيْنَ رَبِّ الْمَالِ وَالْمُضَارِبِ الْأَوَّلِ نِصْفَانِ",null,"اور اگر کہا کہ جو اللہ تجھے رزق دے وہ ہمارے درمیان آدھا آدھا ہو گا تو دوسرے مضارب کے لیے تہائی ہے اور جو باقی رہا وہ رب المال اور پہلے مضارب کے درمیان آدھا آدھا"],["m","فَإِنْ قَالَ لَهُ: عَلَى أَنَّ مَا رَزَقَ اللَّهُ فَلِي نِصْفُهُ فَدَفَعَ الْمَالَ إِلَى آخَرَ مُضَارَبَةً بِالنِّصْفِ فَلِلْمُضَارِبِ الثَّانِي نِصْفُ الرِّبْحِ وَلِرَبِّ الْمَالِ النِّصْفُ وَلَا شَيْءَ لِلْمُضَارِبِ الْأَوَّلِ",null,"اگر کہا کہ جو اللہ رزق دے اس میں آدھا میرا ہے اور اس نے مال دوسرے کو آدھے نفع پر دے دیا تو دوسرے مضارب کے لیے آدھا نفع، رب المال کے لیے آدھا، اور پہلے مضارب کے لیے کچھ نہیں"],["m","فَإِنْ شَرَطَ لِلْمُضَارِبِ الثَّانِي ثُلُثَيِ الرِّبْحِ فَلِرَبِّ الْمَالِ نِصْفُ الرِّبْحِ وَلِلْمُضَارِبِ الثَّانِي نِصْفُ الرِّبْحِ وَيَضْمَنُ الْأَوَّلُ لِلْمُضَارِبِ الثَّانِي سُدُسَ الرِّبْحِ مِنْ مَالِهِ",null,"اور اگر دوسرے مضارب کے لیے دو تہائی نفع کی شرط لگائی تو رب المال کے لیے آدھا نفع، دوسرے مضارب کے لیے آدھا، اور پہلا مضارب دوسرے کو چھٹا حصہ نفع اپنے مال سے دے گا"],["f","فَسْخُ الْمُضَارَبَةِ وَالْعَزْلُ",null,"مضاربت کا ختم ہونا اور معزولی"],["m","وَإِذَا مَاتَ رَبُّ الْمَالِ أَوِ الْمُضَارِبُ بَطَلَتِ الْمُضَارَبَةُ",null,"رب المال یا مضارب مر جائے تو مضاربت باطل ہو جاتی ہے"],["m","وَإِنِ ارْتَدَّ رَبُّ الْمَالِ عَنِ الْإِسْلَامِ وَلَحِقَ بِدَارِ الْحَرْبِ بَطَلَتِ الْمُضَارَبَةُ",null,"اگر رب المال اسلام سے مرتد ہو کر دارالحرب چلا جائے تو مضاربت باطل ہو جاتی ہے"],["m","وَإِذَا عَزَلَ رَبُّ الْمَالِ الْمُضَارِبَ وَلَمْ يَعْلَمْ بِعَزْلِهِ حَتَّى اشْتَرَى وَبَاعَ فَتَصَرُّفُهُ جَائِزٌ",null,"اگر رب المال نے مضارب کو معزول کر دیا اور اسے معزولی کا علم نہ ہوا یہاں تک کہ اس نے خرید و فروخت کی تو اس کا تصرف جائز ہے"],["m","وَإِنْ عَلِمَ بِعَزْلِهِ وَالْمَالُ عُرُوضٌ فَلَهُ أَنْ يَبِيعَهَا وَلَا يَمْنَعُهُ الْعَزْلُ مِنْ ذَلِكَ ثُمَّ لَا يَجُوزُ أَنْ يَشْتَرِيَ بِثَمَنِهَا شَيْئًا آخَرَ",null,"اور اگر اسے معزولی کا علم ہو اور مال سامان کی شکل میں ہو تو وہ اسے بیچ سکتا ہے، معزولی اسے اس سے نہیں روکتی، پھر اس کے ثمن سے کوئی اور چیز خریدنا جائز نہیں"],["m","وَإِنْ عَزَلَهُ وَرَأْسُ الْمَالِ دَرَاهِمُ أَوْ دَنَانِيرُ قَدْ نَضَّتْ فَلَيْسَ لَهُ أَنْ يَتَصَرَّفَ فِيهِ",null,"اور اگر معزول کیا جبکہ رأس المال درہم یا دینار کی صورت میں نقد ہو چکا ہو تو اسے اس میں تصرف کا حق نہیں"],["m","وَإِذَا افْتَرَقَا وَفِي الْمَالِ دُيُونٌ وَقَدْ رَبِحَ الْمُضَارِبُ فِيهِ أَجْبَرَهُ الْحَاكِمُ عَلَى اقْتِضَاءِ الدُّيُونِ",null,"اگر دونوں جدا ہو جائیں اور مال میں لوگوں پر دین ہو جبکہ مضارب کو نفع ہوا ہو تو حاکم اسے دین وصول کرنے پر مجبور کرے گا"],["m","وَإِنْ لَمْ يَكُنْ لَهُ رِبْحٌ لَمْ يَلْزَمْهُ الِاقْتِضَاءُ وَيُقَالُ لَهُ: وَكِّلْ رَبَّ الْمَالِ فِي الِاقْتِضَاءِ",null,"اور اگر نفع نہ ہوا ہو تو اس پر وصولی لازم نہیں، اس سے کہا جائے گا: رب المال کو وصولی کا وکیل بنا دو"],["f","هَلَاكُ الْمَالِ وَتَرَادُّ الرِّبْحِ",null,"مال کی ہلاکت اور نفع کی واپسی"],["m","وَمَا هَلَكَ مِنْ مَالِ الْمُضَارَبَةِ فَهُوَ مِنَ الرِّبْحِ دُونَ رَأْسِ الْمَالِ",null,"مضاربت کے مال میں سے جو ہلاک ہو وہ نفع سے شمار ہوتا ہے، رأس المال سے نہیں"],["m","فَإِنْ زَادَ الْهَالِكُ عَلَى الرِّبْحِ فَلَا ضَمَانَ عَلَى الْمُضَارِبِ فِيهِ",null,"اگر ہلاک شدہ نفع سے زیادہ ہو تو مضارب پر اس کا ضمان نہیں"],["m","وَإِنْ كَانَا قَدِ اقْتَسَمَا الرِّبْحَ وَالْمُضَارَبَةُ بِحَالِهَا ثُمَّ هَلَكَ الْمَالُ أَوْ بَعْضُهُ تَرَادَّا الرِّبْحَ حَتَّى يَسْتَوْفِيَ رَبُّ الْمَالِ رَأْسَ الْمَالِ",null,"اگر دونوں نے نفع تقسیم کر لیا جبکہ مضاربت قائم تھی، پھر مال یا اس کا کچھ حصہ ہلاک ہو گیا تو نفع واپس کیا جائے گا یہاں تک کہ رب المال اپنا رأس المال پورا لے لے"],["m","فَإِنْ فَضَلَ شَيْءٌ كَانَ بَيْنَهُمَا",null,"پھر اگر کچھ بچ جائے تو وہ دونوں کے درمیان ہو گا"],["m","وَإِنْ عَجَزَ عَنْ رَأْسِ الْمَالِ لَمْ يَضْمَنِ الْمُضَارِبُ",null,"اور اگر رأس المال پورا نہ ہو سکے تو مضارب ضامن نہیں"],["m","وَإِنْ كَانَا قَدِ اقْتَسَمَا الرِّبْحَ وَفَسَخَا الْمُضَارَبَةَ ثُمَّ عَقَدَاهَا فَهَلَكَ الْمَالُ لَمْ يَتَرَادَّا الرِّبْحَ الْأَوَّلَ",null,"اور اگر دونوں نے نفع تقسیم کر کے مضاربت فسخ کر دی، پھر دوبارہ عقد کیا اور مال ہلاک ہو گیا تو پہلا نفع واپس نہیں کریں گے"],["m","وَيَجُوزُ لِلْمُضَارِبِ أَنْ يَبِيعَ بِالنَّقْدِ وَالنَّسِيئَةِ وَلَا يُزَوِّجُ عَبْدًا وَلَا أَمَةً مِنْ مَالِ الْمُضَارَبَةِ",null,"مضارب نقد اور ادھار بیچ سکتا ہے، اور مضاربت کے مال میں سے نہ غلام کی شادی کرا سکتا ہے اور نہ باندی کی"]]}]},{"n":14,"title":"كِتَابُ الْوَكَالَةِ","tu":"کتاب الوکالۃ","babs":[{"t":"شُرُوطُ الْوَكَالَةِ وَأَحْكَامُ الْعُقُودِ","tu":"وکالت کی شرائط اور عقود کے احکام","ed":true,"items":[["f","مَا يَجُوزُ التَّوْكِيلُ فِيهِ",null,"جس میں وکالت جائز ہے"],["m","كُلُّ عَقْدٍ جَازَ أَنْ يَعْقِدَهُ الْإِنْسَانُ بِنَفْسِهِ جَازَ أَنْ يُوَكِّلَ بِهِ غَيْرَهُ",null,"ہر وہ عقد جو انسان خود کر سکتا ہو اس کے لیے دوسرے کو وکیل بنانا جائز ہے"],["m","وَيَجُوزُ التَّوْكِيلُ بِالْخُصُومَةِ فِي سَائِرِ الْحُقُوقِ وَبِإِثْبَاتِهَا",null,"تمام حقوق میں مقدمہ لڑنے اور انہیں ثابت کرنے کے لیے وکیل بنانا جائز ہے"],["m","وَيَجُوزُ التَّوْكِيلُ بِالِاسْتِيفَاءِ إِلَّا فِي الْحُدُودِ وَالْقِصَاصِ فَإِنَّ الْوَكَالَةَ لَا تَصِحُّ بِاسْتِيفَائِهِمَا مَعَ غَيْبَةِ الْمُوَكِّلِ عَنِ الْمَجْلِسِ",null,"وصول کرنے کے لیے بھی وکالت جائز ہے سوائے حدود اور قصاص کے، کیونکہ موکل کے مجلس سے غائب ہوتے ہوئے ان کی وصولی میں وکالت صحیح نہیں"],["m","وَقَالَ أَبُو حَنِيفَةَ: لَا يَجُوزُ التَّوْكِيلُ بِالْخُصُومَةِ إِلَّا بِرِضَا الْخَصْمِ",null,"امام ابوحنیفہؒ نے فرمایا: مقدمے کی وکالت فریقِ مخالف کی رضامندی کے بغیر جائز نہیں"],["m","إِلَّا أَنْ يَكُونَ الْمُوَكِّلُ مَرِيضًا أَوْ غَائِبًا مَسِيرَةَ ثَلَاثَةِ أَيَّامٍ فَصَاعِدًا",null,"الا یہ کہ موکل بیمار ہو یا تین دن یا اس سے زیادہ کی مسافت پر غائب ہو"],["m","وَقَالَ أَبُو يُوسُفَ وَمُحَمَّدٌ: يَجُوزُ التَّوْكِيلُ بِغَيْرِ رِضَا الْخَصْمِ",null,"امام ابو یوسفؒ و امام محمدؒ نے فرمایا: فریقِ مخالف کی رضامندی کے بغیر بھی وکالت جائز ہے"],["f","أَهْلِيَّةُ الْمُوَكِّلِ وَالْوَكِيلِ",null,"موکل اور وکیل کی اہلیت"],["m","وَمِنْ شَرْطِ الْوَكَالَةِ: أَنْ يَكُونَ الْمُوَكِّلُ مِمَّنْ يَمْلِكُ التَّصَرُّفَ وَتَلْزَمُهُ الْأَحْكَامُ وَالْوَكِيلُ مِمَّنْ يَعْقِلُ الْعَقْدَ وَيَقْصِدُهُ",null,"وکالت کی شرط یہ ہے کہ موکل ایسا ہو جو تصرف کا مالک ہو اور احکام اس پر لازم ہوں، اور وکیل ایسا ہو جو عقد کو سمجھتا اور اس کا ارادہ کرتا ہو"],["m","وَإِذَا وَكَّلَ الْحُرُّ الْبَالِغُ أَوِ الْمَأْذُونُ مِثْلَهُمَا جَازَ",null,"جب آزاد بالغ یا مأذون نے اپنے جیسے کو وکیل بنایا تو جائز ہے"],["m","وَإِنْ وَكَّلَا صَبِيًّا مَحْجُورًا يَعْقِلُ الْبَيْعَ وَالشِّرَاءَ أَوْ عَبْدًا مَحْجُورًا جَازَ وَلَا تَتَعَلَّقُ بِهِمَا الْحُقُوقُ وَتَتَعَلَّقُ بِمُوَكِّلَيْهِمَا",null,"اور اگر انہوں نے بیع و شراء سمجھنے والے محجور بچے یا محجور غلام کو وکیل بنایا تو جائز ہے، ان سے حقوق متعلق نہیں ہوتے بلکہ ان کے موکلین سے متعلق ہوتے ہیں"],["f","حُقُوقُ الْعَقْدِ",null,"عقد کے حقوق"],["m","وَالْعُقُودُ الَّتِي يَعْقِدُهَا الْوُكَلَاءُ عَلَى ضَرْبَيْنِ",null,"وکلاء جو عقود کرتے ہیں وہ دو قسم کے ہیں"],["m","فَكُلُّ عَقْدٍ يُضِيفُهُ الْوَكِيلُ إِلَى نَفْسِهِ - مِثْلَ الْبَيْعِ وَالْإِجَارَةِ - فَحُقُوقُ ذَلِكَ الْعَقْدِ تَتَعَلَّقُ بِالْوَكِيلِ دُونَ الْمُوَكِّلِ",null,"جو عقد وکیل اپنی طرف منسوب کرے، جیسے بیع اور اجارہ، اس کے حقوق وکیل سے متعلق ہوتے ہیں، موکل سے نہیں"],["m","فَيُسَلِّمُ الْمَبِيعَ وَيَقْبِضُ الثَّمَنَ وَيُطَالَبُ بِالثَّمَنِ إِذَا اشْتَرَى وَيَقْبِضُ الْمَبِيعَ وَيُخَاصِمُ بِالْعَيْبِ",null,"چنانچہ وہی مبیع حوالے کرتا ہے، ثمن وصول کرتا ہے، خریدے تو ثمن کا اس سے مطالبہ ہوتا ہے، مبیع پر قبضہ کرتا ہے اور عیب کا جھگڑا کرتا ہے"],["m","وَكُلُّ عَقْدٍ يُضِيفُهُ إِلَى مُوَكِّلِهِ - كَالنِّكَاحِ وَالْخُلْعِ وَالصُّلْحِ مِنْ دَمِ الْعَمْدِ - فَإِنَّ حُقُوقَهُ تَتَعَلَّقُ بِالْمُوَكِّلِ دُونَ الْوَكِيلِ",null,"اور جو عقد وکیل اپنے موکل کی طرف منسوب کرے، جیسے نکاح، خلع اور قتلِ عمد سے صلح، َمٍ عِنْدَ أَبِي حَنِيفَةَ",null,"اگر اسے ایک درہم کے دس رطل گوشت خریدنے کا وکیل بنایا اور اس نے ایسے گوشت کے بیس رطل ایک درہم میں خریدے جس کی مثل دس رطل ایک درہم میں بکتی ہے تو امام ابوحنیفہؒ کے نزدیک موکل پر دس رطل آدھے درہم میں لازم ہوں گے"],["m","وَقَالَ أَبُو يُوسُفَ وَمُحَمَّدٌ: يَلْزَمُهُ الْعِشْرُونَ",null,"اور امام ابو یوسفؒ و امام محمدؒ نے فرمایا: اس پر بیس لازم ہوں گے"],["m","وَإِذَا وَكَّلَهُ بِشِرَاءِ شَيْءٍ بِعَيْنِهِ فَلَيْسَ لَهُ أَنْ يَشْتَرِيَهُ لِنَفْسِهِ",null,"اگر اسے کسی معین چیز کی خریداری کا وکیل بنایا تو اسے حق نہیں کہ وہ اپنے لیے خرید لے"],["m","وَإِنْ وَكَّلَهُ بِشِرَاءِ عَبْدٍ بِغَيْرِ عَيْنِهِ فَاشْتَرَى عَبْدًا فَهُوَ لِلْوَكِيلِ إِلَّا أَنْ يَقُولَ: نَوَيْتُ الشِّرَاءَ لِلْمُوَكِّلِ أَوْ يَشْتَرِيَهُ بِمَالِ الْمُوَكِّلِ",null,"اور اگر غیر معین غلام کی خریداری کا وکیل بنایا اور اس نے غلام خریدا تو وہ وکیل کا ہے، الا یہ کہ کہے: میں نے موکل کے لیے خریدنے کی نیت کی تھی یا موکل کے مال سے خرید لے"],["f","الْوَكِيلُ بِالْخُصُومَةِ وَالْقَبْضِ",null,"مقدمے اور قبضے کا وکیل"],["m","وَالْوَكِيلُ بِالْخُصُومَةِ وَكِيلٌ بِالْقَبْضِ عِنْدَ أَبِي حَنِيفَةَ وَأَبِي يُوسُفَ وَمُحَمَّدٍ",null,"مقدمے کا وکیل قبضے کا بھی وکیل ہے، امام ابوحنیفہؒ، امام ابو یوسفؒ اور امام محمدؒ کے نزدیک"],["m","وَالْوَكِيلُ بِقَبْضِ الدَّيْنِ وَكِيلٌ بِالْخُصُومَةِ فِيهِ عِنْدَ أَبِي حَنِيفَةَ",null,"اور دین وصول کرنے کا وکیل امام ابوحنیفہؒ کے نزدیک اس میں مقدمے کا بھی وکیل ہے"],["m","وَإِذَا أَقَرَّ الْوَكِيلُ بِالْخُصُومَةِ عَلَى مُوَكِّلِهِ عِنْدَ الْقَاضِي جَازَ إِقْرَارُهُ وَلَا يَجُوزُ إِقْرَارُهُ عَلَيْهِ عِنْدَ غَيْرِ الْقَاضِي",null,"اگر مقدمے کے وکیل نے قاضی کے سامنے موکل کے خلاف اقرار کیا تو اس کا اقرار جائز ہے اور قاضی کے علاوہ کسی اور کے سامنے اس کے خلاف جائز نہیں"],["m","عِنْدَ أَبِي حَنِيفَةَ وَمُحَمَّدٍ إِلَّا أَنَّهُ يَخْرُجُ مِنَ الْخُصُومَةِ",null,"یہ امام ابوحنیفہؒ و امام محمدؒ کے نزدیک ہے، مگر وہ مقدمے سے نکل جاتا ہے"],["m","وَقَالَ أَبُو يُوسُفَ: يَجُوزُ إِقْرَارُهُ عَلَيْهِ عِنْدَ غَيْرِ الْقَاضِي",null,"اور امام ابو یوسفؒ نے فرمایا: قاضی کے علاوہ کسی اور کے سامنے بھی اس کا اقرار موکل پر جائز ہے"],["m","وَمَنِ ادَّعَى أَنَّهُ وَكِيلُ الْغَائِبِ فِي قَبْضِ دَيْنِهِ فَصَدَّقَهُ الْغَرِيمُ أُمِرَ بِتَسْلِيمِ الدَّيْنِ إِلَيْهِ",null,"جس نے دعویٰ کیا کہ وہ غائب شخص کا اس کا قرض وصول کرنے میں وکیل ہے اور مقروض نے تصدیق کر دی تو اسے قرض حوالے کرنے کا حکم دیا جائے گا"],["m","فَإِنْ حَضَرَ الْغَائِبُ فَصَدَّقَهُ وَإِلَّا دَفَعَ إِلَيْهِ الْغَرِيمُ الدَّيْنَ ثَانِيًا وَرَجَعَ بِهِ عَلَى الْوَكِيلِ إِنْ كَانَ بَاقِيًا فِي يَدِهِ",null,"پھر اگر غائب آ گیا اور تصدیق کر دی تو ٹھیک، ورنہ مقروض دوبارہ دین ادا کرے گا اور وکیل سے اس کا رجوع کرے گا اگر وہ اس کے ہاتھ میں باقی ہو"],["m","وَإِنْ قَالَ: إِنِّي وَكِيلٌ بِقَبْضِ الْوَدِيعَةِ فَصَدَّقَهُ الْمُودَعُ لَمْ يُؤْمَرْ بِالتَّسْلِيمِ إِلَيْهِ",null,"اور اگر کہا: میں امانت وصول کرنے کا وکیل ہوں اور امانت دار نے تصدیق کر دی تو اسے حوالے کرنے کا حکم نہیں دیا جائے گا"]]}]},{"n":15,"title":"كِتَابُ الْكَفَالَةِ","tu":"کتاب الکفالۃ","babs":[{"t":"الْكَفَالَةُ بِالنَّفْسِ","tu":"جان کی کفالت","ed":true,"items":[["f","صِيغَتُهَا وَحُكْمُهَا",null,"صیغہ اور حکم"],["m","الْكَفَالَةُ ضَرْبَانِ: كَفَالَةٌ بِالنَّفْسِ وَكَفَالَةٌ بِالْمَالِ",null,"کفالت دو قسم کی ہے: جان کی کفالت اور مال کی کفالت"],["m","فَالْكَفَالَةُ بِالنَّفْسِ جَائِزَةٌ وَالْمَضْمُونُ بِهَا إِحْضَارُ الْمَكْفُولِ بِهِ",null,"جان کی کفالت جائز ہے اور اس سے ذمے آنے والی چیز مکفول بہ کو حاضر کرنا ہے"],["m","وَتَنْعَقِدُ إِذَا قَالَ: تَكَفَّلْتُ بِنَفْسِ فُلَانٍ أَوْ بِرَقَبَتِهِ أَوْ بِرُوحِهِ أَوْ بِجَسَدِهِ أَوْ بِرَأْسِهِ أَوْ بِنِصْفِهِ أَوْ بِثُلُثِهِ",null,"یہ اس وقت منعقد ہوتی ہے جب کہے: میں نے فلاں کی جان، گردن، روح، جسم، سر، آدھے یا تہائی کی کفالت لی"],["m","وَكَذَلِكَ إِنْ قَالَ: ضَمِنْتُهُ أَوْ هُوَ عَلَيَّ أَوْ إِلَيَّ أَوْ أَنَا زَعِيمٌ بِهِ أَوْ قَبِيلٌ",null,"اسی طرح اگر کہے: میں نے اسے ضمانت میں لیا، یا وہ مجھ پر ہے، یا میری طرف ہے، یا میں اس کا زعیم ہوں، یا قبیل ہوں"],["f","وَقْتُ التَّسْلِيمِ وَمَكَانُهُ",null,"حوالگی کا وقت اور جگہ"],["m","فَإِنْ شُرِطَ فِي الْكَفَالَةِ تَسْلِيمُ الْمَكْفُولِ بِهِ فِي وَقْتٍ بِعَيْنِهِ لَزِمَهُ إِحْضَارُهُ إِذَا طَالَبَهُ بِهِ فِي ذَلِكَ الْوَقْتِ",null,"اگر کفالت میں مکفول بہ کو کسی معین وقت میں حوالے کرنے کی شرط لگائی گئی ہو تو اس وقت مطالبہ کرنے پر اس کا حاضر کرنا لازم ہے"],["m","فَإِنْ أَحْضَرَهُ وَإِلَّا حَبَسَهُ الْحَاكِمُ حَتَّى يُحْضِرَهُ",null,"اگر حاضر کر دیا تو ٹھیک، ورنہ حاکم اسے قید کر دے گا یہاں تک کہ وہ حاضر کر دے"],["m","وَإِذَا أَحْضَرَهُ وَسَلَّمَهُ فِي مَكَانٍ يَقْدِرُ الْمَكْفُولُ لَهُ عَلَى مُحَاكَمَتِهِ بَرِئَ الْكَفِيلُ مِنَ الْكَفَالَةِ",null,"جب اسے ایسی جگہ حاضر کر کے حوالے کر دیا جہاں مکفول لہ اس سے مقدمہ لڑ سکتا ہو تو کفیل کفالت سے بری ہو گیا"],["m","وَإِذَا تَكَفَّلَ بِهِ عَلَى أَنْ يُسَلِّمَهُ فِي مَجْلِسِ الْقَاضِي فَسَلَّمَهُ فِي السُّوقِ بَرِئَ وَإِنْ سَلَّمَهُ فِي بَرِّيَّةٍ لَمْ يَبْرَأْ",null,"اگر اس شرط پر کفالت لی کہ اسے قاضی کی مجلس میں حوالے کرے گا اور بازار میں حوالے کر دیا تو بری ہو گیا، اور اگر جنگل میں حوالے کیا تو بری نہیں ہوا"],["m","وَإِنْ مَاتَ الْمَكْفُولُ بِهِ بَرِئَ الْكَفِيلُ بِالنَّفْسِ مِنَ الْكَفَالَةِ",null,"اگر مکفول بہ مر جائے تو جان کا کفیل کفالت سے بری ہو جاتا ہے"],["m","فَإِنْ تَكَفَّلَ بِنَفْسِهِ عَلَى أَنَّهُ إِنْ لَمْ يُوَافِ بِهِ فِي وَقْتِ كَذَا فَهُوَ ضَامِنٌ لِمَا عَلَيْهِ وَهُوَ أَلْفٌ وَلَمْ يُحْضِرْهُ فِي ذَلِكَ الْوَقْتِ لَزِمَهُ ضَمَانُ الْمَالِ وَلَمْ يَبْرَأْ مِنَ الْكَفَالَةِ بِالنَّفْسِ",null,"اگر اس کی جان کی کفالت اس شرط پر لی کہ اگر فلاں وقت تک اسے نہ لایا تو جو اس پر ہے وہ اس کا ضامن ہے، اور وہ ہزار ہے، اور اس وقت حاضر نہ کیا تو مال کی ضمانت لازم ہو گئی اور جان کی کفالت سے بری نہیں ہوا"],["m","وَلَا يَجُوزُ الْكَفَالَةُ بِالنَّفْسِ فِي الْحُدُودِ وَالْقِصَاصِ عِنْدَ أَبِي حَنِيفَةَ وَقَالَا: يَجُوزُ",null,"امام ابوحنیفہؒ کے نزدیک حدود اور قصاص میں جان کی کفالت جائز نہیں، اور صاحبین نے فرمایا: جائز ہے"]]},{"t":"الْكَفَالَةُ بِالْمَالِ","tu":"مال کی کفالت","ed":true,"items":[["f","أَحْكَامُهَا",null,"احکام"],["m","وَأَمَّا الْكَفَالَةُ بِالْمَالِ فَجَائِزَةٌ مَعْلُومًا كَانَ الْمَالُ الْمَكْفُولُ بِهِ أَوْ مَجْهُولًا إِذَا كَانَ دَيْنًا صَحِيحًا",null,"مال کی کفالت جائز ہے، مکفول بہ مال معلوم ہو یا نامعلوم، بشرطیکہ وہ صحیح دین ہو"],["m","مِثْلَ أَنْ يَقُولَ: تَكَفَّلْتُ عَنْهُ بِأَلْفٍ أَوْ بِمَا لَكَ عَلَيْهِ أَوْ بِمَا يُدْرِكُكَ فِي هَذَا الْبَيْعِ",null,"مثلاً کہے: میں نے اس کی طرف سے ہزار کی کفالت لی، یا جو تیرا اس پر ہے، یا اس بیع میں جو تجھے لاحق ہو"],["m","وَالْمَكْفُولُ لَهُ بِالْخِيَارِ: إِنْ شَاءَ طَالَبَ الَّذِي عَلَيْهِ الْأَصْلُ وَإِنْ شَاءَ طَالَبَ كَفِيلَهُ",null,"مکفول لہ کو اختیار ہے: چاہے اصل مقروض سے مطالبہ کرے اور چاہے اس کے کفیل سے"],["m","وَيَجُوزُ تَعْلِيقُ الْكَفَالَةِ بِالشَّرْطِ مِثْلَ أَنْ يَقُولَ: مَا بَايَعْتَ فُلَانًا فَعَلَيَّ أَوْ مَا ذَابَ لَكَ عَلَيْهِ فَعَلَيَّ أَوْ مَا غَصَبَكَ فُلَانٌ فَعَلَيَّ",null,"کفالت کو شرط پر معلق کرنا جائز ہے، مثلاً کہے: تم فلاں سے جو سودا کرو وہ مجھ پر ہے، یا جو اس پر تیرا واجب ہو وہ مجھ پر ہے، یا فلاں تجھ سے جو غصب کرے وہ مجھ پر ہے"],["m","وَإِذَا قَالَ: تَكَفَّلْتُ بِمَا لَكَ عَلَيْهِ فَقَامَتِ الْبَيِّنَةُ بِأَلْفٍ عَلَيْهِ ضَمِنَهُ الْكَفِيلُ",null,"اگر کہا: جو تیرا اس پر ہے میں اس کا کفیل ہوں، پھر گواہی سے ثابت ہوا کہ اس پر ہزار ہے تو کفیل اس کا ضامن ہو گا"],["m","فَإِنْ لَمْ تَقُمِ الْبَيِّنَةُ فَالْقَوْلُ قَوْلُ الْكَفِيلِ مَعَ يَمِينِهِ فِي مِقْدَارِ مَا يَعْتَرِفُ بِهِ",null,"اگر گواہی قائم نہ ہو تو جس مقدار کا کفیل اعتراف کرے اس میں قسم کے ساتھ اسی کی بات معتبر ہے"],["m","فَإِنِ اعْتَرَفَ الْمَكْفُولُ عَنْهُ بِأَكْثَرَ مِنْ ذَلِكَ لَمْ يُصَدَّقْ عَلَى كَفِيلِهِ",null,"اگر مکفول عنہ اس سے زیادہ کا اعتراف کرے تو اس کے کفیل کے خلاف اس کی تصدیق نہیں کی جائے گی"],["m","وَتَجُوزُ الْكَفَالَةُ بِأَمْرِ الْمَكْفُولِ عَنْهُ وَبِغَيْرِ أَمْرِهِ",null,"کفالت مکفول عنہ کے حکم سے بھی جائز ہے اور بغیر حکم کے بھی"],["m","فَإِنْ كَفَلَ بِأَمْرِهِ رَجَعَ بِمَا يُؤَدِّي عَلَيْهِ وَإِنْ كَفَلَ بِغَيْرِ أَمْرِهِ لَمْ يَرْجِعْ بِمَا يُؤَدِّيهِ",null,"اگر اس کے حکم سے کفیل بنا تو جو ادا کرے اس کا رجوع کرے گا، اور اگر بغیر حکم کے بنا تو جو ادا کرے اس کا رجوع نہیں کرے گا"],["m","وَلَيْسَ لِلْكَفِيلِ أَنْ يُطَالِبَ الْمَكْفُولَ عَنْهُ بِالْمَالِ قَبْلَ أَنْ يُؤَدِ ِئَ الْمُحِيلُ مِنَ الدَّيْنِ",null,"جب حوالہ مکمل ہو گیا تو محیل دین سے بری ہو گیا"],["m","وَلَمْ يَرْجِعِ الْمُحْتَالُ عَلَى الْمُحِيلِ إِلَّا أَنْ يَتْوَى حَقُّهُ",null,"اور محتال محیل سے رجوع نہیں کر سکتا الا یہ کہ اس کا حق ڈوب جائے"],["m","وَالتَّوَى عِنْدَ أَبِي حَنِيفَةَ أَحَدُ أَمْرَيْنِ: إِمَّا أَنْ يَجْحَدَ الْحَوَالَةَ وَيَحْلِفَ وَلَا بَيِّنَةَ عَلَيْهِ أَوْ يَمُوتَ مُفْلِسًا",null,"امام ابوحنیفہؒ کے نزدیک \"توی\" (حق ڈوبنا) دو باتوں میں سے ایک ہے: یا تو محال علیہ حوالے کا انکار کرے اور قسم کھا لے اور اس کے خلاف گواہی نہ ہو، یا مفلس مر جائے"],["m","وَقَالَ أَبُو يُوسُفَ وَمُحَمَّدٌ: هَذَانِ وَوَجْهٌ ثَالِثٌ وَهُوَ أَنْ يَحْكُمَ الْحَاكِمُ بِإِفْلَاسِهِ فِي حَالِ حَيَاتِهِ",null,"امام ابو یوسفؒ و امام محمدؒ نے فرمایا: یہی دو اور تیسری صورت یہ ہے کہ حاکم اس کی زندگی میں اس کے مفلس ہونے کا فیصلہ کر دے"],["f","اخْتِلَافُ الْمُحِيلِ وَالْمُحَالِ عَلَيْهِ",null,"محیل اور محال علیہ کا اختلاف"],["m","وَإِذَا طَالَبَ الْمُحَالُ عَلَيْهِ الْمُحِيلَ بِمِثْلِ مَالِ الْحَوَالَةِ فَقَالَ الْمُحِيلُ: أَحَلْتُ بِدَيْنٍ لِي عَلَيْكَ لَمْ يُقْبَلْ قَوْلُهُ وَكَانَ عَلَيْهِ مِثْلُ الدَّيْنِ",null,"اگر محال علیہ نے محیل سے حوالے کے مال کے برابر کا مطالبہ کیا اور محیل نے کہا: میں نے تجھ پر اپنے دین کا حوالہ کیا تھا تو اس کی بات قبول نہیں ہو گی اور اس پر دین کے برابر مال لازم ہو گا"],["m","وَإِنْ طَالَبَ الْمُحِيلُ الْمُحْتَالَ بِمَا أَحَالَهُ بِهِ فَقَالَ: إِنَّمَا أَحَلْتُكَ لِتَقْبِضَهُ لِي وَقَالَ الْمُحْتَالُ: بَلْ أَحَلْتَنِي بِدَيْنٍ كَانَ لِي عَلَيْكَ فَالْقَوْلُ قَوْلُ الْمُحِيلِ",null,"اور اگر محیل نے محتال سے اس مال کا مطالبہ کیا جس کا اسے حوالہ دیا تھا اور کہا: میں نے تجھے اس لیے حوالہ دیا تھا کہ تو میرے لیے وصول کرے، اور محتال نے کہا: نہیں، تم نے مجھے میرے اس دین کا حوالہ دیا تھا جو تم پر تھا، تو محیل کی بات معتبر ہے"],["m","وَتُكْرَهُ السَّفَاتِجُ وَهِيَ قَرْضٌ اسْتَفَادَ بِهِ الْمُقْرِضُ أَمْنَ خَطَرِ الطَّرِيقِ",null,"اور سفتجے مکروہ ہیں، یہ ایسا قرض ہے جس سے قرض دینے والا راستے کے خطرے سے محفوظ ہونے کا فائدہ اٹھاتا ہے"]]}]},{"n":17,"title":"كِتَابُ الصُّلْحِ","tu":"کتاب الصلح","babs":[{"t":"أَقْسَامُ الصُّلْحِ وَأَحْكَامُهُ","tu":"صلح کی اقسام اور احکام","ed":true,"items":[["f","أَضْرُبُ الصُّلْحِ",null,"صلح کی قسمیں"],["m","الصُّلْحُ عَلَى ثَلَاثَةِ أَضْرُبٍ: صُلْحٌ مَعَ إِقْرَارٍ وَصُلْحٌ مَعَ سُكُوتٍ وَهُوَ أَنْ لَا يُقِرَّ الْمُدَّعَى عَلَيْهِ وَلَا يُنْكِرَ وَصُلْحٌ مَعَ إِنْكَارٍ وَكُلُّ ذَلِكَ جَائِزٌ",null,"صلح تین قسم کا ہے: اقرار کے ساتھ صلح، سکوت کے ساتھ صلح (یعنی مدعا علیہ نہ اقرار کرے نہ انکار) اور انکار کے ساتھ صلح؛ اور یہ سب جائز ہیں"],["m","فَإِنْ وَقَعَ الصُّلْحُ عَنْ إِقْرَارٍ اعْتُبِرَ فِيهِ مَا يُعْتَبَرُ فِي الْبِيَاعَاتِ إِنْ وَقَعَ عَنْ مَالٍ بِمَالٍ",null,"اگر صلح اقرار کی حالت میں ہوئی تو اس میں وہ باتیں معتبر ہوں گی جو بیوع میں معتبر ہیں اگر مال کے بدلے مال پر صلح ہو"],["m","وَإِنْ وَقَعَ عَنْ مَالٍ بِمَنَافِعَ فَيُعْتَبَرُ بِالْإِجَارَاتِ",null,"اور اگر مال کے بدلے منافع پر ہو تو اجارات کا اعتبار ہو گا"],["m","وَالصُّلْحُ عَنِ السُّكُوتِ وَالْإِنْكَارِ فِي حَقِّ الْمُدَّعَى عَلَيْهِ لِافْتِدَاءِ الْيَمِينِ وَقَطْعِ الْخُصُومَةِ وَفِي حَقِّ الْمُدَّعِي بِمَعْنَى الْمُعَاوَضَةِ",null,"سکوت اور انکار کی صلح مدعا علیہ کے حق میں قسم سے بچنے اور جھگڑا ختم کرنے کے لیے ہے، اور مدعی کے حق میں معاوضے کے معنی میں ہے"],["f","الصُّلْحُ فِي الدَّارِ وَالِاسْتِحْقَاقُ",null,"مکان میں صلح اور استحقاق"],["m","وَإِذَا صَالَحَ عَنْ دَارٍ لَمْ تَجِبْ فِيهِ شُفْعَةٌ وَإِذَا صَالَحَ عَلَى دَارٍ وَجَبَتْ فِيهَا الشُّفْعَةُ",null,"اگر مکان کے دعوے سے (کسی مال پر) صلح کی تو اس میں شفعہ واجب نہیں، اور اگر مکان پر (بدلے میں) صلح کی تو اس میں شفعہ واجب ہے"],["m","وَإِذَا كَانَ الصُّلْحُ عَنْ إِقْرَارٍ فَاسْتُحِقَّ بَعْضُ الْمُصَالَحِ عَنْهُ رَجَعَ الْمُدَّعَى عَلَيْهِ بِحِصَّةِ ذَلِكَ مِنَ الْعِوَضِ",null,"جب صلح اقرار پر ہوئی اور جس چیز پر صلح ہوئی اس کا کچھ حصہ کسی اور کا نکل آیا تو مدعا علیہ عوض میں سے اتنا حصہ واپس لے گا"],["m","وَإِنْ وَقَعَ الصُّلْحُ عَنْ سُكُوتٍ أَوْ إِنْكَارٍ فَاسْتُحِقَّ الْمُتَنَازَعُ فِيهِ رَجَعَ الْمُدَّعِي بِالْخُصُومَةِ وَرَدَّ الْعِوَضَ",null,"اور اگر صلح سکوت یا انکار پر ہوئی، پھر جس چیز ین پر صلح"],["m","وَكُلُّ شَيْءٍ وَقَعَ عَلَيْهِ الصُّلْحُ وَهُوَ مُسْتَحَقٌّ بِعَقْدِ الْمُدَايَنَةِ لَمْ يُحْمَلْ عَلَى الْمُعَاوَضَةِ وَإِنَّمَا يُحْمَلُ عَلَى أَنَّهُ اسْتَوْفَى بَعْضَ حَقِّهِ وَأَسْقَطَ بَاقِيَهُ",null,"جس چیز پر صلح ہو اور وہ عقدِ مداینت (قرض) سے واجب ہو تو اسے معاوضہ پر محمول نہیں کیا جائے گا بلکہ اس پر محمول ہو گا کہ اس نے اپنا کچھ حق وصول کیا اور باقی ساقط کر دیا"],["m","كَمَنْ لَهُ عَلَى رَجُلٍ أَلْفُ دِرْهَمٍ جِيَادٌ فَصَالَحَهُ عَلَى خَمْسِمِائَةٍ زُيُوفٍ جَازَ وَصَارَ كَأَنَّهُ أَبْرَأَهُ عَنْ بَعْضِ حَقِّهِ وَأَخَذَ بَاقِيَهُ",null,"جیسے کسی کا کسی پر ہزار کھرے درہم تھے اور اس نے پانچ سو کھوٹے درہم پر صلح کر لی تو جائز ہے اور گویا اس نے اپنے حق کا کچھ حصہ معاف کر کے باقی لے لیا"],["m","وَلَوْ صَالَحَهُ عَلَى أَلْفٍ مُؤَجَّلٍ جَازَ وَصَارَ كَأَنَّهُ أَجَّلَ نَفْسَ الْحَقِّ",null,"اور اگر ادھار ہزار پر صلح کی تو جائز ہے اور گویا اس نے اصل حق کی مدت بڑھا دی"],["m","وَلَوْ صَالَحَهُ عَلَى دَنَانِيرَ إِلَى شَهْرٍ لَمْ يَجُزْ",null,"اور اگر ایک ماہ کے ادھار دیناروں پر صلح کی تو جائز نہیں"],["m","وَلَوْ كَانَ لَهُ أَلْفٌ مُؤَجَّلَةٌ فَصَالَحَهُ عَلَى خَمْسِمِائَةٍ حَالَّةٍ لَمْ يَجُزْ",null,"اور اگر اس کے ہزار ادھار تھے اور اس نے پانچ سو نقد پر صلح کر لی تو جائز نہیں"],["m","وَلَوْ كَانَ لَهُ أَلْفٌ سُودٌ فَصَالَحَهُ عَلَى خَمْسِمِائَةٍ بِيضٍ لَمْ يَجُزْ",null,"اور اگر اس کے ہزار کالے (کھوٹے) درہم تھے اور پانچ سو سفید (کھرے) درہم پر صلح کر لی تو جائز نہیں"],["f","الْوَكِيلُ بِالصُّلْحِ وَالصُّلْحُ عَنِ الْغَيْرِ",null,"صلح کا وکیل اور دوسرے کی طرف سے صلح"],["m","وَمَنْ وَكَّلَ رَجُلًا بِالصُّلْحِ عَنْهُ فَصَالَحَ لَمْ يَلْزَمِ الْوَكِيلَ مَا صَالَحَ عَلَيْهِ إِلَّا أَنْ يَضْمَنَهُ وَالْمَالُ لَازِمٌ لِلْمُوَكِّلِ",null,"جس نے کسی آدمی کو اپنی طرف سے صلح کا وکیل بنایا اور اس نے صلح کر لی تو جس پر صلح ہوئی وہ وکیل پر لازم نہیں الا یہ کہ ضامن بن جائے، اور مال موکل پر لازم ہے"],["m","فَإِنْ صَالَحَ عَنْهُ عَلَى شَيْءٍ بِغَيْرِ أَمْرِهِ فَهُوَ عَلَى أَرْبَعَةِ أَوْجُهٍ: إِنْ صَالَحَ بِمَالٍ وَضَمِنَهُ تَمَّ الصُّلْحُ",null,"اگر اس کی طرف سے اس کے انَ السَّلَمُ بَيْنَ شَرِيكَيْنِ فَصَالَحَ أَحَدُهُمَا مِنْ نَصِيبِهِ عَلَى رَأْسِ الْمَالِ لَمْ يَجُزْ عِنْدَ أَبِي حَنِيفَةَ وَمُحَمَّدٍ رَحِمَهُمَا اللَّهُ وَقَالَ أَبُو يُوسُفَ ﵀: يَجُوزُ الصُّلْحُ",null,"اگر سلم دو شریکوں کے درمیان ہو اور ایک نے اپنے حصے پر رأس المال کے بدلے صلح کر لی تو امام ابوحنیفہؒ و امام محمدؒ کے نزدیک جائز نہیں، اور امام ابو یوسفؒ نے فرمایا: صلح جائز ہے"]]},{"t":"الصُّلْحُ فِي التَّرِكَةِ","tu":"ترکے میں صلح","ed":true,"items":[["m","وَإِذَا كَانَتِ التَّرِكَةُ بَيْنَ وَرَثَةٍ فَأَخْرَجُوا أَحَدَهُمْ مِنْهَا بِمَالٍ أَعْطَوْهُ إِيَّاهُ وَالتَّرِكَةُ عَقَارٌ أَوْ عُرُوضٌ جَازَ قَلِيلًا كَانَ مَا أَعْطَوْهُ أَوْ كَثِيرًا",null,"اگر ترکہ ورثاء کے درمیان ہو اور انہوں نے ایک وارث کو مال دے کر اس سے نکال دیا اور ترکہ جائیداد یا سامان ہو تو جائز ہے چاہے جو دیا وہ کم ہو یا زیادہ"],["m","وَإِنْ كَانَتِ التَّرِكَةُ فِضَّةً فَأَعْطَوْهُ ذَهَبًا أَوْ كَانَتْ ذَهَبًا فَأَعْطَوْهُ فِضَّةً فَهُوَ كَذَلِكَ",null,"اور اگر ترکہ چاندی ہو اور انہوں نے اسے سونا دیا، یا سونا ہو اور اسے چاندی دی، تو بھی یہی حکم ہے"],["m","وَإِنْ كَانَتِ التَّرِكَةُ ذَهَبًا وَفِضَّةً وَغَيْرَ ذَلِكَ فَصَالَحُوهُ عَلَى فِضَّةٍ أَوْ ذَهَبٍ فَلَا بُدَّ أَنْ يَكُونَ مَا أَعْطَوْهُ أَكْثَرَ مِنْ نَصِيبِهِ مِنْ ذَلِكَ الْجِنْسِ",null,"اور اگر ترکہ سونا، چاندی اور اس کے علاوہ چیزیں ہوں اور انہوں نے چاندی یا سونے پر صلح کی تو ضروری ہے کہ جو دیا وہ اس جنس میں اس کے حصے سے زیادہ ہو"],["m","حَتَّى يَكُونَ نَصِيبُهُ بِمِثْلِهِ وَالزِّيَادَةُ بِحَقِّهِ مِنْ بَقِيَّةِ الْمِيرَاثِ",null,"تاکہ اس کا حصہ اپنی مثل کے بدلے ہو جائے اور زیادتی میراث کے باقی حصے میں اس کے حق کے بدلے ہو"],["m","وَإِنْ كَانَ فِي التَّرِكَةِ دَيْنٌ عَلَى النَّاسِ فَأَدْخَلُوهُ فِي الصُّلْحِ عَلَى أَنْ يُخْرِجُوا الْمُصَالَحَ عَنْهُ وَيَكُونَ الدَّيْنُ لَهُمْ فَالصُّلْحُ بَاطِلٌ",null,"اگر ترکے میں لوگوں پر قرض ہو اور انہوں نے اسے صلح میں شامل کر لیا اس شرط پر کہ صلح کرنے والے کو نکال دیں اور دین انہی کا ہو تو صلح باطل ہے"],["m","فَإِنْ شَرَطُوا أَنْ يُبْرِئَ الْغُرَمَاءَ مِنْهُ وَلَا يَرْجِعَ عَلَيْهِمْ بِنَصِيبِ الْمُصَالَحِ فَالصُّلْحُ جَائِزٌ",null,"اور اگر انہوں نے شرط لگائی کہ وہ مقروضوں کو اس دین سے بری کر دے گا اور ان پر صلح کرنے والے کے حصے کا رجوع نہیں کرے گا تو صلح جائز ہے"]]}]}];

:"صاحبین کا استسقاء میں قول؟","a":"دو رکعتیں جہر سے، خطبہ، قبلہ رخ دعا، امام چادر پلٹے؛ ذمی حاضر نہ ہوں۔"},{"k":2,"n":131,"q":"رمضان کا قیام؟","a":"عشاء کے بعد جماعت سے پانچ ترویحات (ہر ایک میں دو سلام)، پھر وتر جماعت سے۔"},{"k":2,"n":132,"q":"نمازِ خوف کا طریقہ؟","a":"دو گروہ؛ ایک امام کے ساتھ ایک رکعت، پھر دشمن کی طرف؛ دوسرا گروہ آ کر ایک رکعت؛ پھر پہلا بلا قراءت اور دوسرا قراءت سے باقی پوری کرے۔"},{"k":2,"n":133,"q":"امام مقیم ہو تو نمازِ خوف؟","a":"ہر گروہ کو دو رکعتیں؛ مغرب میں پہلے کو دو اور دوسرے کو ایک۔"},{"k":2,"n":134,"q":"نمازِ خوف میں لڑائی؟","a":"نماز باطل؛ سخت خوف میں سوار ہو کر اشارے سے، جس طرف چاہیں۔"},{"k":2,"n":135,"q":"نزع کے وقت اور وفات کے بعد کیا کریں؟","a":"دائیں کروٹ قبلہ رخ، شہادتین کی تلقین؛ وفات پر ٹھوڑی باندھنا، آنکھیں بند کرنا؛ تخت پر رکھ کر ستر ڈھانپ کر وضو (کلی ناک نہیں) پھر غسل۔"},{"k":2,"n":136,"q":"غسلِ میت کی ترتیب؟","a":"بائیں پھر دائیں کروٹ پر بیری کے پانی سے اتنا دھوئے کہ پانی تخت کی طرف پہنچ جائے۔"},{"k":2,"n":137,"q":"غسل کے بعد کیا کرے؟","a":"بٹھا کر پیٹ پر نرمی سے ہاتھ پھیرے؛ کچھ نکلے تو دھو دے، غسل نہ دہرائے۔"},{"k":2,"n":138,"q":"کفنانے سے پہلے کیا لگائیں؟","a":"کپڑے سے خشک کریں؛ سر داڑھی پر حنوط اور سجدے کے اعضاء پر کافور۔"},{"k":2,"n":139,"q":"مرد کا کفن کتنے کپڑوں میں ہے؟","a":"تین: ازار، قمیص، لفافہ؛ دو پر بھی جائز۔"},{"k":2,"n":140,"q":"لفافہ کیسے لپیٹیں؟","a":"پہلے بائیں پھر دائیں؛ کھلنے کا ڈر ہو تو باندھ دیں۔"},{"k":2,"n":141,"q":"عورت کے کفن میں کتنے کپڑے؟","a":"پانچ: ازار، قمیص، اوڑھنی، سینہ بند پٹی، لفافہ؛ تین پر بھی جائز؛ بال سینے پر، کنگھی نہیں۔"},{"k":2,"n":142,"q":"نمازِ جنازہ کا سب سے زیادہ حق دار؟","a":"سلطان، نہ ہو تو محلے کا امام، پھر ولی۔"},{"k":2,"n":143,"q":"ولی کے علاوہ نے پڑھ لی تو؟","a":"ولی دوبارہ پڑھے؛ ولی پڑھ لے تو اس کے بعد کوئی نہ پڑھے؛ دفن ہو چکا ہو تو قبر پر۔"},{"k":2,"n":144,"q":"نمازِ جنازہ میں چار تکبیریں کیا ہیں؟","a":"پہلی کے بعد حمد، دوسری کے بعد درود، تیسری کے بعد دعا، چوتھی کے بعد سلام؛ مسجدِ جماعت میں نہیں۔"},{"k":2,"n":145,"q":"جنازہ اٹھانے اور دفن کا طریقہ؟","a":"چاروں پائے پکڑ کر تیز مگر دوڑے بغیر؛ لحد قبلہ کی جانب، \"بسم اللہ وعلیٰ ملۃ رسول اللہ\"، پکی اینٹ لکڑی مکروہ، قبر کوہان نما۔"},{"k":2,"n":146,"q":"بچہ پیدا ہو کر رو پڑا تو؟","a":"نام رکھا جائے، غسل اور نماز؛ نہ روئے تو کپڑے میں لپیٹ کر نماز نہیں۔"},{"k":2,"n":147,"q":"شہید کون ہے اور اس کا حکم؟","a":"مشرکوں یا ظلماً قتل، یا معرکے میں زخمی پایا جائے؛ غسل نہیں، کفن اور نماز۔"},{"k":2,"n":148,"q":"جنبی شہید کا حکم؟","a":"امام ابو حنیفہ: غسل (بچے کو بھی)؛ صاحبین: نہیں۔"},{"k":2,"n":149,"q":"شہید کے خون اور کپڑوں کا حکم؟","a":"خون نہ دھویا جائے، کپڑے رہیں؛ پوستین، موزہ، روئی دار لباس، ہتھیار اتار لیں۔"},{"k":2,"n":150,"q":"ارتثاث کیا ہے؟","a":"کھانا پینا، علاج، ایک نماز کا وقت زندہ ہوش میں گزرنا یا زندہ معرکے سے اٹھایا جانا؛ اسے غسل دیا جاتا ہے۔"},{"k":2,"n":151,"q":"حد یا قصاص میں قتل ہونے والے کا حکم؟","a":"غسل اور نماز؛ باغی اور ڈاکو پر نماز نہیں۔"},{"k":2,"n":152,"q":"کعبہ کے اندر نماز کا حکم؟","a":"فرض اور نفل جائز؛ امام کی پیٹھ کی طرف پیٹھ جائز، امام کے چہرے کی طرف نہیں۔"},{"k":2,"n":153,"q":"کعبہ کے گرد جماعت؟","a":"حلقہ بنا کر؛ امام کی جانب میں نہ ہو تو جو امام سے قریب ہو اس کی نماز درست۔"},{"k":2,"n":154,"q":"کعبہ کی چھت پر نماز؟","a":"جائز۔"},{"k":3,"n":1,"q":"زکاۃ کن پر واجب ہے؟","a":"آزاد، مسلمان، بالغ، عاقل پر جب وہ نصاب کا مکمل مالک ہو اور سال گزر جائے؛ بچے، مجنون اور مکاتب پر نہیں۔"},{"k":3,"n":2,"q":"جس پر پورے مال کے برابر قرض ہو؟","a":"اس پر زکاۃ نہیں۔"},{"k":3,"n":3,"q":"قرض سے زائد مال ہو تو؟","a":"بچے ہوئے مال کی زکاۃ دے بشرطیکہ نصاب تک پہنچے۔"},{"k":3,"n":3,"q":"کن چیزوں میں زکاۃ نہیں؟","a":"رہائشی مکان، بدن کے کپڑے، گھر کا سامان، سواری کے جانور، خدمت کے غلام اور استعمال کے ہتھیار۔"},{"k":3,"n":4,"q":"زکاۃ کی نیت کب معتبر ہے؟","a":"ادا کرتے وقت یا واجب مقدار الگ کرتے وقت۔"},{"k":3,"n":5,"q":"سارا مال صدقہ کر دے اور زکاۃ کی نیت نہ کرے تو؟","a":"زکاۃ کا فرض ساقط ہو جاتا ہے۔"},{"k":3,"n":6,"q":"اونٹوں کا نصاب کیا ہے اور پہلا واجب؟","a":"پانچ؛ پانچ سے نو تک ایک بکری، دس میں دو، پندرہ میں تین، بیس میں چار۔"},{"k":3,"n":6,"q":"پچیس سے ایک سو بیس تک اونٹوں کا واجب؟","a":"25-35: بنتِ مخاض؛ 36-45: بنتِ لبون؛ 46-60: حقہ؛ 61-75: جذعہ؛ 76-90: دو بنتِ لبون؛ 91-120: دو حقے۔"},{"k":3,"n":7,"q":"ایک سو بیس کے بعد حساب؟","a":"فریضہ نئے سرے سے؛ 150 میں تین حقے؛ 196-200 میں چار حقے؛ پھر ہر پچاس پر نیا حساب۔"},{"k":3,"n":8,"q":"بُخْتی اور عربی اونٹ کا حکم؟","a":"برابر ہیں۔"},{"k":3,"n":9,"q":"گائے کا نصاب اور واجب؟","a":"تیس میں تبیع یا تبیعہ، چالیس میں مسنہ؛ ساٹھ تک امام ابو حنیفہ کے نزدیک زیادتی پر اسی حساب سے۔"},{"k":3,"n":10,"q":"صاحبین کا گائے میں قول؟","a":"زیادتی میں کچھ نہیں؛ ساٹھ میں دو تبیع، ستر میں مسنہ اور تبیع، اسی میں دو مسنہ۔"},{"k":3,"n":11,"q":"بھینس اور گائے؟","a":"برابر ہیں۔"},{"k":3,"n":12,"q":"بکریوں کا نصاب اور واجب؟","a":"چالیس میں ایک؛ 121 میں دو؛ 201 میں تین؛ 400 میں چار؛ پھر ہر سو میں ایک۔"},{"k":3,"n":13,"q":"بھیڑ اور بکری؟","a":"برابر ہیں۔"},{"k":3,"n":14,"q":"سائمہ گھوڑوں (نر مادہ) کی زکاۃ؟","a":"امام ابو حنیفہ: ہر گھوڑے پر ایک دینار یا قیمت لگا کر ہر دو سو درہم پر پانچ؛ اکیلے نر پر نہیں۔"},{"k":3,"n":15,"q":"صاحبین کا گھوڑوں میں قول؟","a":"زکاۃ نہیں۔"},{"k":3,"n":16,"q":"خچر اور گدھے؟","a":"زکاۃ نہیں مگر تجارت کے لیے ہوں تو۔"},{"k":3,"n":17,"q":"چھوٹے بچوں میں زکاۃ؟","a":"امام ابو حنیفہ و محمد: نہیں، جب تک بڑے جانور ساتھ نہ ہوں؛ امام ابو یوسف: ان میں سے ایک بچہ۔"},{"k":3,"n":18,"q":"مطلوبہ عمر کا جانور نہ ہو تو؟","a":"اوپر والا لے کر فرق لوٹائے، یا کم والا لے کر فرق وصول کرے۔"},{"k":3,"n":19,"q":"زکاۃ میں قیمت دینا؟","a":"جائز؛ کام کرنے اور چارہ کھانے والے جانوروں پر زکاۃ نہیں۔"},{"k":3,"n":20,"q":"مصدِّق کون سا مال لے؟","a":"درمیانہ؛ نہ سب سے اچھا نہ سب سے خراب؛ سال کے بیچ میں ہم جنس مال بڑھ جائے تو ملا لے۔"},{"k":3,"n":21,"q":"سائمہ کسے کہتے ہیں؟","a":"جو سال کا اکثر حصہ چر کر گزارا کرے؛ آدھا سال یا زیادہ چارہ کھائے تو زکاۃ نہیں۔"},{"k":3,"n":22,"q":"زکاۃ نصاب میں ہے یا عفو میں بھی؟","a":"امام ابو حنیفہ و ابو یوسف: نصاب میں؛ امام محمد: دونوں میں؛ زکاۃ واجب ہونے کے بعد مال ہلاک ہو تو ساقط؛ سال سے پہلے ادا کرنا جائز۔"},{"k":3,"n":23,"q":"چاندی کا نصاب اور واجب مقدار؟","a":"دو سو درہم میں پانچ درہم؛ پھر ہر چالیس درہم میں ایک (صاحبین: زائد کا حساب)۔"},{"k":3,"n":24,"q":"ملاوٹ والے سکّوں کا حکم؟","a":"چاندی غالب ہو تو چاندی؛ کھوٹ غالب ہو تو سامانِ تجارت، قیمت نصاب کو پہنچے۔"},{"k":3,"n":25,"q":"سونے کا نصاب اور واجب؟","a":"بیس مثقال میں آدھا مثقال؛ پھر ہر چار مثقال میں دو قیراط۔"},{"k":3,"n":26,"q":"ڈلی، زیور اور برتنوں میں زکاۃ؟","a":"ہاں، سونے چاندی کی ڈلی، زیور اور برتن سب میں۔"},{"k":3,"n":27,"q":"سامانِ تجارت کی زکاۃ کیسے؟","a":"قیمت لگائی جائے جو فقراء کے لیے زیادہ نفع بخش ہو؛ نصاب کو پہنچے تو زکاۃ۔"},{"k":3,"n":28,"q":"سال کے بیچ نصاب کم ہو جائے؟","a":"دونوں سروں پر مکمل ہو تو زکاۃ ساقط نہیں۔"},{"k":3,"n":29,"q":"سونے چاندی اور سامان کو ملانے کا طریقہ؟","a":"امام ابو حنیفہ: قیمت کے اعتبار سے؛ صاحبین: سونا چاندی کے ساتھ قیمت سے نہیں، اجزاء سے۔"},{"k":3,"n":30,"q":"امام ابو حنیفہ کے نزدیک پیداوار پر کیا واجب ہے؟","a":"تھوڑی ہو یا زیادہ عشر، سوائے ایندھن لکڑی، سرکنڈے اور گھاس کے۔"},{"k":3,"n":31,"q":"صاحبین کا قول؟","a":"صرف باقی رہنے والے پھل میں اور جب پانچ وسق کو پہنچے۔"},{"k":3,"n":32,"q":"وسق کتنا ہے اور سبزیوں کا حکم؟","a":"ساٹھ صاع؛ صاحبین کے نزدیک سبزیوں میں عشر نہیں۔"},{"k":3,"n":33,"q":"کس زمین میں نصف عشر ہے؟","a":"ڈول، رہٹ یا سانیہ سے سیراب میں۔"},{"k":3,"n":34,"q":"امام ابو یوسف کا زعفران، کپاس میں قول؟","a":"پانچ وسق کی قیمت کو پہنچے تو عشر۔"},{"k":3,"n":35,"q":"امام محمد کا قول؟","a":"اپنی نوع کی سب سے بڑی ناپ کا پانچ گنا: کپاس میں پانچ بوجھ، زعفران میں پانچ من۔"},{"k":3,"n":36,"q":"شہد میں عشر؟","a":"عشری زمین سے لیا جائے تو تھوڑا ہو زیادہ؛ ابو یوسف: دس مشکیزے، محمد: پانچ فرق۔"},{"k":3,"n":37,"q":"خراجی زمین کی پیداوار؟","a":"اس پر عشر نہیں۔"},{"k":3,"n":38,"q":"مصارفِ زکاۃ کتنے اور کون سا ساقط ہے؟","a":"آٹھ؛ مؤلفۃ القلوب ساقط ہو گئے۔"},{"k":3,"n":39,"q":"فقیر، مسکین، عامل، رقاب، غارم، فی سبیل اللہ، ابن السبیل کی تعریف؟","a":"فقیر: تھوڑا مال؛ مسکین: کچھ نہیں؛ عامل: کام کے بقدر؛ رقاب: مکاتب؛ غارم: مقروض؛ فی سبیل اللہ: کٹا ہوا غازی؛ ابن السبیل: مسافر جس کا مال وطن میں ہو۔"},{"k":3,"n":40,"q":"زکاۃ سب مصارف کو دینا ضروری ہے؟","a":"نہیں، ایک ہی قسم کو دینا بھی جائز۔"},{"k":3,"n":41,"q":"ذمی کو زکاۃ؟","a":"جائز نہیں۔"},{"k":3,"n":42,"q":"زکاۃ سے کیا نہیں ہو سکتا اور کسے نہیں دی جاتی؟","a":"مسجد کی تعمیر، میت کا کفن، غلام آزاد کرنا؛ مالدار، والدین، اولاد، بیوی کو نہیں۔"},{"k":3,"n":42,"q":"بیوی شوہر کو زکاۃ دے سکتی ہے؟","a":"امام ابو حنیفہ: نہیں؛ صاحبین: ہاں۔"},{"k":3,"n":43,"q":"مزید کن کو زکاۃ نہیں دی جا سکتی؟","a":"اپنے مکاتب اور غلام، مالدار کے غلام اور چھوٹی اولاد، اور بنو ہاشم۔"},{"k":3,"n":44,"q":"غلطی سے مالدار یا ہاشمی کو دے دی؟","a":"امام ابو حنیفہ و محمد: اعادہ نہیں۔"},{"k":3,"n":45,"q":"امام ابو یوسف کا قول؟","a":"اعادہ لازم ہے۔"},{"k":3,"n":46,"q":"معلوم ہو کہ وہ اپنا غلام یا مکاتب تھا؟","a":"سب کے نزدیک جائز نہیں۔"},{"k":3,"n":47,"q":"کس کو دینا جائز ہے؟","a":"جو نصاب سے کم کا مالک ہو، اگرچہ تندرست کمانے والا ہو۔"},{"k":3,"n":48,"q":"زکاۃ دوسرے شہر منتقل کرنا؟","a":"مکروہ؛ رشتہ دار یا زیادہ محتاجوں کے لیے جائز۔"},{"k":3,"n":49,"q":"صدقۂ فطر کن پر واجب ہے؟","a":"آزاد مسلمان پر جو ضروریات سے زائد نصاب کا مالک ہو؛ اپنی طرف سے، چھوٹی اولاد اور غلاموں کی طرف سے۔"},{"k":3,"n":50,"q":"کن کی طرف سے فطرہ نہیں؟","a":"بیوی، بڑی اولاد، مکاتب، تجارتی غلام؛ شریکوں کے غلام پر نہیں؛ کافر غلام کی طرف سے آقا دے۔"},{"k":3,"n":51,"q":"فطرہ کی مقدار؟","a":"گندم کا آدھا صاع، یا کھجور، کشمش، جو کا ایک صاع۔"},{"k":3,"n":52,"q":"صاع کتنا ہے؟","a":"ابو حنیفہ و محمد: آٹھ عراقی رطل؛ ابو یوسف: پانچ رطل اور ایک تہائی۔"},{"k":3,"n":53,"q":"فطرہ کا وجوب کب سے ہے؟","a":"عید کے دن فجر طلوع ہونے سے؛ اس سے پہلے مرنے یا بعد میں پیدا ہونے پر نہیں۔"},{"k":3,"n":54,"q":"فطرہ کب ادا کرنا مستحب ہے؟","a":"عید کے دن عیدگاہ جانے سے پہلے؛ پہلے دینا جائز، بعد میں ساقط نہیں ہوتا۔"},{"k":4,"n":1,"q":"روزہ کی کتنی قسمیں ہیں اور نیت کا حکم؟","a":"واجب اور نفل؛ معین (رمضان، معین نذر) میں رات سے نیت جائز؛ …"},{"k":4,"n":2,"q":"ذمے والے روزوں میں نیت؟","a":"قضائے رمضان، مطلق نذر اور کفارات میں رات سے نیت ضروری۔"},{"k":4,"n":3,"q":"نفل روزے کی نیت کب تک؟","a":"زوال سے پہلے تک۔"},{"k":4,"n":4,"q":"چاند کب تلاش کریں اور ابر ہو تو؟","a":"شعبان کی انتیسویں کو؛ نظر نہ آئے تو شعبان کے تیس دن پورے کر کے روزہ رکھیں۔"},{"k":4,"n":5,"q":"اکیلے رمضان کا چاند دیکھنے والا؟","a":"روزہ رکھے، چاہے امام گواہی قبول نہ کرے۔"},{"k":4,"n":6,"q":"رمضان کے چاند کی گواہی؟","a":"ابر ہو تو ایک عادل (مرد/عورت، آزاد/غلام)؛ صاف آسمان میں بڑی جماعت۔"},{"k":4,"n":7,"q":"روزے کا وقت؟","a":"صبحِ صادق سے غروب تک۔"},{"k":4,"n":8,"q":"روزہ کیا ہے؟","a":"نیت کے ساتھ دن میں کھانے، پینے اور جماع سے رکنا۔"},{"k":4,"n":9,"q":"کن باتوں سے روزہ نہیں ٹوٹتا؟","a":"بھول کر کھانا پینا یا جماع، احتلام، دیکھنے سے انزال، تیل، پچھنے، سرمہ، بوسہ؛ بوسے یا چھونے سے انزال ہو تو قضا۔"},{"k":4,"n":10,"q":"روزے میں بوسے کا حکم؟","a":"اطمینان ہو تو جائز، ورنہ مکروہ۔"},{"k":4,"n":11,"q":"قے کا حکم؟","a":"خود آئے تو نہیں ٹوٹتا؛ جان بوجھ کر منہ بھر قے سے قضا؛ کنکری یا لوہا نگلنے سے ٹوٹ جاتا ہے۔"},{"k":4,"n":12,"q":"جان بوجھ کر جماع یا کھانے پینے پر کیا لازم ہے؟","a":"قضا اور ظہار جیسا کفارہ۔"},{"k":4,"n":13,"q":"شرمگاہ کے علاوہ جگہ جماع اور انزال؟","a":"قضا، کفارہ نہیں۔"},{"k":4,"n":14,"q":"رمضان کے علاوہ روزہ فاسد کرنے پر؟","a":"کفارہ نہیں۔"},{"k":4,"n":15,"q":"حقنہ، ناک کی دوا، کان کے قطرے، زخم کی دوا؟","a":"پیٹ یا دماغ تک پہنچ جائے تو روزہ ٹوٹ جاتا ہے؛ پیشاب کی نالی میں ٹپکانے پر امام ابو حنیفہ: نہیں ٹوٹتا، ابو یوسف: ٹوٹتا ہے۔"},{"k":4,"n":16,"q":"منہ سے کچھ چکھنا؟","a":"روزہ نہیں ٹوٹتا مگر مکروہ؛ عورت کا بچے کے لیے چبانا بھی مکروہ جب ضرورت نہ ہو۔"},{"k":4,"n":17,"q":"چیونگم چبانا؟","a":"روزہ نہیں ٹوٹتا مگر مکروہ۔"},{"k":4,"n":18,"q":"بیمار اور مسافر کا روزہ؟","a":"بیماری بڑھنے کا ڈر ہو تو افطار اور قضا؛ مسافر کو ضرر نہ ہو تو روزہ افضل۔"},{"k":4,"n":19,"q":"مریض یا مسافر اسی حال میں فوت ہو جائیں؟","a":"قضا لازم نہیں؛ صحت یاب یا مقیم ہو کر فوت ہوں تو اس قدر قضا لازم۔"},{"k":4,"n":20,"q":"قضائے رمضان متفرق یا متواتر؟","a":"اختیار؛ دوسرا رمضان آ جائے تو پہلے رمضان کا روزہ رکھے، پہلے کی قضا بعد میں، فدیہ نہیں۔"},{"k":4,"n":21,"q":"حاملہ اور دودھ پلانے والی؟","a":"بچے کے ڈر سے افطار اور قضا، فدیہ نہیں۔"},{"k":4,"n":22,"q":"شیخِ فانی کا حکم؟","a":"افطار اور ہر دن ایک مسکین کو کھانا۔"},{"k":4,"n":23,"q":"میت پر قضا ہو اور وصیت کر جائے؟","a":"ولی ہر دن کی طرف سے آدھا صاع گندم یا ایک صاع کھجور یا جو کا کھانا دے۔"},{"k":4,"n":24,"q":"نفل روزہ یا نماز توڑ دے؟","a":"قضا واجب۔"},{"k":4,"n":25,"q":"بچہ بالغ یا کافر مسلمان ہو جائے رمضان میں؟","a":"بقیہ دن رکے رہیں، آگے روزے رکھیں، گزشتہ کی قضا نہیں۔"},{"k":4,"n":26,"q":"رمضان میں بے ہوشی اور جنون؟","a":"بے ہوش جس دن شروع ہوا اس کی قضا نہیں، بعد کی ہے؛ مجنون ہوش میں آئے تو گزشتہ کی قضا۔"},{"k":4,"n":27,"q":"حائضہ اور مسافر دن کے بیچ میں؟","a":"حائضہ افطار اور قضا؛ مسافر کے آنے یا حائضہ کے پاک ہونے پر باقی دن رکے رہیں۔"},{"k":4,"n":28,"q":"سحری یا افطار میں غلطی ہو جائے؟","a":"اس دن کی قضا، کفارہ نہیں۔"},{"k":4,"n":29,"q":"اکیلے عید کا چاند دیکھے؟","a":"افطار نہ کرے۔"},{"k":4,"n":30,"q":"عید کے چاند کی گواہی؟","a":"ابر ہو تو دو مرد یا ایک مرد اور دو عورتیں؛ صاف آسمان میں بڑی جماعت۔"},{"k":4,"n":31,"q":"اعتکاف کیا ہے؟","a":"روزے اور نیت کے ساتھ مسجد میں ٹھہرنا؛ مستحب۔"},{"k":4,"n":32,"q":"معتکف پر کیا حرام اور کیا جائز؟","a":"وطی، چھونا، بوسہ حرام؛ حاجت اور جمعہ کے سوا مسجد سے نہ نکلے؛ سامان لائے بغیر خرید و فروخت جائز۔"},{"k":4,"n":33,"q":"معتکف کے لیے کلام اور جماع؟","a":"صرف خیر کی بات؛ خاموشی مکروہ؛ جماع سے اعتکاف باطل۔"},{"k":4,"n":34,"q":"اعتکاف کی نذر؟","a":"راتوں سمیت اور متواتر واجب، شرط نہ بھی ہو۔"},{"k":5,"n":1,"q":"حج کی فرضیت کی شرائط؟","a":"آزاد، بالغ، عاقل، تندرست، زادِ راہ اور سواری کا مالک، اہل و عیال کے خرچ سے زائد، اور راستہ پرامن۔"},{"k":5,"n":2,"q":"عورت کے لیے حج میں خاص شرط؟","a":"محرم یا شوہر کا ساتھ؛ تین دن کے سفر میں ان کے بغیر جائز نہیں۔"},{"k":5,"n":3,"q":"بچہ بالغ یا غلام آزاد ہو جائے بعد احرام؟","a":"وہ حجۃ الاسلام سے کافی نہیں۔"},{"k":5,"n":4,"q":"پانچ میقاتیں کون سی ہیں؟","a":"مدینہ: ذوالحلیفہ؛ عراق: ذاتِ عرق؛ شام: جحفہ؛ نجد: قرنِ منازل؛ یمن: یلملم۔"},{"k":5,"n":5,"q":"میقات کے اندر رہنے والے اور مکہ والے؟","a":"میقات حِلّ ہے؛ مکہ والے کی حج میں حرم اور عمرہ میں حِلّ۔"},{"k":5,"n":6,"q":"احرام کی تیاری کیسے؟","a":"غسل (افضل) یا وضو، دو نئی یا دھلی چادریں، خوشبو، دو رکعتیں اور حج کی دعا۔"},{"k":5,"n":7,"q":"تلبیہ کب کہے؟","a":"نماز کے فوراً بعد۔"},{"k":5,"n":8,"q":"تلبیہ کے الفاظ؟","a":"لبیک اللہم لبیک، لبیک لا شریک لک لبیک، ان الحمد والنعمۃ لک والملک، لا شریک لک۔"},{"k":5,"n":9,"q":"محرم کے لیے ممنوعات؟","a":"رفث، فسوق، جدال، شکار، سلا کپڑا، عمامہ ٹوپی موزے، سر چہرہ ڈھانکنا، خوشبو، بال اور ناخن، رنگا کپڑا۔"},{"k":5,"n":10,"q":"محرم کے لیے کیا جائز ہے؟","a":"غسل، حمام، کعبہ یا محمل کا سایہ، کمر میں تھیلی باندھنا۔"},{"k":5,"n":11,"q":"تلبیہ کی کثرت کب؟","a":"نمازوں کے بعد، بلندی چڑھتے، وادی اترتے، سواروں سے ملتے اور سحر میں؛ خطمی سے سر نہ دھوئے۔"},{"k":5,"n":12,"q":"مکہ پہنچ کر کیا کرے؟","a":"مسجدِ حرام جائے، بیت اللہ دیکھ کر تکبیر و تہلیل، حجرِ اسود کا استلام، اضطباع کے ساتھ سات چکر۔"},{"k":5,"n":13,"q":"طواف کا طریقہ اور رمل؟","a":"حطیم کے پیچھے سے؛ پہلے تین چکروں میں رمل، باقی عام رفتار؛ ہر بار استلام اور آخر پر استلام۔"},{"k":5,"n":14,"q":"طواف کے بعد کیا کرے؟","a":"مقامِ ابراہیم کے پاس یا مسجد میں دو رکعتیں۔"},{"k":5,"n":15,"q":"طوافِ قدوم کا حکم؟","a":"سنت؛ اہلِ مکہ پر نہیں۔"},{"k":5,"n":16,"q":"سعی کی ابتدا کہاں سے؟","a":"صفا پر چڑھ کر قبلہ رخ تکبیر، تہلیل، درود اور دعا۔"},{"k":5,"n":17,"q":"سعی کا طریقہ؟","a":"مروہ کی طرف عام رفتار، سبز نشانوں کے بیچ دوڑ کر؛ سات چکر صفا سے شروع، مروہ پر ختم۔"},{"k":5,"n":18,"q":"یومِ ترویہ سے پہلے کیا ہوتا ہے؟","a":"مکہ میں حرام رہ کر طواف؛ ایک دن پہلے امام خطبہ دیتا ہے؛ ترویہ کی فجر کے بعد منیٰ، عرفہ کی فجر تک قیام۔"},{"k":5,"n":19,"q":"عرفات کی روانگی؟","a":"عرفہ کی فجر کے بعد عرفات جا کر ٹھہرے۔"},{"k":5,"n":20,"q":"یومِ عرفہ کی نماز اور خطبہ؟","a":"زوال کے بعد امام دو خطبے دے، ظہر عصر ظہر کے وقت ایک اذان دو اقامتوں سے؛ اکیلا اپنے وقت پر (امام ابو حنیفہ)۔"},{"k":5,"n":21,"q":"وقوف کی جگہ؟","a":"پہاڑ کے قریب؛ پورا عرفات موقف ہے سوائے بطنِ عرنہ کے۔"},{"k":5,"n":22,"q":"امام کا وقوف اور دعا؟","a":"سواری پر، دعا اور تعلیمِ مناسک؛ غسل مستحب۔"},{"k":5,"n":23,"q":"غروب کے بعد کہاں جائیں؟","a":"اطمینان سے مزدلفہ؛ مغرب عشاء ایک اذان اقامت سے؛ راستے میں مغرب جائز نہیں (امام ابو حنیفہ و محمد)۔"},{"k":5,"n":24,"q":"
