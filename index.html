ائِنَةً مَا كَانَتْ إِذَا بَلَغَتْ قِيمَتُهَا نِصَابًا مِنَ الذَّهَبِ أَوِ الْوَرِقِ يُقَوِّمُهَا بِمَا هُوَ أَنْفَعُ لِلْفُقَرَاءِ وَالْمَسَاكِينِ مِنْهُمَا",null,"تجارت کے سامان میں زکاۃ واجب ہے، جو بھی ہو، جب اس کی قیمت سونے یا چاندی کے نصاب کو پہنچ جائے؛ اس کی قیمت ان دونوں میں سے اس کے ساتھ لگائے جو فقراء اور مسکینوں کے لیے زیادہ نفع بخش ہو"],["m","وَإِذَا كَانَ النِّصَابُ كَامِلًا فِي طَرَفَيِ الْحَوْلِ فَنُقْصَانُهُ فِيمَا بَيْنَ ذَلِكَ لَا يُسْقِطُ الزَّكَاةَ",null,"اور جب سال کے دونوں سروں پر نصاب مکمل ہو تو درمیان میں اس کا کم ہو جانا زکاۃ کو ساقط نہیں کرتا"],["m","وَتُضَمُّ قِيمَةُ الْعُرُوضِ إِلَى الذَّهَبِ وَالْفِضَّةِ وَكَذَلِكَ يُضَمُّ الذَّهَبُ إِلَى الْفِضَّةِ بِالْقِيمَةِ حَتَّى يَتِمَّ النِّصَابُ عِنْدَ أَبِي حَنِيفَةَ وَقَالَ أَبُو يُوسُفَ وَمُحَمَّدٌ: لَا يُضَمُّ الذَّهَبُ إِلَى الْفِضَّةِ بِالْقِيمَةِ وَيُضَمُّ بِالْأَجْزَاءِ",null,"اور سامان کی قیمت سونے اور چاندی کے ساتھ ملائی جائے گی؛ اور اسی طرح امام ابو حنیفہ کے نزدیک سونا چاندی کے ساتھ قیمت کے اعتبار سے ملایا جائے گا تاکہ نصاب پورا ہو؛ اور امام ابو یوسف اور امام محمد نے فرمایا: سونا چاندی کے ساتھ قیمت کے اعتبار سے نہیں ملایا جائے گا بلکہ اجزاء کے اعتبار سے"]]},{"t":"بَابُ زَكَاةِ الزُّرُوعِ وَالثِّمَارِ","tu":"کھیتی اور پھلوں کی زکاۃ کا باب","ed":false,"items":[["m","قَالَ أَبُو حَنِيفَةَ رَحِمَهُ اللهُ تَعَالَى: فِي قَلِيلِ مَا أَخْرَجَتْهُ الْأَرْضُ وَكَثِيرِهِ الْعُشْرُ سَوَاءٌ سُقِيَ سَيْحًا أَوْ سَقَتْهُ السَّمَاءُ إِلَّا الْحَطَبَ وَالْقَصَبَ وَالْحَشِيشَ",null,"امام ابو حنیفہ رحمہ اللہ تعالیٰ نے فرمایا: زمین جو کچھ بھی پیدا کرے تھوڑا ہو یا زیادہ، اس میں عشر ہے، خواہ نہر سے سیراب ہو یا بارش سے، سوائے ایندھن کی لکڑی، سرکنڈے اور گھاس کے"],["m","وَقَالَ أَبُو يُوسُفَ وَمُحَمَّدٌ: لَا يَجِبُ الْعُشْرُ إِلَّا فِيمَا لَهُ ثَمَرَةٌ بَاقِيَةٌ إِذَا بَلَغَ خَمْسَةَ أَوْسُقٍ",null,"اور امام ابو یوسف اور امام محمد نے فرمایا: عشر صرف اس چیز میں واجب ہے جس کا پھل باقی رہنے والا ہو، جب وہ پانچ وسق کو پہنچے"],["m","وَالْوَسْقُ: سِتُّونَ صَاعًا بِصَاعِ النَّبِيِّ ﷺ وَلَيْسَ فِي الْخَضْرَوَاتِ عِنْدَهُمَا عُشْرٌ",null,"اور وسق ساٹھ صاع کا ہے، نبی ﷺ کے صاع کے حساب سے؛ اور ان دونوں کے نزدیک سبزیوں میں عشر نہیں"],["m","وَمَا سُقِيَ بِغَرْبٍ أَوْ دَالِيَةٍ أَوْ سَانِيَةٍ فَفِيهِ نِصْفُ الْعُشْرِ فِي الْقَوْلَيْنِ",null,"اور جو کھیتی ڈول، رہٹ یا سانیہ (اونٹ سے پانی کھینچنے) سے سیراب ہو اس میں دونوں اقوال کے مطابق نصف عشر ہے"],["m","وَقَالَ أَبُو يُوسُفَ فِيمَا لَا يُوسَقُ كَالزَّعْفَرَانِ وَالْقُطْنِ يَجِبُ فِيهِ الْعُشْرُ إِذَا بَلَغَتْ قِيمَتُهُ خَمْسَةَ أَوْسُقٍ مِنْ أَدْنَى مَا يَدْخُلُ تَحْتَ الْوَسْقِ",null,"اور امام ابو یوسف نے فرمایا: جو چیز وسق سے ناپی نہیں جاتی، جیسے زعفران اور کپاس، اس میں عشر واجب ہے جب اس کی قیمت پانچ وسق کے برابر ہو، ان اشیاء میں سے ادنیٰ شے کے جو وسق کے تحت آتی ہے"],["m","وَقَالَ مُحَمَّدٌ: يَجِبُ الْعُشْرُ إِذَا بَلَغَ الْخَارِجُ خَمْسَةَ أَمْثَالٍ مِنْ أَعْلَى مَا يُقَدَّرُ بِهِ نَوْعُهُ فَاعْتَبَرَ فِي الْقُطْنِ خَمْسَةَ أَحْمَالٍ وَفِي الزَّعْفَرَانِ خَمْسَةَ أَمْنَاءٍ",null,"اور امام محمد نے فرمایا: عشر اس وقت واجب ہے جب پیداوار اس نوع کی اس سب سے بڑی مقدار کے پانچ گنا کو پہنچے جس سے وہ ناپی جاتی ہو؛ پس انہوں نے کپاس میں پانچ بوجھ اور زعفران میں پانچ من کا اعتبار کیا"],["m","وَفِي الْعَسَلِ الْعُشْرُ إِذَا أُخِذَ مِنْ أَرْضِ الْعُشْرِ قَلَّ أَوْ أَكْثَرَ وَقَالَ أَبُو يُوسُفَ: لَا شَيْءَ فِيهِ حَتَّى يَبْلُغَ عَشَرَةَ أَزْقَاقٍ وَقَالَ مُحَمَّدٌ: خَمْسَةَ أَفْرَاقٍ",null,"اور شہد میں عشر ہے جب وہ عشری زمین سے لیا جائے، تھوڑا ہو یا زیادہ؛ اور امام ابو یوسف نے فرمایا: اس میں کچھ نہیں جب تک دس مشکیزے نہ ہو جائیں؛ اور امام محمد نے فرمایا: پانچ فرق"],["m","وَلَيْسَ فِي الْخَارِجِ مِنْ أَرْضِ الْخَرَاجِ عُشْرٌ",null,"اور خراجی زمین کی پیداوار میں عشر نہیں"]]},{"t":"بَابُ مَنْ يَجُوزُ دَفْعُ الصَّدَقَةِ إِلَيْهِ وَمَنْ لَا يَجُوزُ","tu":"اس باب کا بیان کہ صدقہ کسے دینا جائز ہے اور کسے نہیں","ed":false,"items":[["f","مَصَارِفُ الزَّكَاةِ",null,"زکاۃ کے مصارف"],["q","قَالَ اللهُ تَعَالَى: ﴿إِنَّمَا الصَّدَقَاتُ لِلْفُقَرَاءِ وَالْمَسَاكِينِ﴾ الْآيَةَ",null,"اللہ تعالیٰ نے فرمایا: ﴿صدقات تو بس فقیروں اور مسکینوں کے لیے ہیں﴾ آیت (کے آخر تک)"],["m","فَهَذِهِ ثَمَانِيَةُ أَصْنَافٍ قَدْ سَقَطَتْ مِنْهَا الْمُؤَلَّفَةُ قُلُوبُهُمْ لِأَنَّ اللهَ تَعَالَى أَعَزَّ الْإِسْلَامَ وَأَغْنَى عَنْهُمْ",null,"یہ آٹھ اقسام ہیں، ان میں سے مؤلفۃ القلوب ساقط ہو گئے کیونکہ اللہ تعالیٰ نے اسلام کو عزت دی اور انہیں اس سے بے نیاز کر دیا"],["m","وَالْفَقِيرُ: مَنْ لَهُ أَدْنَى شَيْءٍ وَالْمِسْكِينُ: مَنْ لَا شَيْءَ لَهُ وَالْعَامِلُ: يَدْفَعُ إِلَيْهِ الْإِمَامُ بِقَدْرِ عَمَلِهِ إِنْ عَمِلَ وَفِي الرِّقَابِ: يُعَانُ الْمُكَاتَبُونَ فِي فَكِّ رِقَابِهِمْ وَالْغَارِمُ: مَنْ لَزِمَهُ دَيْنٌ وَفِي سَبِيلِ اللهِ: مُنْقَطِعُ الْغُزَاةِ وَابْنُ السَّبِيلِ: مَنْ كَانَ لَهُ مَالٌ فِي وَطَنِهِ وَهُوَ فِي مَكَانٍ لَا شَيْءَ لَهُ فِيهِ فَهَذِهِ جِهَاتُ الزَّكَاةِ",null,"فقیر وہ ہے جس کے پاس کچھ تھوڑا ہو؛ مسکین وہ ہے جس کے پاس کچھ نہ ہو؛ عامل (زکاۃ وصول کرنے والا) کو امام اس کے کام کے بقدر دیتا ہے اگر اس نے کام کیا ہو؛ \"فی الرقاب\" میں مکاتبوں کی ان کی گردنیں چھڑانے میں مدد کی جاتی ہے؛ غارم وہ ہے جس پر قرض لازم ہو؛ \"فی سبیل اللہ\" میں وہ غازی (مجاہد) جو (سامان سے) کٹ گیا ہو؛ اور ابن السبیل وہ ہے جس کا مال اس کے وطن میں ہو اور وہ ایسی جگہ ہو جہاں اس کے پاس کچھ نہ ہو؛ یہ زکاۃ کے مصارف ہیں"],["m","وَلِلْمَالِكِ أَنْ يَدْفَعَ إِلَى كُلِّ وَاحِدٍ مِنْهُمْ وَلَهُ أَنْ يَقْتَصِرَ عَلَى صِنْفٍ وَاحِدٍ",null,"اور مالک کو اختیار ہے کہ ان میں سے ہر ایک کو دے، اور یہ بھی اختیار ہے کہ ایک ہی قسم پر اکتفا کرے"],["f","مَنْ لَا يَجُوزُ الدَّفْعُ إِلَيْهِ",null,"جن کو دینا جائز نہیں"],["m","وَلَا يَجُوزُ أَنْ يَدْفَعَ الزَّكَاةَ إِلَى ذِمِّيٍّ",null,"اور ذمی کو زکاۃ دینا جائز نہیں"],["m","وَلَا يُبْنَى بِهَا مَسْجِدٌ وَلَا يُكَفَّنُ بِهَا مَيِّتٌ وَلَا يُشْتَرَى بِهَا رَقَبَةٌ تُعْتَقُ وَلَا تُدْفَعُ إِلَى غَنِيٍّ وَلَا يَدْفَعُ الْمُزَكِّي زَكَاتَهُ إِلَى أَبِيهِ وَجَدِّهِ وَإِنْ عَلَا وَلَا إِلَى وَلَدِهِ وَوَلَدِ وَلَدِهِ وَإِنْ سَفَلَ وَلَا إِلَى امْرَأَتِهِ وَلَا تَدْفَعُ الْمَرْأَةُ إِلَى زَوْجِهَا عِنْدَ أَبِي حَنِيفَةَ وَقَالَ أَبُو يُوسُفَ وَمُحَمَّدٌ: تَدْفَعُ إِلَيْهِ",null,"اور اس سے نہ مسجد بنائی جائے، نہ کسی میت کو کفن دیا جائے، نہ ایسا غلام خرید کر آزاد کیا جائے؛ اور نہ مالدار کو دی جائے؛ اور زکاۃ دینے والا اپنی زکاۃ اپنے والد اور دادا کو، خواہ اوپر تک ہوں، نہ دے؛ نہ اپنی اولاد اور پوتے کو، خواہ نیچے تک ہوں؛ نہ اپنی بیوی کو؛ اور امام ابو حنیفہ کے نزدیک عورت اپنے شوہر کو نہ دے؛ اور امام ابو یوسف اور امام محمد نے فرمایا: اسے دے سکتی ہے"],["m","وَلَا يُدْفَعُ إِلَى مُكَاتَبِهِ وَلَا مَمْلُوكِهِ وَلَا مَمْلُوكِ غَنِيٍّ وَلَا وَلَدِ غَنِيٍّ إِذَا كَانَ صَغِيرًا وَلَا تُدْفَعُ إِلَى بَنِي هَاشِمٍ وَهُمْ: آلُ عَلِيٍّ وَآلُ عَبَّاسٍ وَآلُ جَعْفَرٍ وَآلُ عَقِيلٍ وَآلُ حَارِثِ بْنِ عَبْدِ الْمُطَّلِبِ وَمَوَالِيهِمْ",null,"اور نہ اپنے مکاتب کو دی جائے، نہ اپنے غلام کو، نہ مالدار کے غلام کو، نہ مالدار کی اولاد کو جب وہ چھوٹی ہو؛ اور بنو ہاشم کو نہ دی جائے، اور وہ یہ ہیں: آلِ علی، آلِ عباس، آلِ جعفر، آلِ عقیل، آلِ حارث بن عبدالمطلب اور ان کے موالی"],["m","وَقَالَ أَبُو حَنِيفَةَ وَمُحَمَّدٌ: إِذَا دَفَعَ الزَّكَاةَ إِلَى رَجُلٍ يَظُنُّهُ فَقِيرًا ثُمَّ بَانَ أَنَّهُ غَنِيٌّ أَوْ هَاشِمِيٌّ أَوْ كَافِرٌ أَوْ دَفَعَ فِي ظُلْمَةٍ إِلَى فَقِيرٍ ثُمَّ بَانَ أَنَّهُ أَبُوهُ أَوِ ابْنُهُ فَلَا إِعَادَةَ عَلَيْهِ",null,"اور امام ابو حنیفہ اور امام محمد نے فرمایا: اگر کسی نے زکاۃ ایسے آدمی کو دی جسے وہ فقیر سمجھتا تھا پھر معلوم ہوا کہ وہ مالدار ہے یا ہاشمی ہے یا کافر ہے، یا اندھیرے میں کسی فقیر کو دی پھر معلوم ہوا کہ وہ اس کا باپ یا بیٹا ہے، تو اس پر اعادہ نہیں"],["m","وَقَالَ أَبُو يُوسُفَ: عَلَيْهِ الْإِعَادَةُ",null,"اور امام ابو یوسف نے فرمایا: اس پر اعادہ ہے"],["m","وَلَوْ دَفَعَ إِلَى شَخْصٍ ثُمَّ عَلِمَ أَنَّهُ عَبْدُهُ أَوْ مُكَاتَبُهُ لَمْ يَجُزْ فِي قَوْلِهِمْ جَمِيعًا",null,"اور اگر کسی شخص کو دی پھر معلوم ہوا کہ وہ اس کا غلام یا مکاتب ہے تو سب کے قول میں جائز نہیں"],["m","وَلَا يَجُوزُ دَفْعُ الزَّكَاةِ إِلَى مَنْ يَمْلِكُ نِصَابًا مِنْ أَيِّ مَالٍ كَانَ وَيَجُوزُ دَفْعُهَا إِلَى مَنْ يَمْلِكُ أَقَلَّ مِنْ ذَلِكَ وَإِنْ كَانَ صَحِيحًا مُكْتَسِبًا",null,"اور اس شخص کو زکاۃ دینا جائز نہیں جو کسی بھی مال میں سے نصاب کا مالک ہو؛ اور جو اس سے کم کا مالک ہو اسے دینا جائز ہے، اگرچہ وہ تندرست اور کمانے والا ہو"],["m","وَيُكْرَهُ نَقْلُ الزَّكَاةِ مِنْ بَلَدٍ إِلَى بَلَدٍ آخَرَ وَإِنَّمَا تُفَرَّقُ صَدَقَةُ كُلِّ قَوْمٍ فِيهِمْ إِلَّا أَنْ يَنْقُلَهَا الْإِنْسَانُ إِلَى قَرَابَتِهِ أَوْ إِلَى قَوْمٍ هُمْ أَحْوَجُ مِنْ أَهْلِ بَلَدِهِ",null,"اور زکاۃ کا ایک شہر سے دوسرے شہر منتقل کرنا مکروہ ہے؛ ہر قوم کا صدقہ انہی میں تقسیم کیا جائے، مگر یہ کہ آدمی اسے اپنے رشتہ داروں کی طرف یا ایسی قوم کی طرف منتقل کرے جو اس کے شہر والوں سے زیادہ محتاج ہو"]]},{"t":"بَابُ صَدَقَةِ الْفِطْرِ","tu":"صدقۂ فطر کا باب","ed":false,"items":[["m","صَدَقَةُ الْفِطْرِ وَاجِبَةٌ عَلَى الْحُرِّ الْمُسْلِمِ إِذَا كَانَ مَالِكًا لِمِقْدَارِ النِّصَابِ فَاضِلًا عَنْ مَسْكَنِهِ وَثِيَابِهِ وَأَثَاثِهِ وَفَرَسِهِ وَسِلَاحِهِ وَعَبِيدِهِ لِلْخِدْمَةِ يُخْرِجُ ذَلِكَ عَنْ نَفْسِهِ وَعَنْ أَوْلَادِهِ الصِّغَارِ وَعَنْ مَمَالِيكِهِ وَلَا يُؤَدِّي عَنْ زَوْجَتِهِ وَلَا عَنْ أَوْلَادِهِ الْكِبَارِ وَإِنْ كَانُوا فِي عِيَالِهِ",null,"صدقۂ فطر آزاد مسلمان پر واجب ہے جب وہ اپنے مکان، کپڑوں، گھر کے سامان، گھوڑے، ہتھیار اور خدمت کے غلاموں سے زائد نصاب کی مقدار کا مالک ہو؛ وہ یہ اپنی طرف سے، اپنی چھوٹی اولاد کی طرف سے اور اپنے غلاموں کی طرف سے نکالے؛ اور اپنی بیوی کی طرف سے اور اپنی بڑی اولاد کی طرف سے ادا نہ کرے اگرچہ وہ اس کی کفالت میں ہوں"],["m","وَلَا يُخْرِجُ عَنْ مُكَاتَبِهِ وَلَا عَنْ مَمَالِيكِهِ لِلتِّجَارَةِ وَالْعَبْدُ بَيْنَ شَرِيكَيْنِ لَا فِطْرَةَ عَلَى وَاحِدٍ مِنْهُمَا وَيُؤَدِّي الْمَوْلَى الْمُسْلِمُ الْفِطْرَةَ عَنْ عَبْدِهِ الْكَافِرِ",null,"اور اپنے مکاتب کی طرف سے اور تجارت کے غلاموں کی طرف سے نہ نکالے؛ اور جو غلام دو شریکوں کے درمیان ہو تو ان میں سے کسی پر فطرہ نہیں؛ اور مسلمان آقا اپنے کافر غلام کی طرف سے فطرہ ادا کرے"],["l","وَالْفِطْرَةُ:",null,"اور فطرہ:"],["m","نِصْفُ صَاعٍ مِنْ بُرٍّ أَوْ صَاعٌ مِنْ تَمْرٍ أَوْ زَبِيبٍ أَوْ شَعِيرٍ",null,"گندم کا آدھا صاع، یا کھجور، یا کشمش، یا جو کا ایک صاع ہے"],["m","وَالصَّاعُ عِنْدَ أَبِي حَنِيفَةَ وَمُحَمَّدٍ ثَمَانِيَةُ أَرْطَالٍ بِالْعِرَاقِيِّ وَقَالَ أَبُو يُوسُفَ: خَمْسَةُ أَرْطَالٍ وَثُلُثُ رِطْلٍ",null,"اور صاع امام ابو حنیفہ اور امام محمد کے نزدیک عراقی رطل کے حساب سے آٹھ رطل ہے؛ اور امام ابو یوسف نے فرمایا: پانچ رطل اور ایک تہائی رطل"],["m","وَوُجُوبُ الْفِطْرَةِ يَتَعَلَّقُ بِطُلُوعِ الْفَجْرِ مِنْ يَوْمِ الْفِطْرِ فَمَنْ مَاتَ قَبْلَ ذَلِكَ لَمْ تَجِبْ فِطْرَتُهُ وَمَنْ أَسْلَمَ أَوْ وُلِدَ بَعْدَ طُلُوعِ الْفَجْرِ لَمْ تَجِبْ فِطْرَتُهُ",null,"اور فطرہ کا وجوب عیدالفطر کے دن فجر طلوع ہونے سے متعلق ہے؛ پس جو اس سے پہلے فوت ہو جائے اس کا فطرہ واجب نہیں؛ اور جو فجر طلوع ہونے کے بعد مسلمان ہو یا پیدا ہو اس کا فطرہ واجب نہیں"],["m","وَيُسْتَحَبُّ لِلنَّاسِ أَنْ يُخْرِجُوا الْفِطْرَةَ يَوْمَ الْفِطْرِ قَبْلَ الْخُرُوجِ إِلَى الْمُصَلَّى فَإِنْ قَدَّمُوهَا قَبْلَ يَوْمِ الْفِطْرِ جَازَ وَإِنْ أَخَّرُوهَا عَنْ يَوْمِ الْفِطْرِ لَمْ تَسْقُطْ وَكَانَ عَلَيْهِمْ إِخْرَاجُهَا",null,"اور لوگوں کے لیے مستحب ہے کہ فطرہ عید کے دن عیدگاہ جانے سے پہلے نکال دیں؛ پس اگر عید سے پہلے ادا کر دیں تو جائز ہے؛ اور اگر عید کے دن سے مؤخر کر دیں تو ساقط نہیں ہوتا اور ان پر اس کا ادا کرنا لازم ہے"]]}]},{"n":4,"title":"كِتَابُ الصَّوْمِ","tu":"کتاب الصوم","babs":[{"t":"أَحْكَامُ الصَّوْمِ","tu":"روزے کے احکام","ed":true,"items":[["f","أَنْوَاعُ الصَّوْمِ وَنِيَّتُهُ",null,"روزے کی اقسام اور نیت"],["l","الصَّوْمُ ضَرْبَانِ: وَاجِبٌ وَنَفْلٌ",null,"روزہ دو قسم کا ہے: واجب اور نفل"],["m","فَالْوَاجِبُ ضَرْبَانِ: مِنْهُ مَا يَتَعَلَّقُ بِزَمَانٍ بِعَيْنِهِ كَصَوْمِ رَمَضَانَ وَالنَّذْرِ الْمُعَيَّنِ فَيَجُوزُ صَوْمُهُ بِنِيَّةٍ مِنَ اللَّيْلِ فَإِنْ لَمْ يَنْوِ حَتَّى أَصْبَحَ …",null,"واجب کی دو قسمیں ہیں: ایک وہ جو کسی معین زمانے سے متعلق ہو جیسے رمضان کا روزہ اور معین نذر؛ اس کا روزہ رات سے کی ہوئی نیت کے ساتھ بھی جائز ہے، پھر اگر صبح ہونے تک نیت نہ کی …"],["m","وَالضَّرْبُ الثَّانِي: مَا يَثْبُتُ فِي الذِّمَّةِ كَقَضَاءِ رَمَضَانَ وَالنَّذْرِ الْمُطْلَقِ وَالْكَفَّارَاتِ فَلَا يَجُوزُ إِلَّا بِنِيَّةٍ مِنَ اللَّيْلِ",null,"اور دوسری قسم: وہ جو ذمے میں ثابت ہوتا ہے جیسے رمضان کی قضا، مطلق نذر اور کفارات؛ پس وہ رات سے کی ہوئی نیت کے بغیر جائز نہیں"],["m","وَالنَّفْلُ كُلُّهُ يَجُوزُ بِنِيَّةٍ قَبْلَ الزَّوَالِ",null,"اور تمام نفل روزے زوال سے پہلے کی نیت کے ساتھ جائز ہیں"],["f","رُؤْيَةُ الْهِلَالِ",null,"چاند دیکھنا"],["m","وَيَنْبَغِي لِلنَّاسِ أَنْ يَلْتَمِسُوا الْهِلَالَ فِي الْيَوْمِ التَّاسِعِ وَالْعِشْرِينَ مِنْ شَعْبَانَ فَإِنْ رَأَوْهُ صَامُوا وَإِنْ غُمَّ عَلَيْهِمْ أَكْمَلُوا عِدَّةَ شَعْبَانَ ثَلَاثِينَ يَوْمًا ثُمَّ صَامُوا",null,"اور لوگوں کو چاہیے کہ شعبان کی انتیسویں تاریخ کو چاند تلاش کریں؛ پس اگر دیکھ لیں تو روزہ رکھیں، اور اگر ان پر مطلع ابر آلود ہو جائے تو شعبان کے تیس دن پورے کریں پھر روزہ رکھیں"],["m","وَمَنْ رَأَى هِلَالَ رَمَضَانَ وَحْدَهُ صَامَ وَإِنْ لَمْ يَقْبَلِ الْإِمَامُ شَهَادَتَهُ",null,"اور جس نے اکیلے رمضان کا چاند دیکھا وہ روزہ رکھے اگرچہ امام اس کی گواہی قبول نہ کرے"],["m","وَإِذَا كَانَ بِالسَّمَاءِ عِلَّةٌ قَبِلَ الْإِمَامُ شَهَادَةَ الْوَاحِدِ الْعَدْلِ فِي رُؤْيَةِ الْهِلَالِ رَجُلًا أَوِ امْرَأَةً حُرًّا كَانَ أَوْ عَبْدًا فَإِنْ لَمْ يَكُنْ بِالسَّمَاءِ عِلَّةٌ لَمْ تُقْبَلْ شَهَادَتُهُ حَتَّى يَرَاهُ جَمْعٌ كَثِيرٌ يَقَعُ الْعِلْمُ بِخَبَرِهِمْ",null,"اور جب آسمان میں کوئی رکاوٹ (ابر وغیرہ) ہو تو امام چاند دیکھنے میں ایک عادل کی گواہی قبول کرے، مرد ہو یا عورت، آزاد ہو یا غلام؛ اور اگر آسمان میں کوئی رکاوٹ نہ ہو تو اس کی گواہی قبول نہ کی جائے جب تک ایک بڑی جماعت اسے نہ دیکھے جن کی خبر سے علم حاصل ہو جائے"],["f","حَقِيقَةُ الصَّوْمِ وَمَا يُفْسِدُهُ وَمَا لَا يُفْسِدُهُ",null,"روزے کی حقیقت اور جو اسے فاسد کرتا ہے اور جو نہیں کرتا"],["m","وَوَقْتُ الصَّوْمِ مِنْ طُلُوعِ الْفَجْرِ الثَّانِي إِلَى غُرُوبِ الشَّمْسِ",null,"اور روزے کا وقت صبحِ صادق کے طلوع سے سورج کے غروب تک ہے"],["m","وَالصَّوْمُ هُوَ: الْإِمْسَاكُ عَنِ الْأَكْلِ وَالشُّرْبِ وَالْجِمَاعِ نَهَارًا مَعَ النِّيَّةِ",null,"اور روزہ نیت کے ساتھ دن میں کھانے، پینے اور جماع سے رکے رہنے کا نام ہے"],["m","فَإِنْ أَكَلَ الصَّائِمُ أَوْ شَرِبَ أَوْ جَامَعَ نَاسِيًا لَمْ يُفْطِرْ وَإِنْ نَامَ فَاحْتَلَمَ أَوْ نَظَرَ إِلَى امْرَأَةٍ فَأَنْزَلَ أَوِ ادَّهَنَ أَوِ احْتَجَمَ أَوِ اكْتَحَلَ أَوْ قَبَّلَ لَمْ يُفْطِرْهُ فَإِنْ أَنْزَلَ بِقُبْلَةٍ أَوْ لَمْسٍ فَعَلَيْهِ الْقَضَاءُ",null,"پس اگر روزہ دار نے بھول کر کھایا یا پیا یا جماع کیا تو اس کا روزہ نہیں ٹوٹتا؛ اور اگر سو گیا اور احتلام ہو گیا، یا کسی عورت کو دیکھا اور انزال ہو گیا، یا تیل لگایا، یا پچھنے لگوائے، یا سرمہ لگایا، یا بوسہ لیا تو یہ چیزیں اس کا روزہ نہیں توڑتیں؛ اور اگر بوسے یا چھونے سے انزال ہو گیا تو اس پر قضا ہے"],["m","وَلَا بَأْسَ بِالْقُبْلَةِ إِذَا أَمِنَ عَلَى نَفْسِهِ وَيُكْرَهُ إِنْ لَمْ يَأْمَنْ",null,"اور بوسے میں کوئی حرج نہیں جب اسے اپنے اوپر اطمینان ہو، اور اگر اطمینان نہ ہو تو مکروہ ہے"],["m","وَإِنْ ذَرَعَهُ الْقَيْءُ لَمْ يُفْطِرْ وَإِنِ اسْتَقَاءَ عَامِدًا مِلْءَ فِيهِ فَعَلَيْهِ الْقَضَاءُ وَمَنِ ابْتَلَعَ الْحَصَاةَ أَوِ الْحَدِيدَ أَفْطَرَ",null,"اور اگر قے خود بخود آ گئی تو روزہ نہیں ٹوٹتا؛ اور اگر جان بوجھ کر منہ بھر قے کی تو اس پر قضا ہے؛ اور جس نے کنکری یا لوہا نگل لیا اس کا روزہ ٹوٹ گیا"],["f","الْقَضَاءُ وَالْكَفَّارَةُ",null,"قضا اور کفارہ"],["m","وَمَنْ جَامَعَ عَامِدًا فِي أَحَدِ السَّبِيلَيْنِ أَوْ أَكَلَ أَوْ شَرِبَ مَا يُتَغَذَّى بِهِ أَوْ يُتَدَاوَى بِهِ فَعَلَيْهِ الْقَضَاءُ وَالْكَفَّارَةُ مِثْلُ كَفَّارَةِ الظِّهَارِ",null,"اور جس نے جان بوجھ کر دونوں راستوں میں سے کسی میں جماع کیا، یا ایسی چیز کھائی یا پی جس سے غذا حاصل کی جاتی ہو یا دوا کی جاتی ہو، تو اس پر قضا اور ظہار کے کفارے جیسا کفارہ ہے"],["m","وَمَنْ جَامَعَ فِيمَا دُونَ الْفَرْجِ فَأَنْزَلَ فَعَلَيْهِ الْقَضَاءُ وَلَا كَفَّارَةَ عَلَيْهِ",null,"اور جس نے شرمگاہ کے سوا (کسی اور جگہ) جماع کیا پھر انزال ہو گیا تو اس پر قضا ہے اور کفارہ نہیں"],["m","وَلَيْسَ فِي إِفْسَادِ الصَّوْمِ فِي غَيْرِ رَمَضَانَ كَفَّارَةٌ",null,"اور رمضان کے علاوہ روزہ فاسد کرنے میں کفارہ نہیں"],["m","وَمَنِ احْتَقَنَ أَوِ اسْتَعَطَ أَوْ قَطَّرَ فِي أُذُنَيْهِ أَوْ دَاوَى جَائِفَةً أَوْ آمَّةً بِدَوَاءٍ فَوَصَلَ إِلَى جَوْفِهِ أَوْ دِمَاغِهِ أَفْطَرَ وَإِنْ قَطَّرَ فِي إِحْلِيلِهِ لَمْ يُفْطِرْ عِنْدَ أَبِي حَنِيفَةَ وَقَالَ أَبُو يُوسُفَ: يُفْطِرُ",null,"اور جس نے حقنہ لیا، یا ناک میں دوا چڑھائی، یا اپنے دونوں کانوں میں دوا ٹپکائی، یا پیٹ یا دماغ کے زخم کا دوا سے علاج کیا اور وہ دوا اس کے پیٹ یا دماغ تک پہنچ گئی تو اس کا روزہ ٹوٹ گیا؛ اور اگر اپنی پیشاب کی نالی میں ٹپکایا تو امام ابو حنیفہ کے نزدیک روزہ نہیں ٹوٹتا، اور امام ابو یوسف نے فرمایا: ٹوٹ جاتا ہے"],["m","وَمَنْ ذَاقَ شَيْئًا بِفَمِهِ لَمْ يُفْطِرْ وَيُكْرَهُ لَهُ ذَلِكَ وَيُكْرَهُ لِلْمَرْأَةِ أَنْ تَمْضُغَ لِصَبِيِّهَا الطَّعَامَ إِذَا كَانَ لَهَا مِنْهُ بُدٌّ",null,"اور جس نے اپنے منہ سے کوئی چیز چکھی اس کا روزہ نہیں ٹوٹا مگر یہ اس کے لیے مکروہ ہے؛ اور عورت کے لیے مکروہ ہے کہ اپنے بچے کے لیے کھانا چبائے جب اس کے لیے اس کے بغیر چارہ ہو"],["m","وَمَضْغُ الْعِلْكِ لَا يُفْطِرُ الصَّائِمَ وَيُكْرَهُ",null,"اور چیونگم (علک) چبانا روزہ دار کا روزہ نہیں توڑتا مگر مکروہ ہے"],["f","أَعْذَارُ الْإِفْطَارِ وَالْقَضَاءِ وَالْفِدْيَةِ",null,"افطار کے اعذار، قضا اور فدیہ"],["m","وَمَنْ كَانَ مَرِيضًا فِي رَمَضَانَ فَخَافَ إِنْ صَامَ زَادَ مَرَضُهُ أَفْطَرَ وَقَضَى وَإِنْ كَانَ مُسَافِرًا لَا يَسْتَضِرُّ بِالصَّوْمِ فَصَوْمُهُ أَفْضَلُ وَإِنْ أَفْطَرَ وَقَضَى جَازَ",null,"اور جو رمضان میں بیمار ہو اور ڈرے کہ روزہ رکھنے سے اس کی بیماری بڑھ جائے گی تو روزہ چھوڑ دے اور قضا کرے؛ اور اگر مسافر ہو اور روزے سے اسے ضرر نہ ہو تو اس کا روزہ رکھنا افضل ہے، اور اگر افطار کرے اور قضا کرے تو جائز ہے"],["m","وَإِنْ مَاتَ الْمَرِيضُ أَوِ الْمُسَافِرُ وَهُمَا عَلَى حَالِهِمَا لَمْ يَلْزَمْهُمَا الْقَضَاءُ وَإِنْ صَحَّ الْمَرِيضُ أَوْ أَقَامَ الْمُسَافِرُ ثُمَّ مَاتَا لَزِمَهُمَا الْقَضَاءُ بِقَدْرِ الصِّحَّةِ وَالْإِقَامَةِ",null,"اور اگر بیمار یا مسافر اسی حال میں مر جائیں تو ان پر قضا لازم نہیں؛ اور اگر بیمار تندرست ہو جائے یا مسافر مقیم ہو جائے پھر مر جائیں تو صحت اور اقامت کی مقدار قضا ان پر لازم ہے"],["m","وَقَضَاءُ رَمَضَانَ إِنْ شَاءَ فَرَّقَهُ وَإِنْ شَاءَ تَابَعَهُ فَإِنْ أَخَّرَهُ حَتَّى دَخَلَ رَمَضَانُ آخَرُ صَامَ رَمَضَانَ الثَّانِيَ وَقَضَى الْأَوَّلَ بَعْدَهُ وَلَا فِدْيَةَ عَلَيْهِ",null,"اور رمضان کی قضا میں اسے اختیار ہے: چاہے تو متفرق رکھے اور چاہے تو متواتر؛ پس اگر اسے مؤخر کر دے یہاں تک کہ دوسرا رمضان آ جائے تو دوسرے رمضان کے روزے رکھے اور پہلے کی قضا اس کے بعد کرے، اور اس پر فدیہ نہیں"],["m","وَالْحَامِلُ وَالْمُرْضِعُ إِذَا خَافَتَا عَلَى وَلَدَيْهِمَا أَفْطَرَتَا وَقَضَتَا وَلَا فِدْيَةَ عَلَيْهِمَا",null,"اور حاملہ اور دودھ پلانے والی جب اپنے بچوں پر ڈریں تو روزہ چھوڑ دیں اور قضا کریں، ان پر فدیہ نہیں"],["m","وَالشَّيْخُ الْفَانِي الَّذِي لَا يَقْدِرُ عَلَى الصِّيَامِ يُفْطِرُ وَيُطْعِمُ لِكُلِّ يَوْمٍ مِسْكِينًا كَمَا يُطْعِمُ فِي الْكَفَّارَاتِ",null,"اور شیخِ فانی (انتہائی بوڑھا) جو روزہ رکھنے پر قادر نہ ہو وہ روزہ چھوڑ دے اور ہر دن کے بدلے ایک مسکین کو کھانا کھلائے جیسے کفارات میں کھلایا جاتا ہے"],["m","وَمَنْ مَاتَ وَعَلَيْهِ قَضَاءُ رَمَضَانَ فَأَوْصَى بِهِ أَطْعَمَ عَنْهُ وَلِيُّهُ لِكُلِّ يَوْمٍ مِسْكِينًا نِصْفَ صَاعٍ مِنْ بُرٍّ أَوْ صَاعًا مِنْ تَمْرٍ أَوْ صَاعًا مِنْ شَعِيرٍ",null,"اور جو مر جائے اور اس کے ذمے رمضان کی قضا ہو اور وہ اس کی وصیت کر جائے تو اس کی طرف سے اس کا ولی ہر دن کے بدلے ایک مسکین کو گندم کا آدھا صاع، یا کھجور کا ایک صاع، یا جو کا ایک صاع کھلائے"],["f","مَسَائِلُ مُتَفَرِّقَةٌ",null,"متفرق مسائل"],["m","وَمَنْ دَخَلَ فِي صَوْمِ التَّطَوُّعِ أَوْ صَلَاةِ التَّطَوُّعِ ثُمَّ أَفْسَدَهُ قَضَاهُ",null,"اور جو نفل روزے یا نفل نماز میں داخل ہو جائے پھر اسے فاسد کر دے تو اس کی قضا کرے"],["m","وَإِذَا بَلَغَ الصَّبِيُّ أَوْ أَسْلَمَ الْكَافِرُ فِي رَمَضَانَ أَمْسَكَا بَقِيَّةَ يَوْمِهِمَا وَصَامَا مَا بَعْدَهُ وَلَمْ يَقْضِيَا مَا مَضَى",null,"اور جب بچہ بالغ ہو جائے یا کافر رمضان میں مسلمان ہو جائے تو وہ اپنے دن کے باقی حصے میں رکے رہیں اور اس کے بعد کے روزے رکھیں، اور جو گزر چکا اس کی قضا نہ کریں"],["m","وَمَنْ أُغْمِيَ عَلَيْهِ فِي رَمَضَانَ لَمْ يَقْضِ الْيَوْمَ الَّذِي حَدَثَ فِيهِ الْإِغْمَاءُ وَقَضَى مَا بَعْدَهُ وَإِذَا أَفَاقَ الْمَجْنُونُ فِي بَعْضِ رَمَضَانَ قَضَى مَا مَضَى مِنْهُ",null,"اور جو رمضان میں بے ہوش ہو جائے وہ اس دن کی قضا نہ کرے جس میں بے ہوشی شروع ہوئی اور اس کے بعد کے دنوں کی قضا کرے؛ اور جب مجنون رمضان کے کچھ حصے میں ہوش میں آ جائے تو اس میں سے جو گزر چکا اس کی قضا کرے"],["m","وَإِذَا حَاضَتِ الْمَرْأَةُ أَفْطَرَتْ وَقَضَتْ وَإِذَا قَدِمَ الْمُسَافِرُ أَوْ طَهُرَتِ الْحَائِضُ فِي بَعْضِ النَّهَارِ أَمْسَكَا عَنِ الطَّعَامِ وَالشَّرَابِ بَقِيَّةَ يَوْمِهِمَا",null,"اور جب عورت کو حیض آ جائے تو روزہ چھوڑ دے اور قضا کرے؛ اور جب مسافر آ جائے یا حائضہ دن کے کسی حصے میں پاک ہو جائے تو دونوں اپنے دن کے باقی حصے میں کھانے پینے سے رکے رہیں"],["m","وَمَنْ تَسَحَّرَ وَهُوَ يَظُنُّ أَنَّ الْفَجْرَ لَمْ يَطْلُعْ أَوْ أَفْطَرَ وَهُوَ يَرَى أَنَّ الشَّمْسَ قَدْ غَرَبَتْ ثُمَّ تَبَيَّنَ أَنَّ الْفَجْرَ كَانَ قَدْ طَلَعَ أَوْ أَنَّ الشَّمْسَ لَمْ تَغْرُبْ قَضَى ذَلِكَ الْيَوْمَ وَلَا كَفَّارَةَ عَلَيْهِ",null,"اور جس نے سحری کی اور اس کا گمان تھا کہ فجر طلوع نہیں ہوئی، یا افطار کر لیا اور اس کا خیال تھا کہ سورج غروب ہو چکا، پھر ظاہر ہوا کہ فجر طلوع ہو چکی تھی یا سورج غروب نہیں ہوا تھا، تو اس دن کی قضا کرے اور اس پر کفارہ نہیں"],["m","وَمَنْ رَأَى هِلَالَ الْفِطْرِ وَحْدَهُ لَمْ يُفْطِرْ",null,"اور جس نے اکیلے عیدالفطر کا چاند دیکھا وہ افطار نہ کرے"],["m","وَإِذَا كَانَ بِالسَّمَاءِ عِلَّةٌ لَمْ تُقْبَلْ فِي هِلَالِ الْفِطْرِ إِلَّا شَهَادَةُ رَجُلَيْنِ أَوْ رَجُلٍ وَامْرَأَتَيْنِ وَإِنْ لَمْ يَكُنْ بِالسَّمَاءِ عِلَّةٌ لَمْ تُقْبَلْ إِلَّا شَهَادَةُ جَمْعٍ كَثِيرٍ يَقَعُ الْعِلْمُ بِخَبَرِهِمْ",null,"اور جب آسمان میں کوئی رکاوٹ ہو تو عیدالفطر کے چاند میں صرف دو مردوں یا ایک مرد اور دو عورتوں کی گواہی قبول کی جائے گی؛ اور اگر آسمان میں کوئی رکاوٹ نہ ہو تو صرف ایسی بڑی جماعت کی گواہی قبول ہوگی جن کی خبر سے علم حاصل ہو جائے"]]},{"t":"بَابُ الِاعْتِكَافِ","tu":"اعتکاف کا باب","ed":false,"items":[["m","الِاعْتِكَافُ مُسْتَحَبٌّ وَهُوَ اللُّبْثُ فِي الْمَسْجِدِ مَعَ الصَّوْمِ وَنِيَّةِ الِاعْتِكَافِ",null,"اعتکاف مستحب ہے، اور وہ روزے اور اعتکاف کی نیت کے ساتھ مسجد میں ٹھہرنے کا نام ہے"],["m","وَيَحْرُمُ عَلَى الْمُعْتَكِفِ: الْوَطْءُ وَاللَّمْسُ وَالْقُبْلَةُ وَلَا يَخْرُجُ مِنَ الْمَسْجِدِ إِلَّا لِحَاجَةِ الْإِنْسَانِ أَوِ الْجُمُعَةِ وَلَا بَأْسَ بِأَنْ يَبِيعَ وَيَبْتَاعَ فِي الْمَسْجِدِ مِنْ غَيْرِ أَنْ يُحْضِرَ السِّلْعَةَ",null,"اور معتکف پر حرام ہے: وطی، چھونا اور بوسہ؛ اور وہ مسجد سے نہ نکلے مگر انسانی حاجت یا جمعہ کے لیے؛ اور اس میں کوئی حرج نہیں کہ مسجد میں خرید و فروخت کرے بشرطیکہ سامان کو (مسجد میں) حاضر نہ کرے"],["m","وَلَا يَتَكَلَّمُ إِلَّا بِخَيْرٍ وَيُكْرَهُ لَهُ الصَّمْتُ فَإِنْ جَامَعَ الْمُعْتَكِفُ لَيْلًا أَوْ نَهَارًا بَطَلَ اعْتِكَافُهُ",null,"اور خیر کے سوا کلام نہ کرے؛ اور اس کے لیے خاموشی اختیار کرنا مکروہ ہے؛ پس اگر معتکف نے رات یا دن میں جماع کر لیا تو اس کا اعتکاف باطل ہو گیا"],["m","وَمَنْ أَوْجَبَ عَلَى نَفْسِهِ اعْتِكَافَ أَيَّامٍ لَزِمَهُ اعْتِكَافُهَا بِلَيَالِيهَا وَكَانَتْ مُتَتَابِعَةً وَإِنْ لَمْ يَشْتَرِطِ التَّتَابُعَ",null,"اور جس نے اپنے اوپر چند دنوں کا اعتکاف واجب کر لیا تو اس پر راتوں سمیت ان کا اعتکاف لازم ہے اور وہ متواتر ہوں گے، خواہ اس نے تسلسل کی شرط نہ لگائی ہو"]]}]},{"n":5,"title":"كِتَابُ الْحَجِّ","tu":"کتاب الحج","babs":[{"t":"شُرُوطُ الْحَجِّ وَالْمَوَاقِيتِ","tu":"حج کی شرائط اور میقات","ed":true,"items":[["m","الْحَجُّ: وَاجِبٌ عَلَى الْأَحْرَارِ الْبَالِغِينَ الْعُقَلَاءِ الْأَصِحَّاءِ إِذَا قَدَرُوا عَلَى الزَّادِ وَالرَّاحِلَةِ فَاضِلًا عَنْ مَسْكَنِهِ وَمَا لَا بُدَّ مِنْهُ وَعَنْ نَفَقَةِ عِيَالِهِ إِلَى حِينِ عَوْدِهِ وَكَانَ الطَّرِيقُ آمِنًا",null,"حج آزاد، بالغ، عاقل، تندرست لوگوں پر واجب ہے جب وہ زادِ راہ اور سواری پر قادر ہوں، جو ان کے مکان، ضروری چیزوں اور واپسی تک ان کے اہل و عیال کے نفقے سے زائد ہو، اور راستہ پرامن ہو"],["m","وَيُعْتَبَرُ فِي الْمَرْأَةِ أَنْ يَكُونَ لَهَا مَحْرَمٌ يَحُجُّ بِهَا أَوْ زَوْجٌ وَلَا يَجُوزُ لَهَا أَنْ تَحُجَّ بِغَيْرِهِمَا إِذَا كَانَ بَيْنَهَا وَبَيْنَ مَكَّةَ مَسِيرَةُ ثَلَاثَةِ أَيَّامٍ وَلَيَالِيهَا",null,"اور عورت کے لیے شرط ہے کہ اس کے ساتھ کوئی محرم یا شوہر ہو جو اسے حج کرائے؛ اور اگر اس کے اور مکہ کے درمیان تین دن اور ان کی راتوں کی مسافت ہو تو ان دونوں کے بغیر اس کا حج کرنا جائز نہیں"],["m","وَإِذَا بَلَغَ الصَّبِيُّ بَعْدَ مَا أَحْرَمَ أَوْ أُعْتِقَ الْعَبْدُ فَمَضَيَا عَلَى ذَلِكَ لَمْ يُجْزِئْهُمَا عَنْ حَجَّةِ الْإِسْلَامِ",null,"اور جب بچہ احرام باندھنے کے بعد بالغ ہو جائے یا غلام آزاد ہو جائے اور وہ اسی حالت پر آگے بڑھیں تو یہ ان کے لیے حجۃ الاسلام سے کافی نہیں"]]},{"t":"بَابُ تَحْدِيدِ الْمَوَاقِيتِ","tu":"میقاتوں کی تعیین کا باب","ed":false,"items":[["m","وَالْمَوَاقِيتُ الَّتِي لَا يَجُوزُ أَنْ يَتَجَاوَزَهَا الْإِنْسَانُ إِلَّا مُحْرِمًا: لِأَهْلِ الْمَدِينَةِ ذُو الْحُلَيْفَةِ وَلِأَهْلِ الْعِرَاقِ ذَاتُ عِرْقٍ وَلِأَهْلِ الشَّامِ الْجُحْفَةُ وَلِأَهْلِ نَجْدٍ قَرْنُ الْمَنَازِلِ وَلِأَهْلِ الْيَمَنِ يَلَمْلَمُ فَإِنْ قَدَّمَ الْإِحْرَامَ عَلَى هَذِهِ الْمَوَاقِيتِ جَازَ",null,"اور وہ میقاتیں جن سے آدمی احرام کے بغیر آگے نہیں بڑھ سکتا یہ ہیں: اہلِ مدینہ کے لیے ذوالحلیفہ، اہلِ عراق کے لیے ذاتِ عرق، اہلِ شام کے لیے جحفہ، اہلِ نجد کے لیے قرنِ منازل اور اہلِ یمن کے لیے یلملم؛ پس اگر ان میقاتوں سے پہلے احرام باندھ لے تو جائز ہے"],["m","وَمَنْ كَانَ مَنْزِلُهُ بَعْدَ الْمَوَاقِيتِ فَمِيقَاتُهُ الْحِلُّ وَمَنْ كَانَ بِمَكَّةَ فَمِيقَاتُهُ فِي الْحَجِّ الْحَرَمُ وَفِي الْعُمْرَةِ الْحِلُّ",null,"اور جس کا گھر میقاتوں کے اندر ہو اس کی میقات حِلّ ہے؛ اور جو مکہ میں ہو اس کی میقات حج میں حرم ہے اور عمرہ میں حِلّ"],["f","الْإِحْرَامُ وَالتَّلْبِيَةُ",null,"احرام اور تلبیہ"],["m","وَإِذَا أَرَادَ الْإِحْرَامَ اغْتَسَلَ أَوْ تَوَضَّأَ - وَالْغُسْلُ أَفْضَلُ - وَلَبِسَ ثَوْبَيْنِ جَدِيدَيْنِ أَوْ غَسِيلَيْنِ إِزَارًا وَرِدَاءً وَمَسَّ طِيبًا إِنْ كَانَ لَهُ طِيبٌ وَصَلَّى رَكْعَتَيْنِ وَقَالَ: اللَّهُمَّ إِنِّي أُرِيدُ الْحَجَّ فَيَسِّرْهُ لِي وَتَقَبَّلْهُ مِنِّي",null,"اور جب احرام باندھنے کا ارادہ کرے تو غسل کرے یا وضو کرے - اور غسل افضل ہے - اور دو نئی یا دھلی ہوئی چادریں پہنے، ایک تہبند اور ایک چادر؛ اگر خوشبو ہو تو خوشبو لگائے، دو رکعتیں پڑھے اور کہے: \"اللہم انی ارید الحج فیسرہ لی وتقبلہ منی\""],["m","ثُمَّ يُلَبِّي عَقِيبَ صَلَاتِهِ",null,"پھر اپنی نماز کے فوراً بعد تلبیہ کہے"],["m","فَإِنْ كَانَ مُفْرِدًا بِالْحَجِّ نَوَى بِتَلْبِيَتِهِ الْحَجَّ وَالتَّلْبِيَةُ أَنْ يَقُولَ: لَبَّيْكَ اللَّهُمَّ لَبَّيْكَ لَبَّيْكَ لَا شَرِيكَ لَكَ لَبَّيْكَ إِنَّ الْحَمْدَ وَالنِّعْمَةَ لَكَ وَالْمُلْكَ لَا شَرِيكَ لَكَ وَلَا يَنْبَغِي أَنْ يُخِلَّ بِشَيْءٍ مِنْ هَذِهِ الْكَلِمَاتِ فَإِنْ زَادَ فِيهَا جَازَ",null,"پس اگر صرف حج کرنے والا ہو تو اپنے تلبیہ سے حج کی نیت کرے؛ اور تلبیہ یہ ہے کہ کہے: \"لبیک اللہم لبیک، لبیک لا شریک لک لبیک، ان الحمد والنعمۃ لک والملک، لا شریک لک\"؛ اور مناسب نہیں کہ ان کلمات میں سے کسی میں کمی کرے، البتہ اگر ان میں اضافہ کرے تو جائز ہے"],["f","مَحْظُورَاتُ الْإِحْرَامِ",null,"احرام کی ممنوعات"],["m","فَإِذَا لَبَّى فَقَدْ أَحْرَمَ فَلْيَتَّقِ مَا نَهَى اللهُ عَنْهُ مِنَ الرَّفَثِ وَالْفُسُوقِ وَالْجِدَالِ وَلَا يَقْتُلُ صَيْدًا وَلَا يُشِيرُ إِلَيْهِ وَلَا يَدُلُّ عَلَيْهِ وَلَا يَلْبَسُ قَمِيصًا وَلَا سَرَاوِيلَ وَلَا عِمَامَةً وَلَا قَلَنْسُوَةً وَلَا قَبَاءً وَلَا خُفَّيْنِ إِلَّا أَنْ لَا يَجِدَ النَّعْلَيْنِ فَيَقْطَعَهُمَا أَسْفَلَ الْكَعْبَيْنِ وَلَا يُغَطِّي رَأْسَهُ وَلَا وَجْهَهُ وَلَا يَمَسُّ طِيبًا وَلَا يَحْلِقُ رَأْسَهُ وَلَا شَعْرَ بَدَنِهِ وَلَا يَقُصُّ مِنْ لِحْيَتِهِ وَلَا مِنْ ظُفْرِهِ وَلَا يَلْبَسُ ثَوْبًا مَصْبُوغًا بِوَرْسٍ وَلَا زَعْفَرَانٍ وَلَا عُصْفُرٍ إِلَّا أَنْ يَكُونَ غَسِيلًا لَا يَنْفُضُ",null,"پس جب تلبیہ کہہ لیا تو احرام باندھ لیا؛ اب ان چیزوں سے بچے جن سے اللہ نے منع فرمایا: رفث، فسوق اور جدال؛ شکار نہ مارے، نہ اس کی طرف اشارہ کرے اور نہ اس کی راہنمائی کرے؛ نہ قمیص پہنے، نہ شلوار، نہ عمامہ، نہ ٹوپی، نہ قبا اور نہ موزے، مگر یہ کہ جوتے نہ ملیں تو انہیں ٹخنوں کے نیچے سے کاٹ لے؛ نہ اپنا سر اور چہرہ ڈھانکے، نہ خوشبو لگائے، نہ اپنا سر مونڈے اور نہ بدن کے بال، نہ اپنی داڑھی اور ناخن کترے؛ اور ورس، زعفران یا عصفر سے رنگا ہوا کپڑا نہ پہنے، مگر یہ کہ دھلا ہوا ہو جس سے رنگ نہ جھڑتا ہو"],["m","وَلَا بَأْسَ أَنْ يَغْتَسِلَ وَيَدْخُلَ الْحَمَّامَ وَيَسْتَظِلَّ بِالْبَيْتِ وَالْمَحْمِلِ وَيَشُدَّ فِي وَسَطِهِ الْهِمْيَانَ",null,"اور اس میں کوئی حرج نہیں کہ غسل کرے، حمام میں داخل ہو، کعبہ (کی چھت) اور محمل کے سائے میں رہے اور اپنی کمر میں تھیلی باندھے"],["m","وَلَا يَغْسِلُ رَأْسَهُ وَلَا لِحْيَتَهُ بِالْخِطْمِيِّ وَيُكْثِرُ مِنَ التَّلْبِيَةِ عَقِبَ الصَّلَوَاتِ وَكُلَّمَا عَلَا شَرَفًا أَوْ هَبَطَ وَادِيًا أَوْ لَقِيَ رُكْبَانًا وَبِالْأَسْحَارِ",null,"اور اپنا سر اور داڑھی خطمی سے نہ دھوئے؛ اور نمازوں کے بعد، اور جب بھی کسی بلندی پر چڑھے یا وادی میں اترے یا سواروں سے ملے، اور سحر کے اوقات میں کثرت سے تلبیہ کہے"],["f","دُخُولُ مَكَّةَ وَالطَّوَافُ وَالسَّعْيُ",null,"مکہ میں داخلہ، طواف اور سعی"],["m","فَإِذَا دَخَلَ مَكَّةَ ابْتَدَأَ بِالْمَسْجِدِ الْحَرَامِ فَإِذَا عَايَنَ الْبَيْتَ كَبَّرَ وَهَلَّلَ ثُمَّ ابْتَدَأَ بِالْحَجَرِ الْأَسْوَدِ فَاسْتَقْبَلَهُ وَكَبَّرَ وَرَفَعَ يَدَيْهِ وَاسْتَلَمَهُ وَقَبَّلَهُ إِنِ اسْتَطَاعَ مِنْ غَيْرِ أَنْ يُؤْذِيَ مُسْلِمًا ثُمَّ أَخَذَ عَنْ يَمِينِهِ مِمَّا يَلِي الْبَابَ وَقَدِ اضْطَبَعَ رِدَاءَهُ قَبْلَ ذَلِكَ فَيَطُوفُ بِالْبَيْتِ سَبْعَةَ أَشْوَاطٍ",null,"پھر جب مکہ میں داخل ہو تو مسجدِ حرام سے آغاز کرے؛ جب بیت اللہ کو دیکھے تو تکبیر و تہلیل کہے، پھر حجرِ اسود سے شروع کرے، اس کی طرف رخ کرے، تکبیر کہے، ہاتھ اٹھائے، اس کا استلام کرے اور اگر ممکن ہو تو کسی مسلمان کو تکلیف دیے بغیر اسے بوسہ دے؛ پھر اپنی دائیں جانب سے باب کی طرف چلے، اور اس سے پہلے اپنی چادر سے اضطباع کر چکا ہو؛ اور بیت اللہ کے سات چکر لگائے"],["m","وَيَجْعَلُ طَوَافَهُ مِنْ وَرَاءِ الْحَطِيمِ وَيَرْمُلُ فِي الْأَشْوَاطِ الثَّلَاثَةِ الْأُوَلِ وَيَمْشِي فِيمَا بَقِيَ عَلَى هِينَتِهِ وَيَسْتَلِمُ الْحَجَرَ كُلَّمَا مَرَّ بِهِ إِنِ اسْتَطَاعَ وَيَخْتِمُ الطَّوَافَ بِالِاسْتِلَامِ",null,"اور اپنا طواف حطیم کے پیچھے سے کرے، پہلے تین چکروں میں رمل کرے اور باقی میں اپنی عام رفتار سے چلے؛ جب بھی حجرِ اسود کے پاس سے گزرے اگر ممکن ہو تو اس کا استلام کرے، اور طواف کو استلام پر ختم کرے"],["m","ثُمَّ يَأْتِي الْمَقَامَ فَيُصَلِّي عِنْدَهُ رَكْعَتَيْنِ أَوْ حَيْثُ تَيَسَّرَ مِنَ الْمَسْجِدِ",null,"پھر مقام (ابراہیم) کے پاس آ کر اس کے پاس دو رکعتیں پڑھے، یا مسجد میں جہاں آسانی ہو"],["m","وَهَذَا الطَّوَافُ طَوَافُ الْقُدُومِ وَهُوَ سُنَّةٌ وَلَيْسَ بِوَاجِبٍ وَلَيْسَ عَلَى أَهْلِ مَكَّةَ طَوَافُ الْقُدُومِ",null,"اور یہ طوافِ قدوم ہے جو سنت ہے، واجب نہیں؛ اور اہلِ مکہ پر طوافِ قدوم نہیں"],["m","ثُمَّ يَخْرُجُ إِلَى الصَّفَا فَيَصْعَدُ عَلَيْهِ وَيَسْتَقْبِلُ الْبَيْتَ وَيُكَبِّرُ وَيُهَلِّلُ وَيُصَلِّي عَلَى النَّبِيِّ ﷺ وَيَدْعُو اللهَ تَعَالَى بِحَاجَتِهِ",null,"پھر صفا کی طرف نکلے، اس پر چڑھے، بیت اللہ کی طرف رخ کرے، تکبیر و تہلیل کہے، نبی ﷺ پر درود بھیجے اور اللہ تعالیٰ سے اپنی حاجت کی دعا کرے"],["m","ثُمَّ يَنْحَطُّ نَحْوَ الْمَرْوَةِ وَيَمْشِي عَلَى هِينَتِهِ فَإِذَا بَلَغَ إِلَى بَطْنِ الْوَادِي سَعَى بَيْنَ الْمِيلَيْنِ الْأَخْضَرَيْنِ سَعْيًا حَتَّى يَأْتِيَ الْمَرْوَةَ فَيَصْعَدَ عَلَيْهَا وَيَفْعَلَ كَمَا فَعَلَ عَلَى الصَّفَا وَهَذَا شَوْطٌ فَيَطُوفُ سَبْعَةَ أَشْوَاطٍ يَبْدَأُ بِالصَّفَا وَيَخْتِمُ بِالْمَرْوَةِ",null,"پھر مروہ کی طرف اترے اور اپنی عام رفتار سے چلے؛ جب وادی کے درمیان پہنچے تو دونوں سبز نشانوں کے درمیان دوڑ کر سعی کرے یہاں تک کہ مروہ پر پہنچے، اس پر چڑھے اور وہی کرے جو صفا پر کیا تھا؛ یہ ایک چکر ہوا؛ پس سات چکر لگائے، صفا سے شروع کرے اور مروہ پر ختم کرے"],["f","مِنْ يَوْمِ التَّرْوِيَةِ إِلَى عَرَفَةَ",null,"یومِ ترویہ سے عرفہ تک"],["m","ثُمَّ يُقِيمُ بِمَكَّةَ حَرَامًا يَطُوفُ بِالْبَيْتِ كُلَّمَا بَدَا لَهُ فَإِذَا كَانَ قَبْلَ يَوْمِ التَّرْوِيَةِ بِيَوْمٍ خَطَبَ الْإِمَامُ خُطْبَةً يُعَلِّمُ النَّاسَ فِيهَا الْخُرُوجَ إِلَى مِنًى وَالصَّلَاةَ بِعَرَفَاتٍ وَالْوُقُوفَ وَالْإِفَاضَةَ فَإِذَا صَلَّى الْفَجْرَ يَوْمَ التَّرْوِيَةِ بِمَكَّةَ خَرَجَ إِلَى مِنًى فَأَقَامَ بِهَا حَتَّى يُصَلِّيَ الْفَجْرَ يَوْمَ عَرَفَةَ",null,"پھر مکہ میں احرام کی حالت میں ٹھہرے، جب چاہے بیت اللہ کا طواف کرے؛ پھر جب یومِ ترویہ سے ایک دن پہلے ہو تو امام ایک خطبہ دے جس میں لوگوں کو منیٰ کی طرف نکلنا، عرفات میں نماز، وقوف اور افاضہ سکھائے؛ پس جب یومِ ترویہ کو مکہ میں فجر پڑھ لے تو منیٰ کی طرف نکل جائے اور وہاں یومِ عرفہ کی فجر پڑھنے تک ٹھہرے"],["m","ثُمَّ يَتَوَجَّهُ إِلَى عَرَفَاتٍ فَيُقِيمُ بِهَا",null,"پھر عرفات کی طرف جائے اور وہاں ٹھہرے"],["m","فَإِذَا زَالَتِ الشَّمْسُ مِنْ يَوْمِ عَرَفَةَ صَلَّى الْإِمَامُ بِالنَّاسِ الظُّهْرَ وَالْعَصْرَ ثُمَّ يَبْتَدِئُ فَيَخْطُبُ خُطْبَتَيْنِ قَبْلَ الصَّلَاةِ يُعَلِّمُ النَّاسَ فِيهَا الصَّلَاةَ وَالْوُقُوفَ بِعَرَفَةَ وَالْمُزْدَلِفَةَ وَرَمْيَ الْجِمَارِ وَالنَّحْرَ وَالْحَلْقَ وَطَوَافَ الزِّيَارَةِ وَيُصَلِّي بِهِمُ الظُّهْرَ وَالْعَصْرَ فِي وَقْتِ الظُّهْرِ بِأَذَانٍ وَإِقَامَتَيْنِ وَمَنْ صَلَّى فِي رَحْلِهِ وَحْدَهُ صَلَّى كُلَّ وَاحِدَةٍ مِنْهُمَا فِي وَقْتِهَا عِنْدَ أَبِي حَنِيفَةَ رَحِمَهُ اللهُ تَعَالَى وَقَالَ أَبُو يُوسُفَ وَمُحَمَّدٌ رَحِمَهُمَا اللهُ: يَجْمَعُ بَيْنَهُمَا الْمُنْفَرِدُ",null,"پس جب یومِ عرفہ کو سورج ڈھل جائے تو امام لوگوں کو ظہر اور عصر پڑھائے؛ پھر نماز سے پہلے دو خطبے دینا شروع کرے جن میں لوگوں کو نماز، عرفہ اور مزدلفہ میں وقوف، رمیِ جمار، نحر، حلق اور طوافِ زیارت کی تعلیم دے؛ اور انہیں ظہر کے وقت میں ظہر اور عصر ایک اذان اور دو اقامتوں کے ساتھ پڑھائے؛ اور جو اپنے ڈیرے میں اکیلا نماز پڑھے وہ امام ابو حنیفہ رحمہ اللہ تعالیٰ کے نزدیک ان میں سے ہر ایک کو اس کے اپنے وقت میں پڑھے؛ اور امام ابو یوسف اور امام محمد رحمہما اللہ نے فرمایا: اکیلا شخص بھی دونوں کو جمع کرے"],["f","الْوُقُوفُ بِعَرَفَةَ وَالْمُزْدَلِفَةِ",null,"عرفہ اور مزدلفہ میں وقوف"],["m","ثُمَّ يَتَوَجَّهُ إِلَى الْمَوْقِفِ فَيَقِفُ بِقُرْبِ الْجَبَلِ وَعَرَفَاتٌ كُلُّهَا مَوْقِفٌ إِلَّا بَطْنَ عُرَنَةَ",null,"پھر موقف کی طرف جائے اور پہاڑ کے قریب وقوف کرے؛ اور پورا عرفات موقف ہے سوائے بطنِ عرنہ کے"],["m","وَيَنْبَغِي لِلْإِمَامِ أَنْ يَقِفَ بِعَرَفَةَ عَلَى رَاحِلَتِهِ وَيَدْعُوَ وَيُعَلِّمَ النَّاسَ الْمَنَاسِكَ وَيُسْتَحَبُّ أَنْ يَغْتَسِلَ قَبْلَ الْوُقُوفِ وَيَجْتَهِدَ فِي الدُّعَاءِ",null,"اور امام کے لیے مناسب ہے کہ عرفہ میں اپنی سواری پر وقوف کرے، دعا کرے اور لوگوں کو مناسک سکھائے؛ اور مستحب ہے کہ وقوف سے پہلے غسل کرے اور دعا میں خوب کوشش کرے"],["m","فَإِذَا غَرَبَتِ الشَّمْسُ أَفَاضَ الْإِمَامُ وَالنَّاسُ مَعَهُ عَلَى هِينَتِهِمْ حَتَّى يَأْتُوا الْمُزْدَلِفَةَ فَيَنْزِلُوا بِهَا وَالْمُسْتَحَبُّ أَنْ يَنْزِلَ بِقُرْبِ الْجَبَلِ الَّذِي عَلَيْهِ الْمِيقَدَةُ يُقَالُ لَهُ قُزَحُ وَيُصَلِّي الْإِمَامُ بِالنَّاسِ الْمَغْرِبَ وَالْعِشَاءَ بِأَذَانٍ وَإِقَامَةٍ وَمَنْ صَلَّى الْمَغْرِبَ فِي الطَّرِيقِ لَمْ يَجُزْ عِنْدَ أَبِي حَنِيفَةَ وَمُحَمَّدٍ",null,"پھر جب سورج غروب ہو جائے تو امام اور اس کے ساتھ لوگ اطمینان سے روانہ ہوں یہاں تک کہ مزدلفہ پہنچ کر وہاں اتریں؛ اور مستحب یہ ہے کہ اس پہاڑ کے قریب اتریں جس پر آگ جلانے کی جگہ ہے جسے قزح کہا جاتا ہے؛ اور امام لوگوں کو مغرب اور عشاء ایک اذان اور ایک اقامت کے ساتھ پڑھائے؛ اور جس نے راستے میں مغرب پڑھ لی تو امام ابو حنیفہ اور امام محمد کے نزدیک جائز نہیں"],["m","فَإِذَا طَ َبُو يُوسُفَ وَمُحَمَّدٌ: عَلَيْهِ صَدَقَةٌ وَإِنْ قَصَّ أَظَافِيرَ يَدَيْهِ وَرِجْلَيْهِ فَعَلَيْهِ دَمٌ",null,"اور اگر پچھنے لگوانے کی جگہیں مونڈیں تو امام ابو حنیفہ کے نزدیک اس پر دم ہے؛ اور امام ابو یوسف اور امام محمد نے فرمایا: اس پر صدقہ ہے؛ اور اگر اپنے ہاتھوں اور پاؤں کے ناخن کاٹے تو اس پر دم ہے"],["m","وَإِنْ قَصَّ يَدًا أَوْ رِجْلًا فَعَلَيْهِ دَمٌ وَإِنْ قَصَّ أَقَلَّ مِنْ خَمْسَةِ أَظَافِيرَ مُتَفَرِّقَةً مِنْ يَدَيْهِ وَرِجْلَيْهِ فَعَلَيْهِ صَدَقَةٌ عِنْدَ أَبِي حَنِيفَةَ وَأَبِي يُوسُفَ وَقَالَ مُحَمَّدٌ: عَلَيْهِ دَمٌ",null,"اور اگر ایک ہاتھ یا ایک پاؤں کے ناخن کاٹے تو اس پر دم ہے؛ اور اگر اپنے ہاتھوں اور پاؤں کے متفرق پانچ ناخنوں سے کم کاٹے تو امام ابو حنیفہ اور امام ابو یوسف کے نزدیک اس پر صدقہ ہے، اور امام محمد نے فرمایا: اس پر دم ہے"],["m","وَإِنْ تَطَيَّبَ أَوْ حَلَقَ أَوْ لَبِسَ مِنْ عُذْرٍ فَهُوَ مُخَيَّرٌ: إِنْ شَاءَ ذَبَحَ شَاةً وَإِنْ شَاءَ تَصَدَّقَ عَلَى سِتَّةِ مَسَاكِينَ بِثَلَاثَةِ أَصْوَاعٍ مِنْ طَعَامٍ وَإِنْ شَاءَ صَامَ ثَلَاثَةَ أَيَّامٍ",null,"اور اگر عذر کی وجہ سے خوشبو لگائی یا مونڈا یا (سلا کپڑا) پہنا تو اسے اختیار ہے: چاہے تو بکری ذبح کرے، چاہے تو چھ مسکینوں پر تین صاع کھانا صدقہ کرے اور چاہے تو تین روزے رکھے"],["f","جِنَايَاتُ الْجِمَاعِ",null,"جماع کی جنایات"],["m","وَإِنْ قَبَّلَ أَوْ لَمَسَ بِشَهْوَةٍ فَعَلَيْهِ دَمٌ",null,"اور اگر شہوت سے بوسہ لیا یا چھوا تو اس پر دم ہے"],["m","وَمَنْ جَامَعَ فِي أَحَدِ السَّبِيلَيْنِ قَبْلَ الْوُقُوفِ بِعَرَفَةَ فَسَدَ حَجُّهُ وَعَلَيْهِ شَاةٌ وَيَمْضِي فِي الْحَجِّ كَمَا يَمْضِي مَنْ لَمْ يَفْسُدْ حَجُّهُ وَعَلَيْهِ الْقَضَاءُ وَلَيْسَ عَلَيْهِ أَنْ يُفَارِقَ امْرَأَتَهُ إِذَا حَجَّ بِهَا فِي الْقَضَاءِ",null,"اور جس نے عرفہ کے وقوف سے پہلے دونوں راستوں میں سے کسی میں جماع کیا تو اس کا حج فاسد ہو گیا، اس پر ایک بکری ہے، وہ حج کے افعال اسی طرح جاری رکھے جیسے وہ شخص جاری رکھتا ہے جس کا حج فاسد نہ ہوا ہو، اور اس پر قضا ہے؛ اور اگر قضا میں اپنی بیوی کو حج کرائے تو اس پر لازم نہیں کہ اپنی بیوی سے جدا ہو"],["m","وَمَنْ جَامَعَ بَعْدَ الْوُقُوفِ بِعَرَفَةَ لَمْ يَفْسُدْ حَجُّهُ وَعَلَيْهِ بَدَنَةٌ فَإِنْ جَامَعَ بَعْدَ الْحَلْقِ فَعَلَيْهِ شَاةٌ",null,"اور جس نے عرفہ کے وقوف کے بعد جماع کیا تو اس کا حج فاسد نہیں ہوا اور اس پر ایک اونٹ ہے؛ پھر اگر حلق کے بعد جماع کیا تو اس پر ایک بکری ہے"],["m","وَمَنْ جَامَعَ فِي الْعُمْرَةِ قَبْلَ أَنْ يَطُوفَ أَرْبَعَةَ أَشْوَاطٍ أَفْسَدَهَا وَمَضَى فِيهَا وَقَضَاهَا وَعَلَيْهِ شَاةٌ وَإِنْ وَطِئَ بَعْدَمَا طَافَ أَرْبَعَةَ أَشْوَاطٍ فَعَلَيْهِ شَاةٌ وَلَا تَفْسُدُ عُمْرَتُهُ وَلَا يَلْزَمُهُ قَضَاؤُهَا",null,"اور جس نے عمرے میں چار چکر طواف کرنے سے پہلے جماع کیا تو اس نے عمرے کو فاسد کر دیا؛ وہ اسے جاری رکھے، اس کی قضا کرے اور اس پر ایک بکری ہے؛ اور اگر چار چکر طواف کرنے کے بعد وطی کی تو اس پر ایک بکری ہے، اس کا عمرہ فاسد نہیں ہوتا اور نہ اس کی قضا اس پر لازم ہے"],["m","وَمَنْ جَامَعَ نَاسِيًا كَمَنْ جَامَعَ عَامِدًا",null,"اور جس نے بھول کر جماع کیا وہ جان بوجھ کر جماع کرنے والے کی طرح ہے"],["f","جِنَايَاتُ الطَّوَافِ وَالسَّعْيِ وَالْوُقُوفِ وَالرَّمْيِ",null,"طواف، سعی، وقوف اور رمی کی جنایات"],["m","وَمَنْ طَافَ طَوَافَ الْقُدُومِ مُحْدِثًا فَعَلَيْهِ صَدَقَةٌ وَإِنْ طَافَ جُنُبًا فَعَلَيْهِ شَاةٌ وَمَنْ طَافَ طَوَافَ الزِّيَارَةِ مُحْدِثًا فَعَلَيْهِ شَاةٌ وَإِنْ كَانَ جُنُبًا فَعَلَيْهِ بَدَنَةٌ وَالْأَفْضَلُ أَنْ يُعِيدَ الطَّوَافَ مَا دَامَ بِمَكَّةَ وَلَا ذَبْحَ عَلَيْهِ",null,"اور جس نے بے وضو طوافِ قدوم کیا اس پر صدقہ ہے؛ اور اگر جنبی حالت میں طواف کیا تو اس پر ایک بکری ہے؛ اور جس نے بے وضو طوافِ زیارت کیا اس پر ایک بکری ہے، اور اگر جنبی ہو تو ایک اونٹ ہے؛ اور افضل یہ ہے کہ جب تک مکہ میں ہے طواف کو دہرا لے اور اس پر ذبح نہیں"],["m","وَمَنْ طَافَ طَوَافَ الصَّدْرِ مُحْدِثًا فَعَلَيْهِ صَدَقَةٌ وَإِنْ طَافَ جُنُبًا فَعَلَيْهِ شَاةٌ",null,"اور جس نے بے وضو طوافِ صدر کیا اس پر صدقہ ہے، اور اگر جنبی حالت میں کیا تو ایک بکری ہے"],["m","وَمَنْ تَرَكَ مِنْ طَوَافِ الزِّيَارَةِ ثَلَاثَةَ أَشْوَاطٍ فَمَا دُونَهَا فَعَلَيْهِ شَاةٌ وَإِنْ تَرَكَ أَرْبَعَةَ أَشْوَاطٍ بَقِيَ مُحْرِمًا أَبَدًا حَتَّى يَطُوفَهَا وَمَنْ تَرَكَ ثَلَاثَةَ أَشْوَاطٍ مِنْ طَوَافِ الصَّدْرِ فَعَلَيْهِ صَدَقَةٌ وَإِنْ تَرَكَ طَوَافَ الصَّدْرِ أَوْ أَرْبَعَةَ أَشْوَاطٍ مِنْهُ فَعَلَيْهِ شَاةٌ",null,"اور جس نے طوافِ زیارت کے تین یا اس سے کم چکر چھوڑ دیے اس پر ایک بکری ہے؛ اور اگر چار چکر چھوڑ دیے تو وہ ہمیشہ محرم رہے گا جب تک انہیں پورا نہ کرے؛ اور جس نے طوافِ صدر کے تین چکر چھوڑے اس پر صدقہ ہے؛ اور اگر طوافِ صدر یا اس کے چار چکر چھوڑ دیے تو اس پر ایک بکری ہے"],["m","وَمَنْ تَرَكَ السَّعْيَ بَيْنَ الصَّفَا وَالْمَرْوَةِ فَعَلَيْهِ شَاةٌ وَحَجُّهُ تَامٌّ",null,"اور جس نے صفا و مروہ کے درمیان سعی چھوڑ دی اس پر ایک بکری ہے اور اس کا حج پورا ہے"],["m","وَمَنْ أَفَاضَ مِنْ عَرَفَةَ قَبْلَ الْإِمَامِ فَعَلَيْهِ دَمٌ",null,"اور جو عرفہ سے امام سے پہلے روانہ ہو گیا اس پر دم ہے"],["m","وَمَنْ تَرَكَ الْوُقُوفَ بِالْمُزْدَلِفَةِ فَعَلَيْهِ دَمٌ",null,"اور جس نے مزدلفہ کا وقوف چھوڑ دیا اس پر دم ہے"],["m","وَمَنْ تَرَكَ رَمْيَ الْجِمَارِ فِي الْأَيَّامِ كُلِّهَا فَعَلَيْهِ دَمٌ وَإِنْ تَرَكَ رَمْيَ يَوْمٍ وَاحِدٍ فَعَلَيْهِ دَمٌ وَإِنْ تَرَكَ رَمْيَ إِحْدَى الْجِمَارِ الثَّلَاثِ فَعَلَيْهِ صَدَقَةٌ وَإِنْ تَرَكَ رَمْيَ جَمْرَةِ الْعَقَبَةِ فِي يَوْمِ النَّحْرِ فَعَلَيْهِ دَمٌ",null,"اور جس نے تمام دنوں کی رمیِ جمار چھوڑ دی اس پر دم ہے؛ اور اگر ایک دن کی رمی چھوڑی تو اس پر دم ہے؛ اور اگر تینوں جمرات میں سے ایک کی رمی چھوڑی تو اس پر صدقہ ہے؛ اور اگر یومِ نحر کو جمرۂ عقبہ کی رمی چھوڑ دی تو اس پر دم ہے"],["m","وَمَنْ أَخَّرَ الْحَلْقَ حَتَّى مَضَتْ أَيَّامُ النَّحْرِ فَعَلَيْهِ دَمٌ عِنْدَ أَبِي حَنِيفَةَ وَكَذَلِكَ لَوْ أَخَّرَ طَوَافَ الزِّيَارَةِ عِنْدَ أَبِي حَنِيفَةَ رَحِمَهُ اللهُ",null,"اور جس نے حلق کو ایامِ نحر گزرنے تک مؤخر کر دیا اس پر امام ابو حنیفہ کے نزدیک دم ہے؛ اور اسی طرح اگر طوافِ زیارت کو مؤخر کیا تو امام ابو حنیفہ رحمہ اللہ کے نزدیک (دم ہے)"],["f","جَزَاءُ الصَّيْدِ",null,"شکار کی جزا"],["m","وَإِذَا قَتَلَ الْمُحْرِمُ صَيْدًا أَوْ دَلَّ عَلَيْهِ مَنْ قَتَلَهُ فَعَلَيْهِ الْجَزَاءُ يَسْتَوِي فِي ذَلِكَ الْعَامِدُ وَالنَّاسِي وَالْمُبْتَدِئُ وَالْعَائِدُ",null,"اور جب محرم کسی شکار کو قتل کرے یا قاتل کو اس کی رہنمائی کرے تو اس پر جزا ہے؛ اس میں جان بوجھ کر کرنے والا اور بھولنے والا، پہلی بار کرنے والا اور دوبارہ کرنے والا برابر ہیں"],["m","وَالْجَزَاءُ عِنْدَ أَبِي حَنِيفَةَ وَأَبِي يُوسُفَ أَنْ يُقَوَّمَ الصَّيْدُ فِي الْمَكَانِ الَّذِي قَتَلَهُ فِيهِ أَوْ فِي أَقْرَبِ الْمَوَاضِعِ مِنْهُ إِنْ كَانَ فِي بَرِّيَّةٍ يُقَوِّمُهُ ذَوَا عَدْلٍ ثُمَّ هُوَ مُخَيَّرٌ فِي الْقِيمَةِ إِنْ شَاءَ ابْتَاعَ بِهَا هَدْيًا وَإِنْ شَاءَ اشْتَرَى بِهَا طَعَامًا فَتَصَدَّقَ بِهِ عَلَى كُلِّ مِسْكِينٍ نِصْفَ صَاعٍ مِنْ بُرٍّ أَوْ صَاعًا مِنْ تَمْرٍ أَوْ شَعِيرٍ وَإِنْ شَاءَ صَامَ عَنْ كُلِّ نِصْفِ صَاعٍ مِنْ بُرٍّ يَوْمًا وَعَنْ كُلِّ صَاعٍ مِنْ شَعِيرٍ يَوْمًا فَإِنْ فَضَلَ مِنَ الطَّعَامِ أَقَلُّ مِنْ نِصْفِ صَاعٍ فَهُوَ مُخَيَّرٌ: إِنْ شَاءَ تَصَدَّقَ بِهِ وَإِنْ شَاءَ صَامَ عَنْهُ يَوْمًا كَامِلًا",null,"اور امام ابو حنیفہ اور امام ابو یوسف کے نزدیک جزا یہ ہے کہ شکار کی قیمت اس جگہ لگائی جائے جہاں اسے قتل کیا گیا، یا اگر وہ جنگل میں ہو تو اس کے قریب ترین مقام پر؛ دو عادل شخص اس کی قیمت لگائیں؛ پھر اسے قیمت میں اختیار ہے: چاہے تو اس سے ہدی خرید لے، چاہے تو اس سے کھانا خرید کر ہر مسکین کو گندم کا آدھا صاع یا کھجور یا جو کا ایک صاع صدقہ کرے، اور چاہے تو گندم کے ہر آدھے صاع کے بدلے ایک دن اور جو کے ہر صاع کے بدلے ایک دن روزہ رکھے؛ پس اگر کھانے میں سے آدھے صاع سے کم بچے تو اسے اختیار ہے: چاہے تو اسے صدقہ کر دے اور چاہے تو اس کی طرف سے پورا ایک دن روزہ رکھے"],["m","وَقَالَ مُحَمَّدٌ: يَجِبُ فِي الصَّيْدِ النَّظِيرُ فِيمَا لَهُ نَظِيرٌ فَفِي الظَّبْيِ شَاةٌ وَفِي الضَّبُعِ شَاةٌ وَفِي الْأَرْنَبِ عَنَاقٌ وَفِي النَّعَامَةِ بَدَنَةٌ وَفِي الْيَرْبُوعِ جَفْرَةٌ",null,"اور امام محمد نے فرمایا: جس شکار کی کوئی نظیر ہو اس میں نظیر واجب ہے؛ پس ہرن میں بکری، لکڑبگھے میں بکری، خرگوش میں عناق (بکری کا بچہ)، شتر مرغ میں اونٹ اور یربوع میں جفرہ ہے"],["m","وَمَنْ جَرَحَ صَيْدًا أَوْ نَتَفَ شَعْرَهُ أَوْ قَطَعَ عُضْوًا مِنْهُ ضَمِنَ مَا نَقَصَهُ وَإِنْ نَتَفَ رِيشَ طَائِرٍ أَوْ قَطَعَ قَوَائِمَ صَيْدٍ فَخَرَجَ مِنْ حَيِّزِ الِامْتِنَاعِ فَعَلَيْهِ قِيمَتُهُ كَامِلَةً",null,"اور جس نے کسی شکار کو زخمی کیا یا اس کے بال نوچے یا اس کا کوئی عضو کاٹ دیا تو اس نقصان کا ضامن ہے جو اس سے ہوا؛ اور اگر کسی پرندے کے پر نوچے یا شکار کی ٹانگیں کاٹ دیں اور وہ بچاؤ کی حالت سے نکل گیا تو اس پر اس کی پوری قیمت ہے"],["m","وَمَنْ كَسَرَ بَيْضَ صَيْدٍ فَعَلَيْهِ قِيمَتُهُ فَإِنْ خَرَجَ مِنَ الْبَيْضِ فَرْخٌ مَيِّتٌ فَعَلَيْهِ قِيمَتُهُ حَيًّا",null,"اور جس نے شکار کا انڈا توڑا اس پر اس کی قیمت ہے؛ پس اگر انڈے سے مردہ بچہ نکلے تو اس پر اس کی زندہ ہونے کی قیمت ہے"],["m","وَلَيْسَ فِي قَتْلِ الْغُرَابِ وَالْحِدَأَةِ وَالذِّئْبِ وَالْحَيَّةِ وَالْعَقْرَبِ وَالْفَأْرَةِ جَزَاءٌ",null,"اور کوے، چیل، بھیڑیے، سانپ، بچھو اور چوہے کو مارنے میں جزا نہیں"],["m","وَلَيْسَ فِي قَتْلِ الْبَعُوضِ وَالْبَرَاغِيثِ وَالْقُرَادِ شَيْءٌ",null,"اور مچھروں، پسوؤں اور چیچڑیوں کو مارنے میں کچھ نہیں"],["m","وَمَنْ قَتَلَ قَمْلَةً تَصَدَّقَ بِمَا شَاءَ وَمَنْ قَتَلَ جَرَادَةً تَصَدَّقَ بِمَا شَاءَ وَتَمْرَةٌ خَيْرٌ مِنْ جَرَادَةٍ",null,"اور جس نے جوں ماری وہ جو چاہے صدقہ کر دے؛ اور جس نے ٹڈی ماری وہ جو چاہے صدقہ کر دے، اور ایک کھجور ٹڈی سے بہتر ہے"],["m","وَمَنْ قَتَلَ مَا لَا يُؤْكَلُ لَحْمُهُ مِنَ الصَّيْدِ كَالسِّبَاعِ وَنَحْوِهَا فَعَلَيْهِ الْجَزَاءُ وَلَا يُتَجَاوَزُ بِقِيمَتِهَا شَاةٌ",null,"اور جس نے ایسا شکار مارا جس کا گوشت نہیں کھایا جاتا، جیسے درندے اور ان جیسے، تو اس پر جزا ہے مگر اس کی قیمت بکری سے تجاوز نہ کرے"],["m","وَإِنْ صَالَ السَّبُعُ عَلَى مُحْرِمٍ فَقَتَلَهُ فَلَا شَيْءَ عَلَيْهِ",null,"اور اگر درندہ محرم پر حملہ کرے اور وہ اسے مار دے تو اس پر کچھ نہیں"],["m","وَإِنِ اضْطُرَّ الْمُحْرِمُ إِلَى أَكْلِ لَحْمِ الصَّيْدِ فَقَتَلَهُ فَعَلَيْهِ الْجَزَاءُ",null,"اور اگر محرم شکار کا گوشت کھانے پر مجبور ہو جائے اور اسے مار دے تو اس پر جزا ہے"],["m","وَلَا بَأْسَ أَنْ يَذْبَحَ الْمُحْرِمُ الشَّاةَ وَالْبَقَرَةَ وَالْبَعِيرَ وَالدَّجَاجَ وَالْبَطَّ الْكِسْكِرِيَّ وَإِنْ قَتَلَ حَمَامًا مُسَرْوَلًا أَوْ ظَبْيًا مُسْتَأْنَسًا فَعَلَيْهِ الْجَزَاءُ",null,"اور محرم کے لیے بکری، گائے، اونٹ، مرغی اور پالتو (کسکری) بطخ ذبح کرنے میں کوئی حرج نہیں؛ اور اگر پاؤں میں پر والا کبوتر (مُسَرْوَل) یا مانوس ہرن مارا تو اس پر جزا ہے"],["m","وَإِنْ ذَبَحَ الْمُحْرِمُ صَيْدًا فَذَبِيحَتُهُ مَيْتَةٌ لَا يَحِلُّ أَكْلُهَا وَلَا بَأْسَ أَنْ يَأْكُلَ الْمُحْرِمُ لَحْمَ صَيْدٍ اصْطَادَهُ حَلَالٌ أَوْ ذَبَحَهُ إِذَا لَمْ يَدُلَّهُ الْمُحْرِمُ عَلَيْهِ وَلَا أَمَرَهُ بِصَيْدِهِ",null,"اور اگر محرم نے شکار ذبح کیا تو اس کا ذبیحہ مردار ہے جس کا کھانا حلال نہیں؛ اور محرم کے لیے ایسے شکار کا گوشت کھانے میں کوئی حرج نہیں جو کسی حلال (غیر محرم) نے شکار کیا یا ذبح کیا ہو، بشرطیکہ محرم نے اس کی رہنمائی نہ کی ہو اور نہ اسے شکار کرنے کا حکم دیا ہو"],["m","وَفِي صَيْدِ الْحَرَمِ إِذَا ذَبَحَهُ الْحَلَالُ فَعَلَيْهِ الْجَزَاءُ وَإِنْ قَطَعَ حَشِيشَ الْحَرَمِ أَوْ شَجَرَهُ الَّذِي لَيْسَ بِمَمْلُوكٍ وَلَا هُوَ مِمَّا يُنْبِتُهُ النَّاسُ فَعَلَيْهِ قِيمَتُهُ",null,"اور حرم کے شکار میں، جب حلال (غیر محرم) اسے ذبح کرے، تو اس پر جزا ہے؛ اور اگر حرم کی گھاس یا اس کا وہ درخت کاٹا جو نہ کسی کی ملکیت ہو اور نہ ان میں سے ہو جنہیں لوگ اگاتے ہیں تو اس پر اس کی قیمت ہے"],["f","أَحْكَامٌ مُتَفَرِّقَةٌ",null,"متفرق احکام"],["m","وَكُلُّ شَيْءٍ فَعَلَهُ الْقَارِنُ مِمَّا ذَكَرْنَا أَنَّ فِيهِ عَلَى الْمُفْرِدِ دَمًا فَعَلَيْهِ دَمَانِ: دَمٌ لِحَجَّتِهِ وَدَمٌ لِعُمْرَتِهِ إِلَّا أَنْ يَتَجَاوَزَ الْمِيقَاتَ مِنْ غَيْرِ إِحْرَامٍ ثُمَّ يُحْرِمَ بِالْعُمْرَةِ وَالْحَجِّ فَيَلْزَمَهُ دَمٌ وَاحِدٌ",null,"اور ہر وہ چیز جو قارن کرے اور جس کے بارے میں ہم نے ذکر کیا کہ مفرد پر اس میں دم ہے تو قارن پر دو دم ہیں: ایک اس کے حج کا دم اور ایک اس کے عمرے کا دم؛ مگر یہ کہ وہ بغیر احرام کے میقات سے آگے نکل جائے پھر عمرے اور حج کا احرام باندھے تو اس پر ایک ہی دم لازم ہے"],["m","وَإِذَا اشْتَرَكَ الْمُحْرِمَانِ فِي قَتْلِ صَيْدٍ فَعَلَى كُلِّ وَاحِدٍ مِنْهُمَا الْجَزَاءُ كَامِلًا وَإِذَا اشْتَرَكَ الْحَلَالَانِ فِي قَتْلِ صَيْدِ الْحَرَمِ فَعَلَيْهِمَا جَزَاءٌ وَاحِدٌ",null,"اور جب دو محرم کسی شکار کو مارنے میں شریک ہوں تو ان میں سے ہر ایک پر پوری جزا ہے؛ اور جب دو حلال آدمی حرم کا شکار مارنے میں شریک ہوں تو ان دونوں پر ایک ہی جزا ہے"],["m","وَإِذَا بَاعَ الْمُحْرِمُ صَيْدًا أَوِ ابْتَاعَهُ فَالْبَيْعُ بَاطِلٌ",null,"اور جب محرم شکار بیچے یا خریدے تو بیع باطل ہے"]]},{"t":"بَابُ الْإِحْصَارِ","tu":"احصار کا باب","ed":false,"items":[["m","إِذَا أُحْصِرَ الْمُحْرِمُ بِعَدُوٍّ أَوْ أَصَابَهُ مَرَضٌ مَنَعَهُ مِنَ الْمُضِيِّ جَازَ لَهُ التَّحَلُّلُ وَقِيلَ لَهُ: ابْعَثْ شَاةً تُذْبَحُ فِي الْحَرَمِ وَوَاعِدْ مَنْ يَحْمِلُهَا يَوْمًا بِعَيْنِهِ يَذْبَحُهَا فِيهِ ثُمَّ تَحَلَّلْ وَإِنْ كَانَ قَارِنًا بَعَثَ بِدَمَيْنِ",null,"جب محرم کو دشمن روک لے یا اسے ایسی بیماری لاحق ہو جائے جو اسے آگے بڑھنے سے روک دے تو اس کے لیے حلال ہو جانا جائز ہے؛ اور اس سے کہا جائے گا: ایک بکری بھیج جو حرم میں ذبح کی جائے اور اسے لے جانے والے سے ایک متعین دن کا وعدہ کر لے جس میں وہ اسے ذبح کرے، پھر حلال ہو جا؛ اور اگر قارن ہو تو دو دم بھیجے"],["m","وَلَا يَجُوزُ ذَبْحُ دَمِ الْإِحْصَارِ إِلَّا فِي الْحَرَمِ وَيَجُوزُ ذَبْحُهُ قَبْلَ يَوْمِ النَّحْرِ عِنْدَ أَبِي حَنِيفَةَ وَقَالَ أَبُو يُوسُفَ وَمُحَمَّدٌ رَحِمَهُمَا اللهُ: لَا يَجُوزُ الذَّبْحُ لِلْمُحْصَرِ بِالْحَجِّ إِلَّا فِي يَوْمِ النَّحْرِ",null,"اور احصار کا دم حرم کے سوا ذبح کرنا جائز نہیں؛ اور امام ابو حنیفہ کے نزدیک اسے یومِ نحر سے پہلے ذبح کرنا جائز ہے؛ اور امام ابو یوسف اور امام محمد رحمہما اللہ نے فرمایا: حج میں محصر کے لیے یومِ نحر کے سوا ذبح جائز نہیں"],["m","وَيَجُوزُ لِلْمُحْصَرِ بِالْعُمْرَةِ أَنْ يَذْبَحَ مَتَى شَاءَ",null,"اور عمرے میں محصر کے لیے جائز ہے کہ جب چاہے ذبح کرے"],["m","وَالْمُحْصَرُ بِالْحَجِّ إِذَا تَحَلَّلَ فَعَلَيْهِ حَجَّةٌ وَعُمْرَةٌ وَعَلَى الْمُحْصَرِ بِالْعُمْرَةِ الْقَضَاءُ وَعَلَى الْقَارِنِ حَجَّةٌ وَعُمْرَتَانِ",null,"اور حج میں محصر جب حلال ہو جائے تو اس پر ایک حج اور ایک عمرہ ہے؛ اور عمرے میں محصر پر قضا ہے؛ اور قارن پر ایک حج اور دو عمرے ہیں"],["m","وَإِذَا بَعَثَ الْمُحْصَرُ هَدْيًا وَوَاعَدَهُمْ أَنْ يَذْبَحُوهُ فِي يَوْمٍ بِعَيْنِهِ ثُمَّ زَالَ الْإِحْصَارُ فَإِنْ قَدَرَ عَلَى إِدْرَاكِ الْهَدْيِ وَالْحَجِّ لَمْ يَجُزْ لَهُ التَّحَلُّلُ وَلَزِمَهُ الْمُضِيُّ وَإِنْ قَدَرَ عَلَى إِدْرَاكِ الْهَدْيِ دُونَ الْحَجِّ تَحَلَّلَ وَإِنْ قَدَرَ عَلَى إِدْرَاكِ الْحَجِّ دُونَ الْهَدْيِ جَازَ لَهُ التَّحَلُّلُ اسْتِحْسَانًا",null,"اور جب محصر نے ہدی بھیجی اور انہیں ایک متعین دن ذبح کرنے کا وعدہ دیا، پھر احصار ختم ہو گیا، تو اگر وہ ہدی اور حج دونوں کو پا سکتا ہو تو اس کے لیے حلال ہونا جائز نہیں اور اس پر آگے بڑھنا لازم ہے؛ اور اگر ہدی کو پا سکتا ہو مگر حج کو نہیں تو حلال ہو جائے؛ اور اگر حج کو پا سکتا ہو مگر ہدی کو نہیں تو استحساناً اس کے لیے حلال ہونا جائز ہے"],["m","وَمَنْ أُحْصِرَ بِمَكَّةَ وَهُوَ مَمْنُوعٌ مِنَ الْوُقُوفِ وَالطَّوَافِ كَانَ مُحْصَرًا وَإِنْ قَدَرَ عَلَى أَحَدِهِمَا فَلَيْسَ بِمُحْصَرٍ",null,"اور جو مکہ میں روک دیا گیا اور اسے وقوف اور طواف دونوں سے روکا گیا ہو وہ محصر ہے؛ اور اگر ان میں سے کسی ایک پر قادر ہو تو محصر نہیں"]]},{"t":"بَابُ الْفَوَاتِ","tu":"فوات کا باب","ed":false,"items":[["m","وَمَنْ أَحْرَمَ بِالْحَجِّ فَفَاتَهُ الْوُقُوفُ بِعَرَفَةَ حَتَّى طَلَعَ الْفَجْرُ مِنْ يَوْمِ النَّحْرِ فَقَدْ فَاتَهُ الْحَجُّ وَعَلَيْهِ أَنْ يَطُوفَ وَيَسْعَى وَيَتَحَلَّلَ وَيَقْضِيَ الْحَجَّ مِنْ قَابِلٍ وَلَا دَمَ عَلَيْهِ",null,"اور جس نے حج کا احرام باندھا اور اس سے عرفہ کا وقوف فوت ہو گیا یہاں تک کہ یومِ نحر کی فجر طلوع ہو گئی تو اس کا حج فوت ہو گیا؛ اس پر لازم ہے کہ طواف اور سعی کرے، حلال ہو جائے اور آئندہ سال حج کی قضا کرے، اور اس پر دم نہیں"],["m","وَالْعُمْرَةُ لَا تَفُوتُ وَهِيَ جَائِزَةٌ فِي جَمِيعِ السَّنَةِ إِلَّا خَمْسَةَ أَيَّامٍ يُكْرَهُ فِعْلُهَا فِيهَا: يَوْمَ عَرَفَةَ وَيَوْمَ النَّحْرِ وَأَيَّامَ التَّشْرِيقِ",null,"اور عمرہ فوت نہیں ہوتا اور سال بھر جائز ہے سوائے پانچ دنوں کے جن میں اس کا کرنا مکروہ ہے: یومِ عرفہ، یومِ نحر اور ایامِ تشریق"],["m","وَالْعُمْرَةُ سُنَّةٌ وَهِيَ: الْإِحْرَامُ وَالطَّوَافُ وَالسَّعْيُ وَالْحَلْقُ أَوِ التَّقْصِيرُ",null,"اور عمرہ سنت ہے، اور وہ احرام، طواف، سعی اور حلق یا تقصیر ہے"]]},{"t":"بَابُ الْهَدْيِ","tu":"ہدی کا باب","ed":false,"items":[["m","الْهَدْيُ: أَدْنَاهُ شَاةٌ",null,"ہدی: اس کا کم سے کم درجہ ایک بکری ہے"],["m","وَهُوَ مِنْ ثَلَاثَةِ أَنْوَاعٍ: الْإِبِلِ وَالْبَقَرِ وَالْغَنَمِ يُجْزِئُ فِي ذَلِكَ الثَّنِيُّ فَصَاعِدًا إِلَّا مِنَ الضَّأْنِ فَإِنَّ الْجَذَعَ مِنْهُ يُجْزِئُ",null,"اور وہ تین قسم کی ہے: اونٹ، گائے اور بکری؛ ان میں ثنی (دو دانتا) اور اس سے اوپر کافی ہے، سوائے بھیڑ کے کہ اس میں جذع (چھ ماہ کا بچہ) بھی کافی ہے"],["m","وَلَا يَجُوزُ فِي الْهَدْيِ مَقْطُوعُ الْأُذُنِ أَوْ أَكْثَرِهَا وَلَا مَقْطُوعُ الذَّنَبِ وَلَا الْيَدِ وَلَا الرِّجْلِ وَلَا الذَّاهِبَةُ الْعَيْنِ وَلَا الْعَجْفَاءُ وَلَا الْعَرْجَاءُ الَّتِي لَا تَمْشِي إِلَى الْمَنْسَكِ",null,"اور ہدی میں وہ جانور جائز نہیں جس کا کان یا اس کا اکثر حصہ کٹا ہو، نہ دم کٹا، نہ ہاتھ (اگلی ٹانگ) یا پاؤں کٹا، نہ وہ جس کی آنکھ جاتی رہی ہو، نہ نہایت دبلا، اور نہ وہ لنگڑا جو قربان گاہ تک چل کر نہ جا سکے"],["m","وَالشَّاةُ جَائِزَةٌ فِي كُلِّ شَيْءٍ إِلَّا فِي مَوْضِعَيْنِ: مَنْ طَافَ طَوَافَ الزِّيَارَةِ جُنُبًا وَمَنْ جَامَعَ بَعْدَ الْوُقُوفِ بِعَرَفَةَ فَإِنَّهُ لَا يَجُوزُ إِلَّا بَدَنَةٌ",null,"اور بکری ہر چیز میں جائز ہے سوائے دو مواضع کے: جس نے جنابت کی حالت میں طوافِ زیارت کیا اور جس نے عرفہ کے وقوف کے بعد جماع کیا؛ ان میں اونٹ کے سوا کچھ جائز نہیں"],["m","وَالْبَدَنَةُ وَالْبَقَرَةُ تُجْزِئُ كُلُّ وَاحِدَةٍ مِنْهُمَا عَنْ سَبْعَةٍ إِذَا كَانَ كُلُّ وَاحِدٍ مِنَ الشُّرَكَاءِ يُرِيدُ الْقُرْبَةَ فَإِنْ أَرَادَ أَحَدُهُمْ بِنَصِيبِهِ اللَّحْمَ لَمْ يُجْزِئْ عَنِ الْبَاقِينَ",null,"اور اونٹ اور گائے میں سے ہر ایک سات (آدمیوں) کی طرف سے کافی ہے بشرطیکہ شرکاء میں سے ہر ایک قربت کا ارادہ رکھتا ہو؛ پس اگر ان میں سے کسی نے اپنے حصے سے گوشت کا ارادہ کیا تو باقی کی طرف سے کافی نہیں ہوگا"],["m","وَيَجُوزُ الْأَكْلُ مِنْ هَدْيِ التَّطَوُّعِ وَالْمُتْعَةِ وَالْقِرَانِ وَلَا يَجُوزُ الْأَكْلُ مِنْ بَقِيَّةِ الْهَدَايَا",null,"اور نفل کی ہدی، تمتع اور قران کی ہدی سے کھانا جائز ہے، اور باقی ہدیوں سے کھانا جائز نہیں"],["m","وَلَا يَجُوزُ ذَبْحُ هَدْيِ التَّطَوُّعِ وَالْمُتْعَةِ وَالْقِرَانِ إِلَّا فِي يَوْمِ النَّحْرِ وَيَجُوزُ ذَبْحُ بَقِيَّةِ الْهَدَايَا أَيَّ وَقْتٍ شَاءَ وَلَا يَجُوزُ ذَبْحُ الْهَدَايَا إِلَّا فِي الْحَرَمِ وَيَجُوزُ أَنْ يُتَصَدَّقَ بِهَا عَلَى مَسَاكِينِ الْحَرَمِ وَغَيْرِهِمْ وَلَا يَجِبُ التَّعْرِيفُ بِالْهَدَايَا",null,"اور نفل، تمتع اور قران کی ہدی کا ذبح یومِ نحر کے سوا جائز نہیں؛ اور باقی ہدیوں کا ذبح جب چاہے جائز ہے؛ اور ہدیوں کا ذبح حرم کے سوا جائز نہیں؛ اور انہیں حرم کے مسکینوں اور ان کے علاوہ پر صدقہ کرنا جائز ہے؛ اور ہدیوں کی تعریف (عرفہ لے جانا) واجب نہیں"],["m","وَالْأَفْضَلُ فِي الْبُدْنِ النَّحْرُ وَفِي الْبَقَرِ وَالْغَنَمِ الذَّبْحُ وَالْأَوْلَى أَنْ يَتَوَلَّى الْإِنْسَانُ ذَبْحَهَا بِنَفْسِهِ إِذَا كَانَ يُحْسِنُ ذَلِكَ وَيَتَصَدَّقُ بِجِلَالِهَا وَخِطَامِهَا وَلَا يُعْطِي أُجْرَةَ الْجَزَّارِ مِنْهَا",null,"اور اونٹوں میں نحر افضل ہے اور گائے اور بکری میں ذبح؛ اور بہتر یہ ہے کہ آدمی خود انہیں ذبح کرے جب اچھی طرح ذبح کر سکتا ہو؛ اور ان کی جُل (چادریں) اور مہار صدقہ کر دے اور قصاب کی اجرت ان میں سے نہ دے"],["m","وَمَنْ سَاقَ بَدَنَةً فَاضْطُرَّ إِلَى رُكُوبِهَا رَكِبَهَا وَإِنِ اسْتَغْنَى عَنْ ذَلِكَ لَمْ يَرْكَبْهَا وَإِنْ كَانَ لَهَا لَبَنٌ لَمْ يَحْلُبْهَا وَيَنْضَحُ ضَرْعَهَا بِالْمَاءِ الْبَارِدِ حَتَّى يَنْقَطِعَ اللَّبَنُ",null,"اور جو اونٹ ہانکے پھر اس پر سوار ہونے پر مجبور ہو جائے تو سوار ہو جائے؛ اور اگر اس سے بے نیاز ہو تو سوار نہ ہو؛ اور اگر اس میں دودھ ہو تو اسے نہ دوہے بلکہ اس کے تھن پر ٹھنڈا پانی چھڑکے یہاں تک کہ دودھ رک جائے"],["m","وَمَنْ سَاقَ هَدْيًا فَعَطِبَ فَإِنْ كَانَ تَطَوُّعًا فَلَيْسَ عَلَيْهِ غَيْرُهُ وَإِنْ كَانَ عَنْ وَاجِبٍ فَعَلَيْهِ أَنْ يُقِيمَ غَيْرَهُ مَقَامَهُ وَإِنْ أَصَابَهُ عَيْبٌ كَبِيرٌ أَقَامَ غَيْرَهُ مَقَامَهُ وَصَنَعَ بِالْمَعِيبِ مَا شَاءَ",null,"اور جس نے ہدی ہانکی پھر وہ ہلاک ہونے کے قریب ہو گئی، تو اگر وہ نفل تھی تو اس پر اس کے سوا کچھ نہیں؛ اور اگر واجب کی طرف سے تھی تو اس پر لازم ہے کہ اس کی جگہ دوسری ہدی دے؛ اور اگر اسے کوئی بڑا عیب لگ جائے تو اس کی جگہ دوسری دے اور عیب دار کے ساتھ جو چاہے کرے"],["m","وَإِذَا عَطِبَتِ الْبَدَنَةُ فِي الطَّرِيقِ فَإِنْ كَانَ تَطَوُّعًا نَحَرَهَا وَصَبَغَ نَعْلَهَا بِدَمِهَا وَضَرَبَ بِهَا صَفْحَتَهَا وَلَا يَأْكُلُ مِنْهَا هُوَ وَلَا غَيْرُهُ مِنَ الْأَغْنِيَاءِ وَإِنْ كَانَتْ وَاجِبَةً أَقَامَ غَيْرَهَا مَقَامَهَا وَصَنَعَ بِهَا مَا شَاءَ",null,"اور جب اونٹ راستے میں ہلاکت کے قریب ہو جائے تو اگر نفل ہو تو اسے نحر کرے، اس کے جوتے کو اس کے خون سے رنگ دے اور اس کے پہلو پر مار دے؛ اور اس سے نہ وہ خود کھائے اور نہ اس کے سوا مالدار لوگ؛ اور اگر واجب ہو تو اس کی جگہ دوسرا دے اور اس کے ساتھ جو چاہے کرے"],["m","وَيُقَلَّدُ هَدْيُ التَّطَوُّعِ وَالْمُتْعَةِ وَالْقِرَانِ وَلَا يُقَلَّدُ دَمُ الْإِحْصَارِ وَلَا دَمُ الْجِنَايَاتِ",null,"اور نفل، تمتع اور قران کی ہدی کو قلادہ پہنایا جائے، اور احصار کے دم اور جنایات کے دم کو قلادہ نہ پہنایا جائے"]]}]},{"n":6,"title":"كِتَابُ الْبُيُوعِ","tu":"کتاب البیوع","babs":[{"t":"أَحْكَامُ انْعِقَادِ الْبَيْعِ وَلُزُومِهِ","tu":"بیع کے انعقاد اور لزوم کے احکام","ed":true,"items":[["f","الْإِيجَابُ وَالْقَبُولُ",null,"ایجاب و قبول"],["m","الْبَيْعُ: يَنْعَقِدُ بِالْإِيجَابِ وَالْقَبُولِ إِذَا كَانَا بِلَفْظِ الْمَاضِي",null,"بیع ایجاب و قبول سے منعقد ہوتی ہے بشرطیکہ دونوں ماضی کے لفظ سے ہوں"],["m","وَإِذَا أَوْجَبَ أَحَدُ الْمُتَعَاقِدَيْنِ الْبَيْعَ فَالْآخَرُ بِالْخِيَارِ: إِنْ شَاءَ قَبِلَ فِي الْمَجْلِسِ وَإِنْ شَاءَ رَدَّهُ",null,"جب عقد کرنے والوں میں سے ایک بیع کا ایجاب کرے تو دوسرے کو اختیار ہے: چاہے تو مجلس میں قبول کر لے اور چاہے تو رد کر دے"],["m","وَأَيُّهُمَا قَامَ مِنَ الْمَجْلِسِ قَبْلَ الْقَبُولِ بَطَلَ الْإِيجَابُ",null,"اور ان میں سے جو بھی قبول سے پہلے مجلس سے اٹھ گیا تو ایجاب باطل ہو گیا"],["m","وَإِذَا حَصَلَ الْإِيجَابُ وَالْقَبُولُ لَزِمَ الْبَيْعُ وَلَا خِيَارَ لِوَاحِدٍ مِنْهُمَا إِلَّا مِنْ عَيْبٍ أَوْ عَدَمِ رُؤْيَةٍ",null,"جب ایجاب و قبول ہو گیا تو بیع لازم ہو گئی، اور کسی کو اختیار نہیں مگر عیب یا نہ دیکھنے کی وجہ سے"],["f","الثَّمَنُ وَالْعِوَضُ",null,"ثمن اور عوض"],["m","وَالْأَعْوَاضُ الْمُشَارُ إِلَيْهَا لَا يُحْتَاجُ إِلَى مَعْرِفَةِ مَقَادِيرِهَا فِي جَوَازِ الْبَيْعِ",null,"جن عوضوں کی طرف اشارہ کر دیا جائے ان کی مقداریں جاننا جواز بیع کے لیے ضروری نہیں"],["m","وَالْأَثْمَانُ الْمُطْلَقَةُ لَا تَصِحُّ إِلَّا أَنْ تَكُونَ مَعْرُوفَةَ الْقَدْرِ وَالصِّفَةِ",null,"اور مطلق (غیر متعین) ثمن اسی وقت صحیح ہیں جب ان کی مقدار اور صفت معلوم ہو"],["m","وَيَجُوزُ الْبَيْعُ بِثَمَنٍ حَالٍّ وَمُؤَجَّلٍ إِذَا كَانَ الْأَجَلُ مَعْلُومًا",null,"نقد اور ادھار دونوں ثمن سے بیع جائز ہے بشرطیکہ مدت معلوم ہو"],["m","وَمَنْ أَطْلَقَ الثَّمَنَ فِي الْبَيْعِ كَانَ عَلَى غَالِبِ نَقْدِ الْبَلَدِ",null,"جس نے بیع میں ثمن مطلق رکھا تو وہ شہر کے غالب سکے پر ہو گا"],["m","فَإِنْ كَانَتِ النُّقُودُ مُخْتَلِفَةً فَالْبَيْعُ فَاسِدٌ إِلَّا أَنْ يُبَيِّنَ أَحَدَهَا",null,"اگر سکے مختلف ہوں تو بیع فاسد ہے الا یہ کہ ان میں سے ایک کو متعین کر دے"],["f","بَيْعُ الْمَكِيلِ وَالْمَذْرُوعِ",null,"ناپ تول اور گز کی بیع"],["m","وَيَجُوزُ بَيْعُ الطَّعَامِ وَالْحُبُوبِ مُكَايَلَةً وَمُجَازَفَةً وَبِإِنَاءٍ بِعَيْنِهِ لَا يُعْرَفُ مِقْدَارُهُ وَبِوَزْنِ حَجَرٍ بِعَيْنِهِ لَا يُعْرَفُ مِقْدَارُهُ",null,"غلہ اور اناج کی بیع ناپ کر بھی جائز ہے، اندازے سے بھی، اور ایسے متعین برتن سے بھی جس کی مقدار معلوم نہ ہو، اور ایسے متعین پتھر کے وزن سے بھی جس کا وزن معلوم نہ ہو"],["m","وَمَنْ بَاعَ صُبْرَةَ طَعَامٍ كُلَّ قَفِيزٍ بِدِرْهَمٍ جَازَ الْبَيْعُ فِي قَفِيزٍ وَاحِدٍ عِنْدَ أَبِي حَنِيفَةَ إِلَّا أَنْ يُسَمِّيَ جُمْلَةَ قُفْزَانِهَا",null,"جس نے غلے کا ڈھیر ہر قفیز ایک درہم کے حساب سے بیچا تو امام ابوحنیفہؒ کے نزدیک صرف ایک قفیز میں بیع جائز ہے، الا یہ کہ وہ کل قفیزوں کی تعداد بتا دے"],["m","وَمَنْ بَاعَ قَطِيعَ غَنَمٍ كُلَّ شَاةٍ بِدِرْهَمٍ فَالْبَيْعُ فَاسِدٌ فِي جَمِيعِهَا",null,"جس نے بکریوں کا ریوڑ ہر بکری ایک درہم کے حساب سے بیچا تو سب میں بیع فاسد ہے"],["m","وَكَذَلِكَ مَنْ بَاعَ ثَوْبًا مُذَارَعَةً كُلَّ ذِرَاعٍ بِدِرْهَمٍ وَلَمْ يُسَمِّ جُمْلَةَ الذُّرْعَانِ",null,"اسی طرح جس نے کپڑا گز کے حساب سے ہر گز ایک درہم پر بیچا اور کل گزوں کی تعداد نہ بتائی (تو بیع فاسد ہے)"],["m","وَمَنِ ابْتَاعَ صُبْرَةً عَلَى أَنَّهَا قَفِيزٌ بِمِائَةِ دِرْهَمٍ فَوَجَدَهَا أَقَلَّ كَانَ الْمُشْتَرِي بِالْخِيَارِ: إِنْ شَاءَ أَخَذَ الْمَوْجُودَ بِحِصَّتِهِ مِنَ الثَّمَنِ وَإِنْ شَاءَ فَسَخَ الْبَيْعَ",null,"جس نے ڈھیر اس شرط پر خریدا کہ وہ ایک قفیز ہے سو درہم کا، پھر اسے کم پایا تو خریدار کو اختیار ہے: چاہے تو موجود مقدار کو اس کے حصے کے ثمن کے ساتھ لے لے اور چاہے تو بیع فسخ کر دے"],["m","وَإِنْ وَجَدَهَا أَكْثَرَ فَالزِّيَادَةُ لِلْبَائِعِ",null,"اور اگر زیادہ پایا تو زیادتی بیچنے والے کی ہے"],["m","وَمَنِ اشْتَرَى ثَوْبًا عَلَى أَنَّهُ عَشَرَةُ أَذْرُعٍ بِعَشَرَةِ دَرَاهِمَ أَوْ أَرْضًا ع ْزُونَاتِ وَالْمَعْدُودَاتِ الَّتِي لَا تَتَفَاوَتُ كَالْجَوْزِ وَالْبَيْضِ وَفِي الْمَذْرُوعَاتِ",null,"سلم ناپی، تولی اور گنی جانے والی ان چیزوں میں جائز ہے جن میں تفاوت نہیں ہوتا، جیسے اخروٹ اور انڈے، اور گز سے ناپی جانے والی چیزوں میں بھی"],["m","وَلَا يَجُوزُ السَّلَمُ فِي الْحَيَوَانِ وَلَا فِي أَطْرَافِهِ وَلَا فِي الْجُلُودِ عَدَدًا وَلَا فِي الْحَطَبِ حُزَمًا وَلَا فِي الرَّطْبَةِ جُرَزًا",null,"حیوان، اس کے اطراف (سری پائے وغیرہ)، گنتی کے حساب سے کھالوں، گٹھوں کے حساب سے لکڑی اور بنڈلوں کے حساب سے تر چارے میں سلم جائز نہیں"],["f","شُرُوطُ السَّلَمِ",null,"سلم کی شرائط"],["m","وَلَا يَجُوزُ السَّلَمُ حَتَّى يَكُونَ الْمُسْلَمُ فِيهِ مَوْجُودًا مِنْ حِينِ الْعَقْدِ إِلَى حِينِ الْمَحِلِّ",null,"سلم اس وقت تک جائز نہیں جب تک مسلم فیہ عقد کے وقت سے لے کر ادائیگی کے وقت تک موجود نہ ہو"],["m","وَلَا يَصِحُّ السَّلَمُ إِلَّا مُؤَجَّلًا وَلَا يَجُوزُ إِلَّا بِأَجَلٍ مَعْلُومٍ",null,"سلم صرف ادھار (مدت کے ساتھ) صحیح ہے اور معلوم مدت کے بغیر جائز نہیں"],["m","وَلَا يَجُوزُ السَّلَمُ بِمِكْيَالِ رَجُلٍ بِعَيْنِهِ وَلَا بِذِرَاعِ رَجُلٍ بِعَيْنِهِ",null,"کسی خاص آدمی کے پیمانے یا اس کے گز سے سلم جائز نہیں"],["m","وَلَا فِي طَعَامِ قَرْيَةٍ بِعَيْنِهَا وَلَا ثَمَرَةِ نَخْلَةٍ بِعَيْنِهَا",null,"نہ کسی معین بستی کے غلے میں اور نہ کسی معین کھجور کے پھل میں"],["m","وَلَا يَصِحُّ السَّلَمُ عِنْدَ أَبِي حَنِيفَةَ إِلَّا بِسَبْعِ شَرَائِطَ تُذْكَرُ فِي الْعَقْدِ: جِنْسٍ مَعْلُومٍ وَنَوْعٍ مَعْلُومٍ وَصِفَةٍ مَعْلُومَةٍ وَأَجَلٍ مَعْلُومٍ وَمَعْرِفَةِ مِقْدَارِ رَأْسِ الْمَالِ إِذَا كَانَ مِمَّا يَتَعَلَّقُ الْعَقْدُ عَلَى قَدْرِهِ كَالْمَكِيلِ وَالْمَوْزُونِ وَالْمَعْدُودِ وَتَسْمِيَةِ الْمَكَانِ الَّذِي يُوَافِيهِ فِيهِ إِذَا كَانَ لَهُ حَمْلٌ وَمُؤْنَةٌ",null,"امام ابوحنیفہؒ کے نزدیک سلم سات شرطوں کے بغیر صحیح نہیں جو عقد میں ذکر کی جائیں: معلوم جنس، معلوم نوع، معلوم صفت، معلوم مدت، رأس المال کی مقدار کا علم جب وہ ایسی چیز ہو جس پر عقد اس کی مقدار کے ساتھ متعلق ہوتا ہے جیسے ناپی، تولی اور گنی جانے والی چیز، اور اس جگہ کا نام لینا جہاں مسلم فیہ حوالے کرے گا جب اس میں بار برداری اور خرچ ہو"],["m","وَقَالَ أَبُو يُوسُفَ وَمُحَمَّدٌ: لَا يَحْتَاجُ إِلَى تَسْمِيَةِ رَأْسِ الْمَالِ إِذَا كَانَ مُعَيَّنًا وَلَا إِلَى مَكَانِ التَّسْلِيمِ وَيُسَلِّمُهُ فِي مَوْضِعِ الْعَقْدِ",null,"امام ابو یوسفؒ و امام محمدؒ نے فرمایا: رأس المال معین ہو تو اس کی مقدار بتانے کی ضرورت نہیں، اور نہ حوالگی کی جگہ بتانے کی؛ وہ عقد کی جگہ پر حوالے کرے گا"],["m","وَلَا يَصِحُّ السَّلَمُ حَتَّى يَقْبِضَ رَأْسَ الْمَالِ قَبْلَ أَنْ يُفَارِقَهُ",null,"سلم اس وقت تک صحیح نہیں جب تک رأس المال پر (مجلس سے) جدا ہونے سے پہلے قبضہ نہ کر لے"],["m","وَلَا يَجُوزُ التَّصَرُّفُ فِي رَأْسِ الْمَالِ وَلَا فِي الْمُسْلَمِ فِيهِ قَبْلَ الْقَبْضِ",null,"رأس المال اور مسلم فیہ دونوں میں قبضے سے پہلے تصرف جائز نہیں"],["m","وَلَا تَجُوزُ الشَّرِكَةُ وَلَا التَّوْلِيَةُ فِي الْمُسْلَمِ فِيهِ قَبْلَ قَبْضِهِ",null,"مسلم فیہ میں قبضے سے پہلے نہ شرکت جائز ہے اور نہ تولیہ"],["m","وَيَجُوزُ السَّلَمُ فِي الثِّيَابِ إِذَا سَمَّى طُولًا وَعَرْضًا وَرِقْعَةً",null,"کپڑوں میں سلم جائز ہے جب لمبائی، چوڑائی اور باریکی/موٹائی بتا دے"],["m","وَلَا يَجُوزُ السَّلَمُ فِي الْجَوَاهِرِ وَلَا فِي الْخَرَزِ",null,"جواہر اور موتیوں میں سلم جائز نہیں"],["m","وَلَا بَأْسَ بِالسَّلَمِ فِي اللَّبِنِ وَالْآجُرِّ إِذَا سَمَّى مَلْبَنًا مَعْلُومًا",null,"کچی اور پکی اینٹوں میں سلم کرنے میں حرج نہیں جب معلوم سانچہ بتا دے"],["m","وَكُلُّ مَا أَمْكَنَ ضَبْطُ صِفَتِهِ وَمَعْرِفَةُ مِقْدَارِهِ جَازَ السَّلَمُ فِيهِ",null,"ہر وہ چیز جس کی صفت کو ضبط کرنا اور مقدار معلوم کرنا ممکن ہو اس میں سلم جائز ہے"],["m","وَمَا لَا يُمْكِنُ ضَبْطُ صِفَتِهِ وَلَا يُعْرَفُ مِقْدَارُهُ لَا يَجُوزُ السَّلَمُ فِيهِ",null,"اور جس کی صفت ضبط نہ ہو سکے اور مقدار معلوم نہ ہو اس میں سلم جائز نہیں"],["f","مَا يُبَاعُ وَمَا لَا يُبَاعُ",null,"جو بکتا ہے اور جو نہیں بکتا"],["m","وَيَجُوزُ بَيْعُ الْكَلْبِ وَالْفَهْدِ وَالسِّبَاعِ",null,"کتے، چیتے اور درندوں کی بیع جائز ہے"],["m","وَلَا يَجُوزُ بَيْعُ الْخَمْرِ وَالْخِنْزِيرِ",null,"شراب اور خنزیر کی بیع جائز نہیں"],["m","وَلَا يَجُوزُ بَيْعُ دُودِ الْقَزِّ إِلَّا أَنْ يَكُونَ مَعَ الْقَزِّ وَلَا النَّحْلِ إِلَّا مَعَ الْكِوَارَاتِ",null,"ریشم کے کیڑوں کی بیع جائز نہیں الا یہ کہ ریشم کے ساتھ ہو، اور شہد کی مکھیوں کی بھی نہیں الا یہ کہ چھتوں کے ساتھ ہو"],["m","وَأَهْلُ الذِّمَّةِ فِي الْبِيَاعَاتِ كَالْمُسْلِمِينَ إِلَّا فِي الْخَمْرِ وَالْخِنْزِيرِ خَاصَّةً",null,"ذمی بیوع میں مسلمانوں کی طرح ہیں سوائے شراب اور خنزیر کے"],["m","فَإِنَّ عَقْدَهُمْ عَلَى الْخَمْرِ كَعَقْدِ الْمُسْلِمِ عَلَى الْعَصِيرِ وَعَقْدَهُمْ عَلَى الْخِنْزِيرِ كَعَقْدِ الْمُسْلِمِ عَلَى الشَّاةِ",null,"کیونکہ ان کا شراب پر عقد ایسا ہے جیسے مسلمان کا رس پر عقد، اور ان کا خنزیر پر عقد ایسا ہے جیسے مسلمان کا بکری پر عقد"]]},{"t":"بَابُ الصَّرْفِ","tu":"بیعِ صرف کا باب","ed":false,"items":[["m","الصَّرْفُ هُوَ: الْبَيْعُ إِذَا كَانَ كُلُّ وَاحِدٍ مِنَ الْعِوَضَيْنِ مِنْ جِنْسِ الْأَثْمَانِ",null,"صرف وہ بیع ہے جس میں دونوں عوضوں میں سے ہر ایک ثمن کی جنس سے ہو"],["m","فَإِنْ بَاعَ فِضَّةً بِفِضَّةٍ أَوْ ذَهَبًا بِذَهَبٍ لَمْ يَجُزْ إِلَّا مِثْلًا بِمِثْلٍ وَإِنِ اخْتَلَفَا فِي الْجَوْدَةِ وَالصِّيَاغَةِ",null,"اگر چاندی کو چاندی یا سونے کو سونے سے بیچا تو برابر برابر کے سوا جائز نہیں اگرچہ دونوں معیار اور ساخت میں مختلف ہوں"],["m","وَلَا بُدَّ مِنْ قَبْضِ الْعِوَضَيْنِ قَبْلَ الِافْتِرَاقِ",null,"اور جدا ہونے سے پہلے دونوں عوضوں پر قبضہ ضروری ہے"],["m","وَإِذَا بَاعَ الذَّهَبَ بِالْفِضَّةِ جَازَ التَّفَاضُلُ وَوَجَبَ التَّقَابُضُ",null,"جب سونا چاندی کے بدلے بیچا تو کمی بیشی جائز ہے اور باہمی قبضہ واجب ہے"],["m","وَإِنِ افْتَرَقَا فِي الصَّرْفِ قَبْلَ قَبْضِ الْعِوَضَيْنِ أَوْ أَحَدِهِمَا بَطَلَ الْعَقْدُ",null,"اگر دونوں عوضوں یا ان میں سے ایک پر قبضے سے پہلے جدا ہو گئے تو عقد باطل ہو گیا"],["m","وَلَا يَجُوزُ التَّصَرُّفُ فِي ثَمَنِ الصَّرْفِ قَبْلَ قَبْضِهِ",null,"صرف کے ثمن میں قبضے سے پہلے تصرف جائز نہیں"],["m","وَيَجُوزُ بَيْعُ الذَّهَبِ بِالْفِضَّةِ مُجَازَفَةً",null,"سونے کی چاندی کے بدلے اندازے سے بیع جائز ہے"],["m","وَمَنْ بَاعَ سَيْفًا مُحَلًّى بِمِائَةِ دِرْهَمٍ وَحِلْيَتُهُ خَمْسُونَ دِرْهَمًا فَدَفَعَ مِنْ ثَمَنِهِ خَمْسِينَ جَازَ الْبَيْعُ وَكَانَ الْمَقْبُوضُ حِصَّةَ الْفِضَّةِ وَإِنْ لَمْ يُبَيِّنْ ذَلِكَ",null,"جس نے زیور لگی تلوار سو درہم میں بیچی اور اس کا زیور پچاس درہم کا تھا، پھر اس کے ثمن میں سے پچاس درہم دے دیے تو بیع جائز ہے اور قبضہ شدہ رقم چاندی کے حصے کی ہو گی، اگرچہ یہ بیان نہ کرے"],["m","وَكَذَلِكَ إِنْ قَالَ: خُذْ هَذِهِ الْخَمْسِينَ مِنْ ثَمَنِهِمَا",null,"اسی طرح اگر کہے: یہ پچاس دونوں کے ثمن میں سے لے لو"],["m","فَإِنْ لَمْ يَتَقَابَضَا حَتَّى افْتَرَقَا بَطَلَ الْعَقْدُ فِي الْحِلْيَةِ وَالسَّيْفِ إِنْ كَانَ لَا يَتَخَلَّصُ إِلَّا بِضَرَرٍ",null,"اگر قبضہ کیے بغیر جدا ہو گئے تو زیور اور تلوار دونوں میں عقد باطل ہے اگر وہ نقصان کے بغیر جدا نہ ہو سکتا ہو"],["m","وَإِنْ كَانَ يَتَخَلَّصُ بِغَيْرِ ضَرَرٍ جَازَ الْبَيْعُ فِي السَّيْفِ وَبَطَلَ فِي الْحِلْيَةِ",null,"اور اگر بغیر نقصان کے جدا ہو سکتا ہو تو تلوار میں بیع جائز ہے اور زیور میں باطل"],["m","وَمَنْ بَاعَ إِنَاءَ فِضَّةٍ ثُمَّ افْتَرَقَا وَقَدْ قَبَضَ بَعْضَ ثَمَنِهِ بَطَلَ الْعَقْدُ فِيمَا لَمْ يَقْبِضْ وَصَحَّ فِيمَا قَبَضَ وَكَانَ الْإِنَاءُ مُشْتَرَكًا بَيْنَهُمَا",null,"جس نے چاندی کا برتن بیچا، پھر دونوں جدا ہو گئے جبکہ اس کا کچھ ثمن قبضے میں آ چکا تھا تو جس پر قبضہ نہیں ہوا اس میں عقد باطل ہے اور جس پر ہو گیا اس میں صحیح، اور برتن دونوں کے درمیان مشترک ہو گا"],["m","وَإِنِ اسْتُحِقَّ بَعْضُ الْإِنَاءِ كَانَ الْمُشْتَرِي بِالْخِيَارِ: إِنْ شَاءَ أَخَذَ الْبَاقِيَ بِحِصَّتِهِ مِنَ الثَّمَنِ وَإِنْ شَاءَ رَدَّهُ",null,"اور اگر برتن کا کچھ حصہ کسی اور کا نکل آیا تو خریدار کو اختیار ہے: چاہے تو باقی کو اس کے حصے کے ثمن پر لے لے اور چاہے تو واپس کر دے"],["m","وَإِنْ بَاعَ قِطْعَةَ نُقْرَةٍ فَاسْتُحِقَّ بَعْضُهَا أَخَذَ مَا بَقِيَ بِحِصَّتِهِ وَلَا خِيَارَ لَهُ",null,"اور اگر چاندی کا ٹکڑا بیچا اور اس کا کچھ حصہ دوسرے کا نکل آیا تو باقی کو اپنے حصے کے بدلے لے گا اور اسے اختیار نہیں"],["m","وَمَنْ بَاعَ دِرْهَمَيْنِ وَدِينَارًا بِدِينَارَيْنِ وَدِرْهَمٍ جَازَ الْبَيْعُ وَجُعِلَ كُلُّ وَاحِدٍ مِنَ الْجِنْسَيْنِ بِالْجِنْسِ الْآخَرِ",null,"جس نے دو درہم اور ایک دینار کو دو دینار اور ایک درہم کے بدلے بیچا تو بیع جائز ہے اور ہر جنس کو دوسری جنس کے مقابل سمجھا جائے گا"],["m","وَمَنْ بَاعَ أَحَدَ عَشَرَ دِرْهَمًا بِعَشَرَةِ دَرَاهِمَ وَدِينَارٍ جَازَ الْبَيْعُ وَكَانَتِ الْعَشَرَةُ بِمِثْلِهَا وَالدِّينَارُ بِدِرْهَمٍ",null,"جس نے گیارہ درہم دس درہم اور ایک دینار کے بدلے بیچے تو بیع جائز ہے، دس اپنی مثل کے بدلے ہوں گے اور دینار ایک درہم کے بدلے"],["m","وَيَجُوزُ بَيْعُ دِرْهَمَيْنِ صَحِيحَيْنِ وَدِرْهَمٍ غَلَّةٍ بِدِرْهَمٍ صَحِيحٍ وَدِرْهَمَيْنِ غَلَّةٍ",null,"دو کھرے درہم اور ایک کھوٹا درہم، ایک کھرے اور دو کھوٹے درہموں کے بدلے بیچنا جائز ہے"],["m","وَإِذَا كَانَ الْغَالِبُ عَلَى الدَّرَاهِمِ الْفِضَّةَ فَهِيَ فِضَّةٌ وَإِنْ كَانَ الْغَالِبُ عَلَى الدَّنَانِيرِ الذَّهَبَ فَهِيَ ذَهَبٌ",null,"اگر درہموں میں غالب چاندی ہو تو وہ چاندی ہیں اور دیناروں میں غالب سونا ہو تو وہ سونا ہیں"],["m","وَيُعْتَبَرُ فِيهِمَا مِنْ تَحْرِيمِ التَّفَاضُلِ مَا يُعْتَبَرُ فِي الْجِيَادِ",null,"ان میں کمی بیشی کی حرمت وہی معتبر ہے جو خالص (عمدہ) سکوں میں معتبر ہے"],["m","وَإِنْ كَانَ الْغَالِبُ عَلَيْهِمَا الْغِشَّ فَلَيْسَا فِي حُكْمِ الدَّرَاهِمِ وَالدَّنَانِيرِ",null,"اور اگر ان میں غالب کھوٹ ہو تو وہ درہم و دینار کے حکم میں نہیں"],["m","فَإِذَا بِيعَتْ بِجِنْسِهَا مُتَفَاضِلًا جَازَ",null,"پس جب انہیں ان کی جنس کے بدلے کمی بیشی کے ساتھ بیچا جائے تو جائز ہے"],["m","وَإِذَا اشْتَرَى بِهَا سِلْعَةً ثُمَّ كَسَدَتْ وَتَرَكَ النَّاسُ الْمُعَامَلَةَ بِهَا بَطَلَ الْبَيْعُ عِنْدَ أَبِي حَنِيفَةَ",null,"اگر ان سکوں سے سامان خریدا، پھر وہ سکے بند ہو گئے اور لوگوں نے ان سے لین دین چھوڑ دیا تو امام ابوحنیفہؒ کے نزدیک بیع باطل ہو گئی"],["m","وَقَالَ أَبُو يُوسُفَ: عَلَيْهِ قِيمَتُهَا يَوْمَ الْبَيْعِ وَقَالَ مُحَمَّدٌ: عَلَيْهِ قِيمَتُهَا آخِرَ مَا تُعُومِلَ بِهَا",null,"امام ابو یوسفؒ نے فرمایا: اس پر بیع کے دن کی ان کی قیمت لازم ہے، اور امام محمدؒ نے فرمایا: اس پر وہ قیمت لازم ہے جس پر آخری بار ان سے لین دین ہوا"],["m","وَيَجُوزُ الْبَيْعُ بِالْفُلُوسِ النَّافِقَةِ وَإِنْ لَمْ تَتَعَيَّنْ",null,"رائج فلوس سے بیع جائز ہے اگرچہ وہ متعین نہ ہوں"],["m","وَإِنْ كَانَتْ كَاسِدَةً لَمْ يَجُزِ الْبَيْعُ بِهَا حَتَّى يُعَيِّنَهَا",null,"اور اگر وہ بند ہو چکی ہوں تو َّغِيرِ إِلَّا بِإِذْنِ وَلِيِّهِ وَلَا تَصَرُّفُ الْعَبْدِ إِلَّا بِإِذْنِ سَيِّدِهِ",null,"بچے کا تصرف اس کے ولی کی اجازت کے بغیر اور غلام کا تصرف اس کے مالک کی اجازت کے بغیر جائز نہیں"],["m","وَلَا يَجُوزُ تَصَرُّفُ الْمَجْنُونِ الْمَغْلُوبِ عَلَى عَقْلِهِ بِحَالٍ",null,"جس کی عقل مغلوب ہو اس مجنون کا تصرف کسی حال میں جائز نہیں"],["m","وَمَنْ بَاعَ مِنْ هَؤُلَاءِ شَيْئًا أَوِ اشْتَرَاهُ وَهُوَ يَعْقِلُ الْبَيْعَ وَيَقْصِدُهُ فَالْوَلِيُّ بِالْخِيَارِ: إِنْ شَاءَ أَجَازَهُ إِذَا كَانَ فِيهِ مَصْلَحَةٌ وَإِنْ شَاءَ فَسَخَهُ",null,"ان میں سے جس نے کوئی چیز بیچی یا خریدی جبکہ وہ بیع کو سمجھتا اور اس کا ارادہ رکھتا ہو تو ولی کو اختیار ہے: اگر مصلحت ہو تو اجازت دے دے اور چاہے تو فسخ کر دے"],["f","حُكْمُ الْأَقْوَالِ وَالْأَفْعَالِ",null,"اقوال اور افعال کا حکم"],["m","وَهَذِهِ الْمَعَانِي الثَّلَاثَةُ تُوجِبُ الْحَجْرَ فِي الْأَقْوَالِ دُونَ الْأَفْعَالِ",null,"یہ تینوں اسباب اقوال میں حجر واجب کرتے ہیں، افعال میں نہیں"],["m","فَالصَّبِيُّ وَالْمَجْنُونُ لَا تَصِحُّ عُقُودُهُمَا وَلَا إِقْرَارُهُمَا وَلَا يَقَعُ طَلَاقُهُمَا وَلَا عَتَاقُهُمَا",null,"لہٰذا بچے اور مجنون کے عقود صحیح نہیں، ان کا اقرار معتبر نہیں اور ان کی طلاق و آزادی واقع نہیں ہوتی"],["m","وَإِنْ أَتْلَفَا شَيْئًا لَزِمَهُمَا ضَمَانُهُ",null,"اور اگر وہ کوئی چیز تلف کر دیں تو ان پر اس کا ضمان لازم ہے"],["m","وَأَمَّا الْعَبْدُ فَأَقْوَالُهُ نَافِذَةٌ فِي حَقِّ نَفْسِهِ غَيْرُ نَافِذَةٍ فِي حَقِّ مَوْلَاهُ",null,"رہا غلام تو اس کے اقوال اپنے حق میں نافذ ہیں اور اپنے مالک کے حق میں نافذ نہیں"],["m","فَإِنْ أَقَرَّ بِمَالٍ لَزِمَهُ بَعْدَ الْحُرِّيَّةِ وَلَمْ يَلْزَمْهُ فِي الْحَالِ",null,"اگر اس نے مال کا اقرار کیا تو آزاد ہونے کے بعد لازم ہو گا، فوراً لازم نہیں"],["m","وَإِنْ أَقَرَّ بِحَدٍّ أَوْ قِصَاصٍ لَزِمَهُ فِي الْحَالِ وَيَنْفُذُ طَلَاقُهُ",null,"اگر حد یا قصاص کا اقرار کیا تو فوراً لازم ہو گا، اور اس کی طلاق نافذ ہوتی ہے"]]},{"t":"السَّفِيهُ وَبُلُوغُ الصَّبِيِّ","tu":"سفیہ اور بچے کا بلوغ","ed":true,"items":[["f","الْحَجْرُ عَلَى السَّفِيهِ",null,"سفیہ پر حجر"],["m","وَقَالَ أَبُو حَنِيفَةَ: لَا يُحْجَرُ عَلَى السَّفِيهِ إِذَا كَانَ بَالِغًا عَاقِلًا حُرًّا وَتَصَرُّفُهُ فِي مَالِهِ جَائِزٌ",null,"امام ابوحنیفہؒ نے فرمایا: بالغ، عاقل، آزاد سفیہ پر حجر نہیں کیا جائے گا اور اس کا اپنے مال میں تصرف جائز ہے"],["m","وَإِنْ كَانَ مُبَذِّرًا مُفْسِدًا يُتْلِفُ مَالَهُ فِيمَا لَا غَرَضَ لَهُ فِيهِ وَلَا مَصْلَحَةَ",null,"اگرچہ وہ فضول خرچ اور مفسد ہو اور اپنا مال ایسی جگہ ضائع کرے جس میں اس کا کوئی مقصد یا مصلحت نہ ہو"],["m","إِلَّا أَنَّهُ قَالَ: إِذَا بَلَغَ الْغُلَامُ غَيْرَ رَشِيدٍ لَمْ يُسَلَّمْ إِلَيْهِ مَالُهُ حَتَّى يَبْلُغَ خَمْسًا وَعِشْرِينَ سَنَةً",null,"مگر انہوں نے فرمایا: جب لڑکا نادان بالغ ہو تو اسے اس کا مال پچیس سال کی عمر تک حوالے نہیں کیا جائے گا"],["m","فَإِنْ تَصَرَّفَ فِيهِ قَبْلَ ذَلِكَ نَفَذَ تَصَرُّفُهُ",null,"اگر اس سے پہلے اس نے مال میں تصرف کیا تو اس کا تصرف نافذ ہے"],["m","فَإِذَا بَلَغَ خَمْسًا وَعِشْرِينَ سَنَةً سُلِّمَ إِلَيْهِ مَالُهُ وَإِنْ لَمْ يُؤْنَسْ مِنْهُ الرُّشْدُ",null,"جب وہ پچیس سال کا ہو جائے تو اس کا مال اسے دے دیا جائے گا چاہے اس میں سمجھ داری کے آثار نظر نہ آئیں"],["m","وَقَالَ أَبُو يُوسُفَ وَمُحَمَّدٌ: يُحْجَرُ عَلَى السَّفِيهِ وَيُمْنَعُ مِنَ التَّصَرُّفِ فِي مَالِهِ",null,"امام ابو یوسفؒ و امام محمدؒ نے فرمایا: سفیہ پر حجر کیا جائے گا اور اسے اپنے مال میں تصرف سے روکا جائے گا"],["m","فَإِنْ بَاعَ لَمْ يَنْفُذْ بَيْعُهُ فَإِنْ كَانَ فِيهِ مَصْلَحَةٌ أَجَازَهُ الْحَاكِمُ",null,"اگر اس نے بیچا تو بیع نافذ نہ ہو گی، پھر اگر اس میں مصلحت ہو تو حاکم اجازت دے سکتا ہے"],["m","وَإِنْ أَعْتَقَ عَبْدًا نَفَذَ عِتْقُهُ وَكَانَ عَلَى الْعَبْدِ أَنْ يَسْعَى فِي قِيمَتِهِ",null,"اگر اس نے غلام آزاد کیا تو آزادی نافذ ہے اور غلام پر لازم ہے کہ اپنی قیمت کی کمائی کرے"],["m","وَإِنْ تَزَوَّجَ امْرَأَةً جَازَ نِكَاحُهُ فَإِنْ سَمَّى لَهَا مَهْرًا جَازَ مِنْهُ مِقْدَارُ مَهْرِ مِثْلِهَا وَبَطَلَ الْفَضْلُ",null,"اگر کسی عورت سے نکاح کیا تو نکاح جائز ہے، پھر اگر مہر مقرر کیا تو اس میں سے مہرِ مثل کے برابر جائز ہے اور زائد حصہ باطل"],["m","وَقَالَا فِيمَنْ بَلَغَ غَيْرَ رَشِيدٍ: لَا يُدْفَعُ إِلَيْهِ مَالُهُ أَبَدًا حَتَّى يُؤْنَسَ م
